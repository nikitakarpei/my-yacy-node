version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  pebblevault:
    in: .
  membersetfold:
    in: internal/membersetfold/**
  compressionratios:
    in: internal/compressionratios/**

vendors:
  vault:
    in: github.com/nikitakarpei/yacy-rwi-node/vault
  vaultmemberset:
    in: github.com/nikitakarpei/yacy-rwi-node/vault/memberset
  pebble:
    in:
      - github.com/cockroachdb/pebble/v2
      - github.com/cockroachdb/pebble/v2/bloom

deps:
  pebblevault:
    mayDependOn:
      - membersetfold
      - compressionratios
    canUse:
      - vault
      - pebble
  membersetfold:
    canUse:
      - vault
      - vaultmemberset
  compressionratios:
    canUse:
      - pebble

excludeFiles:
  - "_test\\.go"
