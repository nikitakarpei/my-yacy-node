version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  boltvault:
    in:
      - .
      - "**"

vendors:
  vault:
    in: github.com/nikitakarpei/yacy-rwi-node/vault
  vaultmemberset:
    in: github.com/nikitakarpei/yacy-rwi-node/vault/memberset
  bbolt:
    in: go.etcd.io/bbolt

deps:
  boltvault:
    canUse:
      - vault
      - vaultmemberset
      - bbolt

excludeFiles:
  - "_test\\.go"
