version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  pagemarkdownstore:
    in:
      - .
      - "**"

vendors:
  nats:
    in:
      - github.com/nats-io/nats.go
      - github.com/nats-io/nats.go/**
  natstestserver:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/natstestserver

deps:
  pagemarkdownstore:
    mayDependOn:
      - pagemarkdownstore
    canUse:
      - nats
      - natstestserver
