version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

commonVendors:
  - documentextraction
  - canonicalurl

components:
  pageformats:
    in: .
  pagederivationsfulltext:
    in: internal/pagederivations/fulltext/**
  pagederivationsmarkdown:
    in: internal/pagederivations/markdown/**
  pagederivationsreadablehtml:
    in: internal/pagederivations/readablehtml/**
  pagederivationsreadabletext:
    in: internal/pagederivations/readabletext/**
  pagederivationsauxiliarytext:
    in: internal/pagederivations/auxiliarytext/**
  htmlflattening:
    in: internal/htmlflattening/**
  articlefootnotes:
    in: internal/articlefootnotes/**
  articlepermalinks:
    in: internal/articlepermalinks/**
  articlemediawikichrome:
    in: internal/articlemediawikichrome/**
  articleauxiliary:
    in: internal/articleauxiliary/**
  derivationreach:
    in: internal/derivationreach/**
  text:
    in: internal/bodies/text/**

vendors:
  documentextraction:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/documentextraction
  htmltree:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/documentextraction/bodies/htmltree
  canonicalurl:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl/**
  readability:
    in:
      - codeberg.org/readeck/go-readability/v2
  htmltomarkdown:
    in:
      - github.com/JohannesKaufmann/html-to-markdown/v2
  xnet:
    in:
      - golang.org/x/net/**

deps:
  pageformats:
    mayDependOn:
      - derivationreach
      - pagederivationsfulltext
      - pagederivationsmarkdown
      - pagederivationsreadablehtml
      - pagederivationsreadabletext
      - pagederivationsauxiliarytext
  pagederivationsfulltext:
    mayDependOn:
      - htmlflattening
      - text
    canUse:
      - htmltree
  pagederivationsmarkdown:
    mayDependOn:
      - text
    canUse:
      - htmltomarkdown
      - htmltree
  pagederivationsreadablehtml:
    canUse:
      - htmltree
      - readability
      - xnet
  pagederivationsreadabletext:
    mayDependOn:
      - articlefootnotes
      - articlemediawikichrome
      - articlepermalinks
      - htmlflattening
      - text
    canUse:
      - htmltree
  pagederivationsauxiliarytext:
    mayDependOn:
      - articleauxiliary
      - articlefootnotes
      - text
    canUse:
      - htmltree
  articleauxiliary:
    mayDependOn:
      - articlefootnotes
      - htmlflattening
    canUse:
      - xnet
  htmlflattening:
    canUse:
      - xnet
  articlefootnotes:
    canUse:
      - xnet
  articlepermalinks:
    canUse:
      - xnet
  articlemediawikichrome:
    canUse:
      - xnet

excludeFiles:
  - "_test\\.go"
