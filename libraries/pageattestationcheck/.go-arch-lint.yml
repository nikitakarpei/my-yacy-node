version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  pageattestationcheck:
    in: .
  pageattestationchecktest:
    in: pageattestationchecktest/**
  androidtrustsourceshttp:
    in: androidtrustsources/http/**
  renewalobserversapplog:
    in: renewalobservers/applog/**

vendors:
  attestedstatements:
    in: github.com/nikitakarpei/yacy-rwi-node/attestedstatements
  verifier:
    in:
      - github.com/nikitakarpei/hardware-attested-statements/verifier
      - github.com/nikitakarpei/hardware-attested-statements/verifier/profiles/android
  pagerwicontract:
    in: github.com/nikitakarpei/yacy-rwi-node/pagerwicontract
  yacymodel:
    in: github.com/nikitakarpei/yacy-rwi-node/yacymodel
  trustedappreleases:
    in: github.com/nikitakarpei/yacy-rwi-node/trustedappreleases
  companionapp:
    in: github.com/nikitakarpei/yacy-rwi-node/companionapp
  timestamp:
    in:
      - github.com/digitorus/timestamp
      - github.com/transparency-dev/merkle/rfc6962

deps:
  pageattestationcheck:
    canUse:
      - attestedstatements
      - verifier
      - pagerwicontract
      - yacymodel
      - trustedappreleases
      - companionapp
  pageattestationchecktest:
    mayDependOn:
      - pageattestationcheck
    canUse:
      - verifier
      - trustedappreleases
      - timestamp
      - companionapp

  androidtrustsourceshttp:
    canUse:
      - verifier

excludeFiles:
  - "_test\\.go"
