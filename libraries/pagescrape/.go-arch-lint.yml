version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  pagescrape:
    in: .
  pagefetch:
    in: pagefetch/**
  pagefetchershttp:
    in: pagefetchers/http/**
  contentformatgraph:
    in: contentformatgraph/**
  pagederivationsfulltext:
    in: pagederivations/fulltext/**
  pagederivationsmarkdown:
    in: pagederivations/markdown/**
  pagederivationsreadablehtml:
    in: pagederivations/readablehtml/**
  pagederivationsreadabletext:
    in: pagederivations/readabletext/**
  htmlflattening:
    in: htmlflattening/**

vendors:
  documentextraction:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/documentextraction
  canonicalurl:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl/**
  readability:
    in:
      - codeberg.org/readeck/go-readability/v2
  htmltomarkdown:
    in:
      - github.com/JohannesKaufmann/html-to-markdown/v2
  xnet:
    in:
      - golang.org/x/net/**

deps:
  pagescrape:
    mayDependOn:
      - pagefetch
      - contentformatgraph
      - pagederivationsfulltext
      - pagederivationsmarkdown
      - pagederivationsreadablehtml
      - pagederivationsreadabletext
    canUse:
      - canonicalurl
      - documentextraction
  pagefetchershttp:
    mayDependOn:
      - pagefetch
  contentformatgraph:
    canUse:
      - documentextraction
  pagederivationsfulltext:
    mayDependOn:
      - htmlflattening
    canUse:
      - documentextraction
  pagederivationsmarkdown:
    canUse:
      - documentextraction
      - htmltomarkdown
  pagederivationsreadablehtml:
    mayDependOn:
      - contentformatgraph
    canUse:
      - documentextraction
      - readability
      - xnet
  pagederivationsreadabletext:
    mayDependOn:
      - htmlflattening
    canUse:
      - documentextraction
  htmlflattening:
    canUse:
      - xnet

excludeFiles:
  - "_test\\.go"
