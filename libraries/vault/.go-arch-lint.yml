version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  vault:
    in: .
  vaultenginetest:
    in: vaultenginetest/**
  memberset:
    in: memberset/**
  expiringrecords:
    in: expiringrecords/**
  vaultmetrics:
    in: vaultmetrics/**

vendors:
  orderedcode:
    in: github.com/google/orderedcode
  prometheus:
    in: github.com/prometheus/client_golang/**

deps:
  vault:
    canUse:
      - orderedcode
  vaultenginetest:
    mayDependOn:
      - vault
  memberset:
    mayDependOn:
      - vault
  expiringrecords:
    mayDependOn:
      - vault
  vaultmetrics:
    mayDependOn:
      - vault
    canUse:
      - prometheus

excludeFiles:
  - "_test\\.go"
