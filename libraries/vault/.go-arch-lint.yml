version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  vault:
    in: .
  vaultenginetest:
    in: vaultenginetest/**
  memberset:
    in: memberset/**
  expiringrecords:
    in: expiringrecords/**

vendors:
  orderedcode:
    in: github.com/google/orderedcode

deps:
  vault:
    canUse:
      - orderedcode
  vaultenginetest:
    mayDependOn:
      - vault
  memberset:
    mayDependOn:
      - vault
  expiringrecords:
    mayDependOn:
      - vault

excludeFiles:
  - "_test\\.go"
