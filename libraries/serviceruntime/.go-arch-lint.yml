version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  budgetbuckets:
    in: budgetbuckets/**
  applog:
    in: applog/**
  envconfig:
    in: envconfig/**
  httpobservation:
    in: httpobservation/**
  httpaccesslog:
    in: httpaccesslog/**
  httpmetrics:
    in: httpmetrics/**
  opsmetrics:
    in: opsmetrics/**
  servergroup:
    in: servergroup/**
  streamopening:
    in: streamopening/**
  poisonhalt:
    in: poisonhalt/**
  pullintake:
    in: pullintake
  pullintaketest:
    in: pullintake/pullintaketest/**
  consumerbacklog:
    in: pullintake/admissions/consumerbacklog/**
  jetstreamconnect:
    in: jetstreamconnect/**
  foregroundprocess:
    in: foregroundprocess/**
  processenvironmentleaseclient:
    in: processenvironmentleaseclient/**
  processenvironmentleaseserver:
    in: processenvironmentleaseserver/**
  processentrypoint:
    in: processentrypoint/**

vendors:
  errgroup:
    in:
      - golang.org/x/sync/errgroup
  nats:
    in:
      - github.com/nats-io/nats.go
      - github.com/nats-io/nats.go/**
  processenvironmentlease:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/processenvironmentlease
  prometheus:
    in:
      - github.com/prometheus/client_golang/**

deps:
  httpaccesslog:
    mayDependOn:
      - httpobservation
  httpmetrics:
    mayDependOn:
      - httpobservation
    canUse:
      - prometheus
  opsmetrics:
    mayDependOn:
      - servergroup
    canUse:
      - prometheus
  servergroup:
    canUse:
      - errgroup
  pullintake:
    canUse:
      - nats
      - errgroup
  pullintaketest:
    canUse:
      - nats
  consumerbacklog:
    canUse:
      - nats
      - prometheus
  jetstreamconnect:
    canUse:
      - nats
  processenvironmentleaseclient:
    canUse:
      - processenvironmentlease
  processenvironmentleaseserver:
    canUse:
      - processenvironmentlease
  processentrypoint:
    mayDependOn:
      - foregroundprocess
      - processenvironmentleaseclient

excludeFiles:
  - "_test\\.go"
