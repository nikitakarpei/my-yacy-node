version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  applog:
    in: applog/**
  envconfig:
    in: envconfig/**
  opsmetrics:
    in: opsmetrics/**
  servergroup:
    in: servergroup/**
  poisonhalt:
    in: poisonhalt/**
  pullintake:
    in: pullintake/**
  jetstreamconnect:
    in: jetstreamconnect/**

vendors:
  errgroup:
    in:
      - golang.org/x/sync/errgroup
  nats:
    in:
      - github.com/nats-io/nats.go
      - github.com/nats-io/nats.go/**
  natstestserver:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/natstestserver

deps:
  applog:
    mayDependOn:
      - applog
  envconfig:
    mayDependOn:
      - envconfig
  opsmetrics:
    mayDependOn:
      - opsmetrics
  servergroup:
    mayDependOn:
      - servergroup
    canUse:
      - errgroup
  poisonhalt:
    mayDependOn:
      - poisonhalt
    canUse:
      - nats
  pullintake:
    mayDependOn:
      - pullintake
    canUse:
      - nats
      - errgroup
  jetstreamconnect:
    mayDependOn:
      - jetstreamconnect
    canUse:
      - nats
      - natstestserver
