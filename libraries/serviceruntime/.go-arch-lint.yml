version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  applog:
    in: applog/**
  envconfig:
    in: envconfig/**
  opsmetrics:
    in: opsmetrics/**
  servergroup:
    in: servergroup/**
  poisonhalt:
    in: poisonhalt/**
  pullintake:
    in: pullintake/**
  jetstreamconnect:
    in: jetstreamconnect/**

vendors:
  errgroup:
    in:
      - golang.org/x/sync/errgroup
  nats:
    in:
      - github.com/nats-io/nats.go
      - github.com/nats-io/nats.go/**

deps:
  servergroup:
    canUse:
      - errgroup
  poisonhalt:
    canUse:
      - nats
  pullintake:
    canUse:
      - nats
      - errgroup
  jetstreamconnect:
    canUse:
      - nats

excludeFiles:
  - "_test\\.go"
