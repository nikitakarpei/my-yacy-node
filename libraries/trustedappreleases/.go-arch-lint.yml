version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  trustedappreleases:
    in: .
  provenanceverifierssigstore:
    in: provenanceverifiers/sigstore/**
  releasesourcesgithub:
    in: releasesources/github/**
  denialsourceshttp:
    in: denialsources/http/**
  denialsourcesfile:
    in: denialsources/file/**
  trustedrootstuf:
    in: trustedroots/tuf/**
  refreshobserversapplog:
    in: refreshobservers/applog/**

vendors:
  sigstore:
    in: github.com/sigstore/sigstore-go/**

deps:
  provenanceverifierssigstore:
    mayDependOn:
      - trustedappreleases
    canUse:
      - sigstore
  releasesourcesgithub:
    mayDependOn:
      - trustedappreleases
  denialsourceshttp:
    mayDependOn:
      - trustedappreleases
  denialsourcesfile:
    mayDependOn:
      - trustedappreleases
  trustedrootstuf:
    canUse:
      - sigstore

excludeFiles:
  - "_test\\.go"
