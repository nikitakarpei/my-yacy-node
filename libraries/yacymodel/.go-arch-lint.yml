version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  yacymodel:
    in:
      - .
  peerkeytest:
    in:
      - peerkeytest/**
  urlhashtest:
    in:
      - urlhashtest/**

vendors:
  circl:
    in:
      - github.com/cloudflare/circl/sign/slhdsa

deps:
  yacymodel:
    canUse:
      - circl
  peerkeytest:
    mayDependOn:
      - yacymodel
  urlhashtest:
    mayDependOn:
      - yacymodel

excludeFiles:
  - "_test\\.go"
