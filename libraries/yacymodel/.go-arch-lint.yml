version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  yacymodel:
    in:
      - .
  postingstree:
    in:
      - internal/postingstree/**
  peerkeytest:
    in:
      - peerkeytest/**
  urlhashtest:
    in:
      - urlhashtest/**

vendors:
  circl:
    in:
      - github.com/cloudflare/circl/sign/slhdsa
  storedfields:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/storedfields

deps:
  yacymodel:
    mayDependOn:
      - postingstree
    canUse:
      - circl
      - storedfields
  peerkeytest:
    mayDependOn:
      - yacymodel
  urlhashtest:
    mayDependOn:
      - yacymodel

excludeFiles:
  - "_test\\.go"
