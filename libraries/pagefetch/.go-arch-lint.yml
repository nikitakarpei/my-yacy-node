version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  pagefetch:
    in: .
  pagefetchershttp:
    in: pagefetchers/http/**
  redirectfollowingfetch:
    in: redirectfollowingfetch/**

vendors:
  optional:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/optional
  canonicalurl:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl/**
  spamassessmenthttpheader:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/spamassessment/httpheader

deps:
  pagefetch:
    canUse:
      - canonicalurl
      - optional
  pagefetchershttp:
    mayDependOn:
      - pagefetch
    canUse:
      - canonicalurl
      - optional
      - spamassessmenthttpheader
  redirectfollowingfetch:
    mayDependOn:
      - pagefetch
    canUse:
      - canonicalurl
      - optional

excludeFiles:
  - "_test\\.go"
