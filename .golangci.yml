version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errname
    - errorlint
    - exhaustive
    - funlen
    - gocritic
    - gocognit
    - gosec
    - iface
    - interfacebloat
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - revive
    - sloglint
    - testifylint
    - testpackage
    - unconvert
    - unparam
    - usestdlibvars
    - wrapcheck
  settings:
    exhaustive:
      default-signifies-exhaustive: true
      ignore-enum-types: golang.org/x/net/html/atom.Atom
    funlen:
      lines: 80
      statements: 50
      ignore-comments: true
    gocognit:
      min-complexity: 20
    gosec:
      excludes:
        - G401
        - G501
    revive:
      rules:
        - name: argument-limit
          arguments:
            - 5
    wrapcheck:
      ignore-package-globs:
        - github.com/nikitakarpei/yacy-rwi-node/*
        - golang.org/x/sync/errgroup
        - google.golang.org/grpc/status
    testpackage:
      allow-packages:
        - e2e
      skip-regexp: $^
    sloglint:
      attr-only: true
      context: all
      key-naming-case: camel
      static-msg: true
  exclusions:
    generated: strict
    rules:
      - path: (^|/)cmd/
        linters:
          - funlen
      - path: (^|/)cmd/
        linters:
          - revive
        text: argument-limit
      - path: (^|/)test/e2e(harness)?/
        linters:
          - revive
        text: argument-limit
      - path: (^|/)test/e2e/
        linters:
          - gosec
        text: G101

formatters:
  enable:
    - gofumpt
    - gci
    - golines
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/nikitakarpei/yacy-rwi-node)
    golines:
      max-len: 100
