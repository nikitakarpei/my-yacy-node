{{define "header"}}
  <div id="paused-banner" class="banner paused" role="status"{{if not .FetchingPaused}} hidden{{end}}>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
    Page fetching is paused: no companion is connected.
  </div>
  {{if .PairedDeviceName}}<div class="banner" role="status">{{.PairedDeviceName}} is paired.</div>{{end}}
  <nav class="tabs webui-tab-links" aria-label="Companions">
    <a href="{{.DevicesPath}}"{{if .DevicesTabCurrent}} aria-current="page"{{end}}>Devices</a>
    <a href="{{.SettingsPath}}"{{if .SettingsTabCurrent}} aria-current="page"{{end}}>Settings</a>
  </nav>
{{end}}
