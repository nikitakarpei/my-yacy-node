<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pair a companion</title>
<link rel="stylesheet" href="{{.Frame.WebUIStylesheet}}">
<link rel="stylesheet" href="{{.CompanionPath}}/assets/companions.css">
<script src="{{.CompanionPath}}/assets/pairing.js" defer></script>
</head>
<body>
{{.Frame.TabBar}}
<main data-events="{{.EventsPath}}">
  <h1>Pair a companion</h1>
  <div class="alert" role="alert" hidden>
    <p class="alert-title"></p>
    <p class="alert-cause"></p>
  </div>
  <div class="card pairing">
    <div class="code">
      <div class="code-image"></div>
      <div class="code-state" role="status" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <span class="code-state-text"></span>
      </div>
    </div>
    <div class="steps">
      <ol>
        <li>Connect the Android device to the same network as the peer.</li>
        <li>Scan this code with the <a href="{{.Frame.AppGuideURL}}">YaCy Companion app</a>.</li>
      </ol>
      <div><a class="button" href="{{.CompanionPath}}">Cancel</a></div>
    </div>
  </div>
</main>
</body>
</html>
