version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  serviceenvironment:
    in: internal/serviceenvironment/**
  servicelog:
    in: internal/servicelog/**
  natsbroker:
    in: internal/natsbroker/**
  egressproxy:
    in: internal/egressproxy/**
  yacypeerassembly:
    in: assembly/**
  yacypeercmd:
    in: cmd/yacypeer/**

vendors:
  serviceruntime:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/servergroup
  natsserver:
    in:
      - github.com/nats-io/nats-server/v2/**
  smokescreen:
    in:
      - github.com/stripe/smokescreen/pkg/smokescreen/**
  logrus:
    in:
      - github.com/sirupsen/logrus
deps:
  natsbroker:
    canUse:
      - natsserver
  egressproxy:
    canUse:
      - smokescreen
      - logrus
      - serviceruntime
  yacypeerassembly:
    anyProjectDeps: true
    anyVendorDeps: true
  yacypeercmd:
    mayDependOn:
      - yacypeerassembly
    canUse:
      - serviceruntime

excludeFiles:
  - "_test\\.go"
