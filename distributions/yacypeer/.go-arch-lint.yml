version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  serviceenvironment:
    in: internal/serviceenvironment/**
  servicelog:
    in: internal/servicelog/**
  natsbroker:
    in: internal/natsbroker/**
  egressproxy:
    in: internal/egressproxy/**
  cachedpages:
    in: internal/cachedpages/**
  pagecacheproxy:
    in: internal/pagecacheproxy/**
  processnetwork:
    in: internal/processnetwork/**
  visitlinksecret:
    in: internal/visitlinksecret/**
  peerkey:
    in: internal/peerkey/**
  metrichistory:
    in: internal/metrichistory/**
  webuitabs:
    in: internal/webuitabs/**
  dashboardpage:
    in: internal/dashboardpage/**
  webuiproxy:
    in: internal/webuiproxy/**
  brokerkey:
    in: internal/companions/brokerkey/**
  paireddevices:
    in: internal/companions/paireddevices/**
  pairingoffers:
    in: internal/companions/pairingoffers/**
  companionaccess:
    in: internal/companions/companionaccess/**
  yacypeerassembly:
    in: assembly/**
  yacypeercmd:
    in: cmd/yacypeer/**

vendors:
  serviceruntime:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/servergroup
  natspermissions:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/natspermissions
  natsserver:
    in:
      - github.com/nats-io/nats-server/v2/**
  smokescreen:
    in:
      - github.com/stripe/smokescreen/pkg/smokescreen
      - github.com/stripe/smokescreen/pkg/smokescreen/conntrack
  logrus:
    in:
      - github.com/sirupsen/logrus
  prometheusclient:
    in:
      - github.com/prometheus/client_golang/prometheus
      - github.com/prometheus/common/expfmt
      - github.com/prometheus/common/model
  prometheusquery:
    in:
      - github.com/prometheus/prometheus/model/labels
      - github.com/prometheus/prometheus/promql
      - github.com/prometheus/prometheus/promql/parser
      - github.com/prometheus/prometheus/storage
      - github.com/prometheus/prometheus/tsdb/chunkenc
      - github.com/prometheus/prometheus/tsdb/chunks
      - github.com/prometheus/prometheus/tsdb/encoding
      - github.com/prometheus/prometheus/util/annotations
  webuistyle:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/webuistyle
  companionprotocol:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/companionprotocol
  zstd:
    in:
      - github.com/klauspost/compress/zstd
  yacymodel:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/yacymodel
  vault:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/vault
      - github.com/nikitakarpei/yacy-rwi-node/vaultengines/pebblevault
deps:
  natsbroker:
    canUse:
      - natsserver
  egressproxy:
    canUse:
      - smokescreen
      - logrus
      - serviceruntime
  cachedpages:
    canUse:
      - prometheusclient
      - zstd
  pagecacheproxy:
    mayDependOn:
      - cachedpages
    canUse:
      - prometheusclient
      - serviceruntime
  metrichistory:
    canUse:
      - prometheusclient
      - prometheusquery
      - vault
  webuitabs:
    canUse:
      - webuistyle
  peerkey:
    canUse:
      - yacymodel
  dashboardpage:
    canUse:
      - prometheusclient
      - prometheusquery
      - webuistyle
  paireddevices:
    canUse:
      - companionprotocol
  pairingoffers:
    canUse:
      - companionprotocol
  companionaccess:
    canUse:
      - companionprotocol
      - natspermissions
      - natsserver
  yacypeerassembly:
    anyProjectDeps: true
    anyVendorDeps: true
  yacypeercmd:
    mayDependOn:
      - yacypeerassembly
    canUse:
      - serviceruntime

excludeFiles:
  - "_test\\.go"
