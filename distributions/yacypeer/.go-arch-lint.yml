version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  memberenvironment:
    in: internal/memberenvironment/**
  memberlog:
    in: internal/memberlog/**
  natsbroker:
    in: internal/natsbroker/**
  yacypeerassembly:
    in: assembly/**
  yacypeercmd:
    in: cmd/yacypeer/**

vendors:
  serviceruntime:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/servergroup
  natsserver:
    in:
      - github.com/nats-io/nats-server/v2/**
deps:
  natsbroker:
    canUse:
      - natsserver
  yacypeerassembly:
    anyProjectDeps: true
    anyVendorDeps: true
  yacypeercmd:
    mayDependOn:
      - yacypeerassembly
    canUse:
      - serviceruntime

excludeFiles:
  - "_test\\.go"
