version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  serviceenvironment:
    in: internal/serviceenvironment/**
  servicelog:
    in: internal/servicelog/**
  natsbroker:
    in: internal/natsbroker/**
  egressproxy:
    in: internal/egressproxy/**
  loopback:
    in: internal/loopback/**
  visitlinksecret:
    in: internal/visitlinksecret/**
  yggdrasilkey:
    in: internal/yggdrasilkey/**
  yggdrasilnode:
    in: internal/yggdrasilnode/**
  yggdrasilpeerlist:
    in: internal/yggdrasilpeerlist/**
  yggdrasilpeerchoice:
    in: internal/yggdrasilpeerchoice/**
  connecttimers:
    in: internal/connecttimers/**
  ipv6stack:
    in: internal/ipv6stack/**
  jointlistener:
    in: internal/jointlistener/**
  metrichistory:
    in: internal/metrichistory/**
  dashboardpage:
    in: internal/dashboardpage/**
  yacypeerassembly:
    in: assembly/**
  yacypeercmd:
    in: cmd/yacypeer/**

vendors:
  serviceruntime:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/servergroup
  natsserver:
    in:
      - github.com/nats-io/nats-server/v2/**
  smokescreen:
    in:
      - github.com/stripe/smokescreen/pkg/smokescreen
      - github.com/stripe/smokescreen/pkg/smokescreen/conntrack
  logrus:
    in:
      - github.com/sirupsen/logrus
  yggdrasil:
    in:
      - github.com/yggdrasil-network/yggdrasil-go/src/address
      - github.com/yggdrasil-network/yggdrasil-go/src/config
      - github.com/yggdrasil-network/yggdrasil-go/src/core
      - github.com/yggdrasil-network/yggdrasil-go/src/ipv6rwc
  gvisor:
    in:
      - gvisor.dev/gvisor/pkg/**
  prometheusclient:
    in:
      - github.com/prometheus/client_golang/prometheus
      - github.com/prometheus/common/expfmt
      - github.com/prometheus/common/model
  prometheusquery:
    in:
      - github.com/prometheus/prometheus/model/labels
      - github.com/prometheus/prometheus/promql
      - github.com/prometheus/prometheus/promql/parser
      - github.com/prometheus/prometheus/storage
      - github.com/prometheus/prometheus/tsdb/chunkenc
      - github.com/prometheus/prometheus/tsdb/chunks
      - github.com/prometheus/prometheus/tsdb/encoding
      - github.com/prometheus/prometheus/util/annotations
  vault:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/vault
      - github.com/nikitakarpei/yacy-rwi-node/vaultengines/pebblevault
deps:
  natsbroker:
    mayDependOn:
      - loopback
    canUse:
      - natsserver
  loopback:
    canUse:
      - serviceruntime
  egressproxy:
    mayDependOn:
      - loopback
    canUse:
      - smokescreen
      - logrus
      - serviceruntime
  yggdrasilnode:
    canUse:
      - yggdrasil
  yggdrasilpeerlist:
    canUse:
      - yggdrasil
  yggdrasilpeerchoice:
    mayDependOn:
      - yggdrasilpeerlist
  ipv6stack:
    canUse:
      - gvisor
  metrichistory:
    canUse:
      - prometheusclient
      - prometheusquery
      - vault
  dashboardpage:
    canUse:
      - prometheusclient
      - prometheusquery
  yacypeerassembly:
    anyProjectDeps: true
    anyVendorDeps: true
  yacypeercmd:
    mayDependOn:
      - yacypeerassembly
    canUse:
      - serviceruntime

excludeFiles:
  - "_test\\.go"
