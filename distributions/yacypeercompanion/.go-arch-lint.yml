version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  brokeraccess:
    in: brokeraccess
  brokeraccesstest:
    in: brokeraccess/brokeraccesstest/**
  pairingrequests:
    in: pairingrequests/**
  pageservices:
    in: pageservices/**

vendors:
  companionprotocol:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/companionprotocol
  natsclient:
    in:
      - github.com/nats-io/nats.go
  jetstreamconnect:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/jetstreamconnect
  natsserver:
    in:
      - github.com/nats-io/nats-server/v2/**
  wallclock:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/wallclock

deps:
  brokeraccess:
    canUse:
      - companionprotocol
      - jetstreamconnect
      - natsclient
  brokeraccesstest:
    canUse:
      - companionprotocol
      - natsclient
      - natsserver
  pairingrequests:
    mayDependOn:
      - brokeraccess
    canUse:
      - companionprotocol
      - natsclient
      - wallclock
  pageservices:
    mayDependOn:
      - brokeraccess
      - pairingrequests
    anyVendorDeps: true
excludeFiles:
  - "_test\\.go"
