version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  brokeraccess:
    in: brokeraccess
  brokeraccesstest:
    in: brokeraccess/brokeraccesstest/**
  pairing:
    in: pairing/**
  pageservices:
    in: pageservices/**

vendors:
  companionprotocol:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/companionprotocol
  natsclient:
    in:
      - github.com/nats-io/nats.go
  natsserver:
    in:
      - github.com/nats-io/nats-server/v2/**

deps:
  brokeraccess:
    canUse:
      - companionprotocol
      - natsclient
  brokeraccesstest:
    canUse:
      - companionprotocol
      - natsclient
      - natsserver
  pairing:
    mayDependOn:
      - brokeraccess
    canUse:
      - companionprotocol
      - natsclient
  pageservices:
    mayDependOn:
      - brokeraccess
      - pairing
    anyVendorDeps: true
excludeFiles:
  - "_test\\.go"
