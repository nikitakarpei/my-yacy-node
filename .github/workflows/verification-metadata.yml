name: verification-metadata

on:
  push:
    branches: ["dependabot/gradle/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-metadata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore pinned toolchain
        id: toolchain-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .toolchain/bin
            .toolchain/go
            .toolchain/jdk
            .toolchain/android-sdk
            .toolchain/activate
            .toolchain/installed-verify.lock
            .toolchain/installed-android.lock
          key: android-toolchain-${{ runner.os }}-${{ hashFiles('tools/install', 'tools/tools.lock') }}

      - name: Install the pinned tools
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: ./tools/install verify && ./tools/install android

      - name: Write the verification metadata again
        run: . .toolchain/activate && make android-app-verification-metadata

      - name: Compare
        id: diff
        run: |
          if git diff --quiet -- distributions/yacypeercompanion/gradle/verification-metadata.xml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- distributions/yacypeercompanion/gradle/verification-metadata.xml
          fi

      - name: Keep the new verification metadata
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-metadata
          path: distributions/yacypeercompanion/gradle/verification-metadata.xml
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: regenerate
    if: needs.regenerate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Get the new verification metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verification-metadata
          path: ${{ runner.temp }}/new

      - name: Commit the verification metadata, signed by GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          jq -n --rawfile contents "$RUNNER_TEMP/new/verification-metadata.xml" \
            --arg repo "$REPO" --arg branch "$BRANCH" --arg head "$HEAD_SHA" '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: { input: {
                branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                expectedHeadOid: $head,
                message: { headline: "Write the verification metadata of the companion app again" },
                fileChanges: { additions: [{
                  path: "distributions/yacypeercompanion/gradle/verification-metadata.xml",
                  contents: ($contents | @base64)
                }] }
              } }
            }' > "$RUNNER_TEMP/commit.json"
          gh api graphql --input "$RUNNER_TEMP/commit.json" --jq '.data.createCommitOnBranch.commit.oid'

      - name: Start the checks on the new commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          for workflow in ci.yml codeql.yml; do
            gh workflow run "$workflow" --repo "$REPO" --ref "$BRANCH"
          done
