name: verify

on:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: services/yacynode/go.mod
          cache-dependency-path: "**/go.sum"

      - name: Cache tool binaries
        uses: actions/cache@v6
        with:
          path: .toolchain/bin
          key: tools-${{ runner.os }}-${{ hashFiles('tools/tools.lock') }}

      - name: Run make verify
        run: make verify
