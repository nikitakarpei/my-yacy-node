name: verify

on:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache pinned toolchain
        uses: actions/cache@v6
        with:
          path: |
            .toolchain/bin
            .toolchain/go
          key: toolchain-${{ runner.os }}-${{ hashFiles('tools/install', 'tools/tools.lock') }}

      - name: Cache Go modules, build output and lint results
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-
            go-${{ runner.os }}-

      - name: Cache Python packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/requirements-dev.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Run make verify
        run: make verify RACE_FLAG=-race
