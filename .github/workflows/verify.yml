name: verify

on:
  workflow_call:
    inputs:
      markdown-only:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore pinned toolchain
        id: toolchain-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .toolchain/bin
            .toolchain/go
            .toolchain/activate
            .toolchain/installed-verify.lock
          key: toolchain-${{ runner.os }}-${{ hashFiles('tools/install', 'tools/tools.lock') }}

      - name: Restore Go modules, build output and lint results
        if: ${{ !inputs.markdown-only }}
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .toolchain/gomodcache
            .toolchain/gocache
            .toolchain/golangci-lint-cache
          key: go-verify-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-verify-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-
            go-verify-${{ runner.os }}-

      - name: Restore pinned Python and its packages
        if: ${{ !inputs.markdown-only }}
        id: python-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .toolchain/python
            .toolchain/uvcache
          key: uv-${{ runner.os }}-${{ hashFiles('tools/tools.lock', '.python-version', 'uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install the pinned tools
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: ./tools/install verify

      - name: Run make verify
        if: ${{ !inputs.markdown-only }}
        run: . .toolchain/activate && make verify RACE_FLAG=-race

      - name: Lint the Markdown files
        if: ${{ inputs.markdown-only }}
        run: . .toolchain/activate && make lint-md

      - name: Save pinned toolchain
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .toolchain/bin
            .toolchain/go
            .toolchain/activate
            .toolchain/installed-verify.lock
          key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}

      - name: Save Go modules, build output and lint results
        if: ${{ !inputs.markdown-only && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .toolchain/gomodcache
            .toolchain/gocache
            .toolchain/golangci-lint-cache
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

      - name: Save pinned Python and its packages
        if: ${{ !inputs.markdown-only && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.python-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .toolchain/python
            .toolchain/uvcache
          key: ${{ steps.python-cache.outputs.cache-primary-key }}
