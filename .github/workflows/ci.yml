name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
      markdown-only: ${{ steps.scope.outputs.markdown-only }}
      android-app: ${{ steps.scope.outputs.android-app }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Find the jobs that the changed files need
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -o pipefail
          everything() {
            echo "$1, so every job runs"
            printf 'code=true\nmarkdown-only=false\nandroid-app=true\n' >>"$GITHUB_OUTPUT"
            exit 0
          }
          case "$EVENT" in
            pull_request) base=HEAD^1 ;;
            push)
              case "$BEFORE" in ""|0000000000000000000000000000000000000000) everything "no previous commit" ;; esac
              git fetch --quiet --depth=1 origin "$BEFORE" || everything "previous commit not found"
              base=$BEFORE
              ;;
            *) everything "started by $EVENT" ;;
          esac
          git diff --name-only "$base" HEAD >"$RUNNER_TEMP/changed"
          cat "$RUNNER_TEMP/changed"
          app=distributions/yacypeercompanion
          {
            echo "$app/"
            sed -n 's|^replace .* => \.\./\.\./\(.*\)$|\1/|p' "$app/go.mod"
            printf '%s\n' tools/ Makefile .github/workflows/android-app.yml .github/workflows/ci.yml
          } >"$RUNNER_TEMP/android-app-inputs"
          grep -v '\.md$' "$RUNNER_TEMP/changed" >"$RUNNER_TEMP/not-markdown" || true
          has() { [ -s "$1" ] && echo true || echo false; }
          grep -v -e "^$app/" -e '^\.github/workflows/android-app\.yml$' "$RUNNER_TEMP/not-markdown" >"$RUNNER_TEMP/code" || true
          awk 'NR == FNR { inputs[++n] = $0; next } { for (i = 1; i <= n; i++) if (index($0, inputs[i]) == 1) { print; next } }' \
            "$RUNNER_TEMP/android-app-inputs" "$RUNNER_TEMP/not-markdown" >"$RUNNER_TEMP/android-app" || true
          markdown_only=true
          [ -s "$RUNNER_TEMP/not-markdown" ] && markdown_only=false
          {
            echo "code=$(has "$RUNNER_TEMP/code")"
            echo "markdown-only=$markdown_only"
            echo "android-app=$(has "$RUNNER_TEMP/android-app")"
          } | tee -a "$GITHUB_OUTPUT"

  verify:
    needs: scope
    uses: ./.github/workflows/verify.yml
    with:
      markdown-only: ${{ needs.scope.outputs.markdown-only == 'true' }}

  e2e:
    needs: scope
    uses: ./.github/workflows/e2e.yml
    with:
      run: ${{ needs.scope.outputs.code == 'true' }}

  android-app:
    needs: scope
    uses: ./.github/workflows/android-app.yml
    with:
      run: ${{ needs.scope.outputs.android-app == 'true' }}

  build-yacynode:
    needs: [scope, verify, e2e]
    if: github.ref == 'refs/heads/main' && needs.scope.outputs.code == 'true'
    uses: ./.github/workflows/build-yacynode.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    secrets: inherit

  build-yacypeer:
