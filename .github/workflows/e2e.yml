name: e2e

on:
  workflow_call:

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache pinned toolchain
        uses: actions/cache@v6
        with:
          path: |
            .toolchain/bin
            .toolchain/go
          key: toolchain-${{ runner.os }}-${{ hashFiles('tools/install', 'tools/tools.lock') }}

      - name: Cache Go modules and build output
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Run e2e suites
        env:
          E2E_CONTAINER_LOG_DIR: ${{ github.workspace }}/e2e-container-logs
        run: |
          mkdir -p "$E2E_CONTAINER_LOG_DIR"
          make e2e

      - name: Upload container logs of failed suites
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-container-logs
          path: e2e-container-logs/
          if-no-files-found: ignore
          retention-days: 14
