name: e2e

on:
  workflow_call:
    inputs:
      run:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  e2e:
    if: inputs.run
    runs-on: ubuntu-latest
    env:
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore pinned toolchain
        id: toolchain-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .toolchain/bin
            .toolchain/go
            .toolchain/activate
            .toolchain/installed-verify.lock
          key: toolchain-${{ runner.os }}-${{ hashFiles('tools/install', 'tools/tools.lock') }}

      - name: Restore Go modules and build output
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .toolchain/gomodcache
            .toolchain/gocache
          key: go-e2e-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-e2e-${{ runner.os }}-

      - name: Install the pinned tools
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: ./tools/install verify

      - name: Run e2e suites
        env:
          E2E_CONTAINER_LOG_DIR: ${{ github.workspace }}/e2e-container-logs
        run: |
          mkdir -p "$E2E_CONTAINER_LOG_DIR"
          . .toolchain/activate
          make e2e

      - name: Save pinned toolchain
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .toolchain/bin
            .toolchain/go
            .toolchain/activate
            .toolchain/installed-verify.lock
          key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}

      - name: Save Go modules and build output
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .toolchain/gomodcache
            .toolchain/gocache
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

      - name: Upload container logs of failed suites
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-container-logs
          path: e2e-container-logs/
          if-no-files-found: ignore
          retention-days: 14
