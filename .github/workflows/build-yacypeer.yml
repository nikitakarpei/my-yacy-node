name: build-yacypeer

on:
  workflow_call:

permissions:
  contents: read

env:
  RELEASES_KEPT: 3

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      matrix:
        target:
          - { goos: linux, goarch: amd64, binary: yacypeer-linux-amd64 }
          - { goos: linux, goarch: arm64, binary: yacypeer-linux-arm64 }
          - { goos: darwin, goarch: amd64, binary: yacypeer-darwin-amd64 }
          - { goos: darwin, goarch: arm64, binary: yacypeer-darwin-arm64 }
          - { goos: windows, goarch: amd64, binary: yacypeer-windows-amd64.exe }
          - { goos: windows, goarch: arm64, binary: yacypeer-windows-arm64.exe }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache the pinned Go and Zig
        id: toolchain-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .toolchain/bin
            .toolchain/go
            .toolchain/zig
            .toolchain/activate
          key: toolchain-go-zig-${{ runner.os }}-${{ hashFiles('tools/install', 'tools/tools.lock') }}

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .toolchain/gomodcache
          key: go-modules-yacypeer-${{ runner.os }}-${{ hashFiles('distributions/yacypeer/go.sum') }}
          restore-keys: go-modules-yacypeer-${{ runner.os }}-

      - name: Install the pinned Go and Zig
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: ./tools/install go zig

      - name: Build
        run: |
          . .toolchain/activate
          distributions/yacypeer/release/build ${{ matrix.target.goos }} ${{ matrix.target.goarch }} out/${{ matrix.target.binary }}

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: out/${{ matrix.target.binary }}

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target.binary }}
          path: out/${{ matrix.target.binary }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: yacypeer-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          pattern: yacypeer-*
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="yacypeer-${GITHUB_SHA:0:12}"
          gh release create "$tag" out/* \
            --draft \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes "yacypeer built from $GITHUB_SHA."
          gh release edit "$tag" --draft=false --latest

      - name: Delete older releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --limit 1000 --json tagName,isDraft,createdAt \
            --jq "[.[] | select((.tagName | startswith(\"yacypeer-\")) and (.isDraft | not))]
              | sort_by(.createdAt) | reverse | .[$RELEASES_KEPT:][] | .tagName" |
            while read -r tag; do
              gh release delete "$tag" --cleanup-tag --yes
            done
