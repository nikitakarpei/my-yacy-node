name: vulnerabilities

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/vulnerabilities.yml

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore pinned toolchain
        id: toolchain-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .toolchain/bin
            .toolchain/go
            .toolchain/activate
            .toolchain/installed-verify.lock
          key: toolchain-${{ runner.os }}-${{ hashFiles('tools/install', 'tools/tools.lock') }}

      - name: Restore Go modules and build output
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .toolchain/gomodcache
            .toolchain/gocache
          key: go-verify-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-verify-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-
            go-verify-${{ runner.os }}-

      - name: Install the pinned tools
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: ./tools/install verify

      - name: Find known vulnerabilities in the Go modules
        run: . .toolchain/activate && make vulnerabilities-go

  android-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore pinned toolchain
        id: toolchain-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .toolchain/bin
            .toolchain/go
            .toolchain/jdk
            .toolchain/android-sdk
            .toolchain/activate
            .toolchain/installed-verify.lock
            .toolchain/installed-android.lock
          key: android-toolchain-${{ runner.os }}-${{ hashFiles('tools/install', 'tools/tools.lock') }}

      - name: Restore Gradle and Go caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .toolchain/gradle/caches
            .toolchain/gradle/wrapper
            .toolchain/gradle/gradle.properties
            .toolchain/gomodcache
            .toolchain/gocache
          key: android-build-${{ runner.os }}-${{ hashFiles('distributions/yacypeercompanion/gradle/verification-metadata.xml', 'distributions/yacypeercompanion/go.sum') }}
          restore-keys: android-build-${{ runner.os }}-

      - name: Install the pinned tools
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: ./tools/install verify && ./tools/install android

      - name: Find known vulnerabilities in the libraries of the app
        run: . .toolchain/activate && make android-app-vulnerabilities
