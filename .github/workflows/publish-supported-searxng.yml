name: publish-supported-searxng

on:
  workflow_call:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read supported SearXNG image
        id: supported
        run: |
          image="$(cat plugins/searxng/supported-image)"
          reference="${image%@*}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tag=${reference##*:}" >> "$GITHUB_OUTPUT"

      - name: Tag SearXNG and its plugins with the supported version
        env:
          NAMESPACE: ${{ env.REGISTRY }}/${{ github.repository }}
          SUPPORTED_IMAGE: ${{ steps.supported.outputs.image }}
          SUPPORTED_TAG: ${{ steps.supported.outputs.tag }}
          BUILT_TAG: sha-${{ github.sha }}
        run: |
          for plugin in searxng-result-router; do
            docker buildx imagetools create \
              --tag "${NAMESPACE}/${plugin}:${SUPPORTED_TAG}" \
              --tag "${NAMESPACE}/${plugin}:latest" \
              "${NAMESPACE}/${plugin}:${BUILT_TAG}"
          done
          docker buildx imagetools create \
            --tag "${NAMESPACE}/searxng:${SUPPORTED_TAG}" \
            --tag "${NAMESPACE}/searxng:latest" \
            "${SUPPORTED_IMAGE}"
