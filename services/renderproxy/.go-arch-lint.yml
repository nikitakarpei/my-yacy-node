version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

commonComponents:
  - renderedpage
  - pagefreshness

components:
  renderedpage:
    in: internal/renderedpage/**
  pagefreshness:
    in: internal/pagefreshness/**
  cdprender:
    in: internal/cdprender/**
  cdpdocumentbinding:
    in: internal/cdpdocumentbinding/**
  rendergate:
    in: internal/rendergate/**
  originpreflight:
    in: internal/originpreflight/**
  proxyintake:
    in: internal/proxyintake/**
  proxyresponsedeliveryobserversapplog:
    in: internal/proxyresponsedeliveryobservers/applog/**
  proxyresponsedeliveryobserversprometheus:
    in: internal/proxyresponsedeliveryobservers/prometheus/**
  renderobserversapplog:
    in: internal/renderobservers/applog/**
  renderobserversprometheus:
    in: internal/renderobservers/prometheus/**
  rendercapacityobserversapplog:
    in: internal/rendercapacityobservers/applog/**
  rendercapacityobserversprometheus:
    in: internal/rendercapacityobservers/prometheus/**
  renderproxycmd:
    in: cmd/renderproxy/**

vendors:
  chromedp:
    in:
      - github.com/chromedp/chromedp
      - github.com/chromedp/chromedp/**
  cdproto:
    in: github.com/chromedp/cdproto/**
  prometheus:
    in:
      - github.com/prometheus/client_golang/**
  serviceruntime:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/applog
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/opsmetrics
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/servergroup
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/envconfig

deps:
  cdprender:
    canUse:
      - chromedp
      - cdproto
    mayDependOn:
      - cdpdocumentbinding
  cdpdocumentbinding:
    canUse:
      - cdproto
  proxyresponsedeliveryobserversapplog:
    mayDependOn:
      - proxyintake
  proxyresponsedeliveryobserversprometheus:
    mayDependOn:
      - proxyintake
    canUse:
      - prometheus
  renderobserversapplog:
    mayDependOn:
      - rendergate
  renderobserversprometheus:
    mayDependOn:
      - rendergate
    canUse:
      - prometheus
  rendercapacityobserversapplog:
    mayDependOn:
      - rendergate
  rendercapacityobserversprometheus:
    mayDependOn:
      - rendergate
    canUse:
      - prometheus
  renderproxycmd:
    anyProjectDeps: true
    anyVendorDeps: true

excludeFiles:
  - "test/e2e"
  - "_test\\.go"
