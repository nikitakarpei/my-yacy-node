version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

commonComponents:
  - renderedpage

components:
  renderedpage:
    in: internal/renderedpage/**
  cdprender:
    in: internal/cdprender/**
  cdpdocumentbinding:
    in: internal/cdpdocumentbinding/**
  rendergate:
    in: internal/rendergate/**
  redirectpreflight:
    in: internal/redirectpreflight/**
  proxyintake:
    in: internal/proxyintake/**
  rendermetrics:
    in: internal/rendermetrics/**
  renderproxycmd:
    in: cmd/renderproxy/**

vendors:
  chromedp:
    in:
      - github.com/chromedp/chromedp
      - github.com/chromedp/chromedp/**
  cdproto:
    in: github.com/chromedp/cdproto/**
  prometheus:
    in:
      - github.com/prometheus/client_golang/**
  serviceruntime:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/applog
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/opsmetrics
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/servergroup
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/envconfig

deps:
  cdprender:
    canUse:
      - chromedp
      - cdproto
    mayDependOn:
      - cdpdocumentbinding
  cdpdocumentbinding:
    canUse:
      - cdproto
  rendermetrics:
    canUse:
      - prometheus
  renderproxycmd:
    anyProjectDeps: true
    anyVendorDeps: true

excludeFiles:
  - "test/e2e"
  - "_test\\.go"
