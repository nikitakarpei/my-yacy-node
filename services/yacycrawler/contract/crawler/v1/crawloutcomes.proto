syntax = "proto3";

package crawler.v1;

option go_package = "github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract/crawler/v1;crawlerv1";

// CrawlOutcomes yields what crawling last did with a URL.
service CrawlOutcomes {
  // ReadPage answers INVALID_ARGUMENT for a URL that cannot be canonicalized.
  rpc ReadPage(ReadPageRequest) returns (PageOutcome);
}

message ReadPageRequest {
  string url = 1;
}

message PageOutcome {
  // The canonical form of the requested URL.
  string canonical_url = 1;

  // Where crawling resolved the URL to, the canonical URL itself when no redirect
  // was recorded.
  string resolved_url = 2;

  // Absent while the URL is not disposed.
  PageDisposal disposal = 3;
}

message PageDisposal {
  // Changes each time the URL is disposed again. A caller captures the mark before it
  // places an order and compares it while it waits, to tell a new disposal from an old one.
  string mark = 1;

  string reason = 2;
}
