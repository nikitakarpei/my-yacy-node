version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  yacycrawlcontract:
    in:
      - .
      - "**"

vendors:
  yacymodel:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/yacymodel
      - github.com/nikitakarpei/yacy-rwi-node/yacymodel/**
  canonicalurl:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl/**

deps:
  yacycrawlcontract:
    mayDependOn:
      - yacycrawlcontract
    canUse:
      - yacymodel
      - canonicalurl

excludeFiles:
  - "_test\\.go"
