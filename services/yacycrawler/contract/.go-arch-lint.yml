version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  yacycrawlcontract:
    in:
      - .
      - "**"

vendors:
  yacymodel:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/yacymodel
      - github.com/nikitakarpei/yacy-rwi-node/yacymodel/**
  canonicalurl:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl/**
  grpc:
    in:
      - google.golang.org/grpc
      - google.golang.org/grpc/**
  protobuf:
    in:
      - google.golang.org/protobuf
      - google.golang.org/protobuf/**

deps:
  yacycrawlcontract:
    mayDependOn:
      - yacycrawlcontract
    canUse:
      - yacymodel
      - canonicalurl
      - grpc
      - protobuf

excludeFiles:
  - "_test\\.go"
