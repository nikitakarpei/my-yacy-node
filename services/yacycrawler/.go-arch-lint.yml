version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

commonVendors:
  - yacycrawlcontract

commonComponents:
  - clock

components:
  clock:
    in: internal/crawl/clock/**
  disposal:
    in: internal/crawl/disposal/**
  refusal:
    in: internal/crawl/refusal/**
  retrydelay:
    in: internal/crawl/retrydelay/**
  frontier:
    in: internal/crawl/frontier/**
  profileadmission:
    in: internal/crawl/profileadmission/**
  redirectrecording:
    in: internal/crawl/redirectrecording/**
  pagepublication:
    in: internal/crawl/pagepublication/**
  ordersettlement:
    in: internal/crawl/ordersettlement/**
  ordertraversal:
    in: internal/crawl/ordertraversal/**
  visitdispatch:
    in: internal/crawl/visitdispatch/**
  fetchtiming:
    in: internal/crawl/fetchtiming/**
  pagevisit:
    in: internal/crawl/pagevisit/**
  reachedpagepublication:
    in: internal/crawl/reachedpagepublication/**
  pageabsorption:
    in: internal/crawl/pageabsorption/**
  pagerepresentationsrwi:
    in: internal/pagerepresentations/rwi/**
  recrawlrulesalwaysdue:
    in: internal/recrawlrules/alwaysdue/**
  recrawlrulesdueaftergrace:
    in: internal/recrawlrules/dueaftergrace/**
  orderreceiversjetstream:
    in: internal/orderreceivers/jetstream/**
  redirectresolversjetstream:
    in: internal/redirectresolvers/jetstream/**
  progressobserversprometheus:
    in: internal/progressobservers/prometheus/**
  representationpublishersjetstream:
    in: internal/representationpublishers/jetstream/**
  contextcancellation:
    in: internal/contextcancellation/**
  disposedpagesjetstream:
    in: internal/disposedpages/jetstream/**
  reachedpagesjetstream:
    in: internal/reachedpages/jetstream/**
  crawlercmd:
    in: cmd/yacycrawler/**

vendors:
  canonicalurl:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl/**
  yacycrawlcontract:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract/**
  yacymodel:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/yacymodel
      - github.com/nikitakarpei/yacy-rwi-node/yacymodel/**
  nats:
    in:
      - github.com/nats-io/nats.go
      - github.com/nats-io/nats.go/**
  wallclock:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/wallclock
  prometheus:
    in:
      - github.com/prometheus/client_golang/**
  pagescrapepagefetch:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/pagescrape/pagefetch
  pagescrapecontentextraction:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/pagescrape/contentextraction
  pagescrapecontentformatgraph:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/pagescrape/contentformatgraph
  serviceruntime:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/jetstreamconnect
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/applog
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/opsmetrics
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/servergroup
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/envconfig

deps:
  frontier:
    mayDependOn:
      - retrydelay
  redirectrecording:
    canUse:
      - canonicalurl
      - pagescrapepagefetch
  ordersettlement:
    mayDependOn:
      - contextcancellation
  ordertraversal:
    mayDependOn:
      - visitdispatch
      - disposal
      - refusal
      - frontier
      - profileadmission
      - pagevisit
      - pageabsorption
      - contextcancellation
    canUse:
      - canonicalurl
  visitdispatch:
    mayDependOn:
      - frontier
      - pagevisit
  fetchtiming:
    canUse:
      - pagescrapepagefetch
  pagevisit:
    mayDependOn:
      - disposal
      - refusal
      - pageabsorption
      - reachedpagepublication
    canUse:
      - pagescrapepagefetch
  reachedpagepublication:
    canUse:
      - canonicalurl
  pageabsorption:
    mayDependOn:
      - disposal
      - pagepublication
    canUse:
      - canonicalurl
      - pagescrapecontentextraction
      - pagescrapepagefetch
  pagepublication:
    mayDependOn:
      - retrydelay
    canUse:
      - pagescrapecontentformatgraph
  pagerepresentationsrwi:
    mayDependOn:
      - pagepublication
    canUse:
      - yacymodel
      - pagescrapecontentformatgraph
  recrawlrulesalwaysdue:
    mayDependOn:
      - pagevisit
    canUse:
      - pagescrapepagefetch
  recrawlrulesdueaftergrace:
    mayDependOn:
      - pagevisit
    canUse:
      - nats
      - pagescrapepagefetch
  orderreceiversjetstream:
    mayDependOn:
      - ordersettlement
    canUse:
      - nats
  redirectresolversjetstream:
    canUse:
      - nats
  disposedpagesjetstream:
    canUse:
      - nats
  reachedpagesjetstream:
    canUse:
      - nats
  progressobserversprometheus:
    mayDependOn:
      - ordersettlement
      - ordertraversal
      - pagepublication
      - pagevisit
      - fetchtiming
      - reachedpagepublication
      - disposal
      - refusal
    canUse:
      - prometheus
  representationpublishersjetstream:
    mayDependOn:
      - pagepublication
    canUse:
      - nats
      - pagescrapecontentformatgraph
  crawlercmd:
    anyProjectDeps: true
    anyVendorDeps: true

excludeFiles:
  - "test/e2e"
  - "_test\\.go"
