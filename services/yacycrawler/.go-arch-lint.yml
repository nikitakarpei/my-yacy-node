version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

commonVendors:
  - yacycrawlcontract
  - scraperequestcontract
  - canonicalurl

commonComponents:
  - clock

components:
  clock:
    in: internal/crawl/clock/**
  disposal:
    in: internal/crawl/disposal/**
  refusal:
    in: internal/crawl/refusal/**
  retrydelay:
    in: internal/crawl/retrydelay/**
  frontier:
    in: internal/crawl/frontier/**
  profileadmission:
    in: internal/crawl/profileadmission/**
  redirectrecording:
    in: internal/crawl/redirectrecording/**
  ordersettlement:
    in: internal/crawl/ordersettlement/**
  ordertraversal:
    in: internal/crawl/ordertraversal/**
  visitdispatch:
    in: internal/crawl/visitdispatch/**
  fetchtiming:
    in: internal/crawl/fetchtiming/**
  pagevisit:
    in: internal/crawl/pagevisit/**
  scraperequestpublication:
    in: internal/crawl/scraperequestpublication/**
  recrawlrulesalwaysdue:
    in: internal/recrawlrules/alwaysdue/**
  recrawlrulesdueaftergrace:
    in: internal/recrawlrules/dueaftergrace/**
  orderreceiversjetstream:
    in: internal/orderreceivers/jetstream/**
  redirectresolversjetstream:
    in: internal/redirectresolvers/jetstream/**
  progressobserversprometheus:
    in: internal/progressobservers/prometheus/**
  contextcancellation:
    in: internal/contextcancellation/**
  disposedpagesjetstream:
    in: internal/disposedpages/jetstream/**
  scraperequestsjetstream:
    in: internal/scraperequests/jetstream/**
  crawloutcomereceiversgrpc:
    in: internal/crawloutcomereceivers/grpc/**
  crawlercmd:
    in: cmd/yacycrawler/**

vendors:
  canonicalurl:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl/**
  yacycrawlcontract:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract/**
  scraperequestcontract:
    in: github.com/nikitakarpei/yacy-rwi-node/scraperequestcontract
  nats:
    in:
      - github.com/nats-io/nats.go
      - github.com/nats-io/nats.go/**
  wallclock:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/wallclock
  prometheus:
    in:
      - github.com/prometheus/client_golang/**
  grpc:
    in:
      - google.golang.org/grpc
      - google.golang.org/grpc/**
  pagescrapepagefetch:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/pagescrape/pagefetch
  pagescrapecontentextraction:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/pagescrape/contentextraction
  pagescrapecontentformatgraph:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/pagescrape/contentformatgraph
  serviceruntime:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/jetstreamconnect
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/applog
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/opsmetrics
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/servergroup
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/envconfig

deps:
  frontier:
    mayDependOn:
      - retrydelay
  redirectrecording:
    canUse:
      - pagescrapepagefetch
  ordersettlement:
    mayDependOn:
      - contextcancellation
  ordertraversal:
    mayDependOn:
      - visitdispatch
      - disposal
      - refusal
      - frontier
      - profileadmission
      - pagevisit
      - contextcancellation
    canUse:
      - yacycrawlcontract
      - scraperequestcontract
  visitdispatch:
    mayDependOn:
      - frontier
      - pagevisit
  fetchtiming:
    canUse:
      - pagescrapepagefetch
  pagevisit:
    mayDependOn:
      - disposal
      - refusal
      - scraperequestpublication
    canUse:
      - pagescrapecontentextraction
      - pagescrapepagefetch
  recrawlrulesalwaysdue:
    mayDependOn:
      - pagevisit
    canUse:
      - pagescrapepagefetch
  recrawlrulesdueaftergrace:
    mayDependOn:
      - pagevisit
    canUse:
      - nats
      - pagescrapepagefetch
  orderreceiversjetstream:
    mayDependOn:
      - ordersettlement
    canUse:
      - nats
  redirectresolversjetstream:
    canUse:
      - nats
  disposedpagesjetstream:
    mayDependOn:
      - disposal
    canUse:
      - nats
  crawloutcomereceiversgrpc:
    mayDependOn:
      - disposal
    canUse:
      - grpc
  scraperequestsjetstream:
    canUse:
      - nats
  progressobserversprometheus:
    mayDependOn:
      - ordersettlement
      - ordertraversal
      - pagevisit
      - fetchtiming
      - scraperequestpublication
      - disposal
      - refusal
    canUse:
      - prometheus
  crawlercmd:
    anyProjectDeps: true
    anyVendorDeps: true

excludeFiles:
  - "test/e2e"
  - "_test\\.go"
  - "contract"
