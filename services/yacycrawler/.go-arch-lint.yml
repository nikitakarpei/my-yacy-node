version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

commonVendors:
  - yacycrawlcontract
  - canonicalurl

components:
  disposal:
    in: internal/crawl/disposal/**
  retrydelay:
    in: internal/crawl/retrydelay/**
  pendingvisit:
    in: internal/crawl/pendingvisit/**
  profileadmission:
    in: internal/crawl/profileadmission/**
  acceptedorder:
    in: internal/crawl/acceptedorder/**
  orderintake:
    in: internal/crawl/orderintake/**
  visitclaim:
    in: internal/crawl/visitclaim/**
  visitintake:
    in: internal/crawl/visitintake/**
  pagevisit:
    in: internal/crawl/pagevisit/**
  pagehtml:
    in: internal/crawl/pagehtml/**
  pagerefusals:
    in: internal/crawl/pagerefusals/**
  linkdiscovery:
    in: internal/crawl/linkdiscovery/**
  pagehtmlreading:
    in: internal/crawl/pagehtmlreading/**
  visitallowance:
    in: internal/crawl/visitallowance/**
  recrawlrulesalwaysdue:
    in: internal/recrawlrules/alwaysdue/**
  recrawlrulesdueaftergrace:
    in: internal/recrawlrules/dueaftergrace/**
  acceptedordersjetstream:
    in: internal/acceptedorders/jetstream/**
  pendingvisitsjetstream:
    in: internal/pendingvisits/jetstream/**
  jetstreamrecord:
    in: internal/jetstreamrecord/**
  visitclaimsjetstream:
    in: internal/visitclaims/jetstream/**
  hostpageallowancesjetstream:
    in: internal/hostpageallowances/jetstream/**
  crawlorderobserversapplog:
    in: internal/crawlorderobservers/applog/**
  crawlorderobserversprometheus:
    in: internal/crawlorderobservers/prometheus/**
  pendingvisitobserversapplog:
    in: internal/pendingvisitobservers/applog/**
  pendingvisitobserversprometheus:
    in: internal/pendingvisitobservers/prometheus/**
  pagefetchobserversapplog:
    in: internal/pagefetchobservers/applog/**
  pagefetchobserversprometheus:
    in: internal/pagefetchobservers/prometheus/**
  mediatypeobserversapplog:
    in: internal/mediatypeobservers/applog/**
  mediatypeobserversprometheus:
    in: internal/mediatypeobservers/prometheus/**
  linkresolutionobserversapplog:
    in: internal/linkresolutionobservers/applog/**
  linkresolutionobserversprometheus:
    in: internal/linkresolutionobservers/prometheus/**
  refusalenforcementobserversapplog:
    in: internal/refusalenforcementobservers/applog/**
  refusalenforcementobserversprometheus:
    in: internal/refusalenforcementobservers/prometheus/**
  crawledpageobserversapplog:
    in: internal/crawledpageobservers/applog/**
  crawledpageobserversprometheus:
    in: internal/crawledpageobservers/prometheus/**
  recrawlrecordobserversapplog:
    in: internal/recrawlrecordobservers/applog/**
  recrawlrecordobserversprometheus:
    in: internal/recrawlrecordobservers/prometheus/**
  crawledpagesjetstream:
    in: internal/crawledpages/jetstream/**
  crawlercmd:
    in: cmd/yacycrawler/**

vendors:
  canonicalurl:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl/**
  yacycrawlcontract:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract/**
  nats:
    in:
      - github.com/nats-io/nats.go
      - github.com/nats-io/nats.go/**
  wallclock:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/wallclock
  prometheus:
    in:
      - github.com/prometheus/client_golang/**
  pagefetch:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/pagefetch
  nethtml:
    in:
      - golang.org/x/net/html
      - golang.org/x/net/html/**
  serviceruntime:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/jetstreamconnect
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/applog
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/opsmetrics
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/servergroup
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/envconfig
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/poisonhalt
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/pullintake

deps:
  pendingvisit:
    canUse:
      - canonicalurl
  acceptedorder:
    mayDependOn:
      - profileadmission
    canUse:
      - canonicalurl
      - yacycrawlcontract
  orderintake:
    mayDependOn:
      - pendingvisit
      - acceptedorder
    canUse:
      - yacycrawlcontract
      - serviceruntime
  visitintake:
    mayDependOn:
      - disposal
      - visitclaim
      - visitallowance
      - pendingvisit
      - acceptedorder
      - pagevisit
      - pagerefusals
    canUse:
      - canonicalurl
      - yacycrawlcontract
      - serviceruntime
  pagehtml:
    canUse:
      - nethtml
  pagerefusals:
    mayDependOn:
      - pagehtml
  linkdiscovery:
    mayDependOn:
      - pagehtml
    canUse:
      - canonicalurl
  pagevisit:
    mayDependOn:
      - disposal
      - pagehtmlreading
      - pagerefusals
    canUse:
      - canonicalurl
      - pagefetch
  pagehtmlreading:
    mayDependOn:
      - pagehtml
      - pagerefusals
      - linkdiscovery
    canUse:
      - canonicalurl
      - pagefetch
  visitallowance:
    mayDependOn:
      - disposal
      - pendingvisit
      - retrydelay
    canUse:
      - canonicalurl
  recrawlrulesalwaysdue:
    mayDependOn:
      - pagevisit
    canUse:
      - pagefetch
  recrawlrulesdueaftergrace:
    mayDependOn:
      - pagevisit
      - jetstreamrecord
    canUse:
      - nats
      - pagefetch
  acceptedordersjetstream:
    mayDependOn:
      - acceptedorder
      - jetstreamrecord
    canUse:
      - nats
      - yacycrawlcontract
  pendingvisitsjetstream:
    mayDependOn:
      - pendingvisit
    canUse:
      - nats
  jetstreamrecord:
    canUse:
      - nats
  visitclaimsjetstream:
    mayDependOn:
      - visitclaim
      - jetstreamrecord
    canUse:
      - nats
      - canonicalurl
      - yacycrawlcontract
  hostpageallowancesjetstream:
    mayDependOn:
      - jetstreamrecord
    canUse:
      - nats
      - canonicalurl
  crawledpagesjetstream:
    canUse:
      - nats
  crawlorderobserversapplog:
    mayDependOn:
      - orderintake
  crawlorderobserversprometheus:
    mayDependOn:
      - orderintake
    canUse:
      - prometheus
  pendingvisitobserversapplog:
    mayDependOn:
      - disposal
      - pendingvisit
  pendingvisitobserversprometheus:
    mayDependOn:
      - disposal
      - pendingvisit
    canUse:
      - prometheus
      - canonicalurl
  pagefetchobserversapplog:
    canUse:
      - canonicalurl
      - pagefetch
  pagefetchobserversprometheus:
    canUse:
      - prometheus
      - canonicalurl
      - pagefetch
  mediatypeobserversprometheus:
    canUse:
      - prometheus
  linkresolutionobserversapplog:
    canUse:
      - canonicalurl
  linkresolutionobserversprometheus:
    canUse:
      - prometheus
      - canonicalurl
  refusalenforcementobserversapplog:
    canUse:
      - canonicalurl
  refusalenforcementobserversprometheus:
    canUse:
      - prometheus
      - canonicalurl
  crawledpageobserversapplog:
    mayDependOn:
      - crawledpagesjetstream
    canUse:
      - canonicalurl
  crawledpageobserversprometheus:
    mayDependOn:
      - crawledpagesjetstream
    canUse:
      - prometheus
      - canonicalurl
  recrawlrecordobserversapplog:
    canUse:
      - canonicalurl
  recrawlrecordobserversprometheus:
    canUse:
      - prometheus
      - canonicalurl
  crawlercmd:
    anyProjectDeps: true
    anyVendorDeps: true

excludeFiles:
  - "test/e2e"
  - "_test\\.go"
  - "contract"
