version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  clock:
    in: internal/crawl/clock/**
  disposal:
    in: internal/crawl/disposal/**
  refusal:
    in: internal/crawl/refusal/**
  retrydelay:
    in: internal/crawl/retrydelay/**
  fetchedpage:
    in: internal/crawl/fetchedpage/**
  frontier:
    in: internal/crawl/frontier/**
  profileadmission:
    in: internal/crawl/profileadmission/**
  redirectrecording:
    in: internal/crawl/redirectrecording/**
  pagepublication:
    in: internal/crawl/pagepublication/**
  ordersettlement:
    in: internal/crawl/ordersettlement/**
  ordertraversal:
    in: internal/crawl/ordertraversal/**
  pagevisit:
    in: internal/crawl/pagevisit/**
  pageabsorption:
    in: internal/crawl/pageabsorption/**
  contentformatgraph:
    in: internal/crawl/contentformatgraph/**
  contentextraction:
    in: internal/crawl/contentextraction/**
  pagefetchershttp:
    in: internal/pagefetchers/http/**
  mediaextractorshtml:
    in: internal/mediaextractors/html/**
  containerexpandersarchive:
    in: internal/containerexpanders/archive/**
  pagederivationsfulltext:
    in: internal/pagederivations/fulltext/**
  pagederivationsreadablehtml:
    in: internal/pagederivations/readablehtml/**
  pagederivationsreadabletext:
    in: internal/pagederivations/readabletext/**
  pagederivationsmarkdown:
    in: internal/pagederivations/markdown/**
  pagerepresentationsrwi:
    in: internal/pagerepresentations/rwi/**
  pagerepresentationstext:
    in: internal/pagerepresentations/text/**
  pagerepresentationsmarkdown:
    in: internal/pagerepresentations/markdown/**
  recrawldecisionsalwaysdue:
    in: internal/recrawldecisions/alwaysdue/**
  recrawldecisionsdueaftergrace:
    in: internal/recrawldecisions/dueaftergrace/**
  orderreceiversjetstream:
    in: internal/orderreceivers/jetstream/**
  redirectresolversjetstream:
    in: internal/redirectresolvers/jetstream/**
  progressobserversprometheus:
    in: internal/progressobservers/prometheus/**
  representationpublishersjetstream:
    in: internal/representationpublishers/jetstream/**
  htmlflattening:
    in: internal/htmlflattening/**
  contextcancellation:
    in: internal/contextcancellation/**
  disposedpagesjetstream:
    in: internal/disposedpages/jetstream/**
  crawlercmd:
    in: cmd/yacycrawler/**

vendors:
  canonicalurl:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl/**
  yacycrawlcontract:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract/**
  yacymodel:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/yacymodel
      - github.com/nikitakarpei/yacy-rwi-node/yacymodel/**
  nats:
    in:
      - github.com/nats-io/nats.go
      - github.com/nats-io/nats.go/**
  natstestserver:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/natstestserver
  wallclock:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/wallclock
  prometheus:
    in:
      - github.com/prometheus/client_golang/**
  readability:
    in:
      - codeberg.org/readeck/go-readability/v2
  htmltomarkdown:
    in:
      - github.com/JohannesKaufmann/html-to-markdown/v2
  xnet:
    in:
      - golang.org/x/net/**
  serviceruntime:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/jetstreamconnect
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/applog
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/opsmetrics
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/servergroup
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/envconfig

deps:
  clock:
    mayDependOn:
      - clock
  disposal:
    mayDependOn:
      - disposal
  refusal:
    mayDependOn:
      - refusal
  retrydelay:
    mayDependOn:
      - retrydelay
  fetchedpage:
    mayDependOn:
      - fetchedpage
  frontier:
    mayDependOn:
      - frontier
      - retrydelay
  profileadmission:
    mayDependOn:
      - profileadmission
    canUse:
      - yacycrawlcontract
  redirectrecording:
    mayDependOn:
      - redirectrecording
      - fetchedpage
      - pageabsorption
    canUse:
      - canonicalurl
  ordersettlement:
    mayDependOn:
      - ordersettlement
      - clock
      - contextcancellation
    canUse:
      - yacycrawlcontract
  ordertraversal:
    mayDependOn:
      - ordertraversal
      - clock
      - retrydelay
      - disposal
      - refusal
      - frontier
      - profileadmission
      - pagevisit
      - contextcancellation
    canUse:
      - yacycrawlcontract
      - canonicalurl
  pagevisit:
    mayDependOn:
      - pagevisit
      - clock
      - disposal
      - refusal
      - fetchedpage
      - pageabsorption
  pageabsorption:
    mayDependOn:
      - pageabsorption
      - clock
      - disposal
      - contentextraction
      - contentformatgraph
      - pagepublication
      - fetchedpage
    canUse:
      - canonicalurl
  pagepublication:
    mayDependOn:
      - pagepublication
      - clock
      - disposal
      - contentformatgraph
      - retrydelay
    canUse:
      - yacycrawlcontract
  contentformatgraph:
    mayDependOn:
      - contentformatgraph
  contentextraction:
    mayDependOn:
      - contentextraction
      - contentformatgraph
  pagefetchershttp:
    mayDependOn:
      - pagefetchershttp
      - pagevisit
      - fetchedpage
  mediaextractorshtml:
    mayDependOn:
      - mediaextractorshtml
      - contentextraction
      - contentformatgraph
    canUse:
      - canonicalurl
      - xnet
  containerexpandersarchive:
    mayDependOn:
      - containerexpandersarchive
      - contentextraction
  pagederivationsfulltext:
    mayDependOn:
      - pagederivationsfulltext
      - contentformatgraph
      - htmlflattening
  pagederivationsreadablehtml:
    mayDependOn:
      - pagederivationsreadablehtml
      - contentformatgraph
    canUse:
      - readability
      - xnet
  pagederivationsreadabletext:
    mayDependOn:
      - pagederivationsreadabletext
      - contentformatgraph
      - htmlflattening
  pagederivationsmarkdown:
    mayDependOn:
      - pagederivationsmarkdown
      - contentformatgraph
    canUse:
      - htmltomarkdown
  pagerepresentationsrwi:
    mayDependOn:
      - pagerepresentationsrwi
      - pagepublication
      - contentformatgraph
    canUse:
      - yacycrawlcontract
      - yacymodel
  pagerepresentationstext:
    mayDependOn:
      - pagerepresentationstext
      - pagepublication
      - contentformatgraph
    canUse:
      - yacycrawlcontract
  pagerepresentationsmarkdown:
    mayDependOn:
      - pagerepresentationsmarkdown
      - pagepublication
      - contentformatgraph
    canUse:
      - yacycrawlcontract
  recrawldecisionsalwaysdue:
    mayDependOn:
      - recrawldecisionsalwaysdue
      - pagevisit
  recrawldecisionsdueaftergrace:
    mayDependOn:
      - recrawldecisionsdueaftergrace
      - clock
      - pagevisit
    canUse:
      - nats
      - natstestserver
  orderreceiversjetstream:
    mayDependOn:
      - orderreceiversjetstream
      - ordersettlement
    canUse:
      - yacycrawlcontract
      - nats
      - natstestserver
  redirectresolversjetstream:
    mayDependOn:
      - redirectresolversjetstream
    canUse:
      - yacycrawlcontract
      - nats
      - natstestserver
  disposedpagesjetstream:
    mayDependOn:
      - disposedpagesjetstream
    canUse:
      - yacycrawlcontract
      - nats
      - natstestserver
  progressobserversprometheus:
    mayDependOn:
      - progressobserversprometheus
      - ordersettlement
      - ordertraversal
      - pageabsorption
      - pagepublication
      - pagevisit
      - disposal
      - refusal
    canUse:
      - prometheus
      - yacycrawlcontract
  representationpublishersjetstream:
    mayDependOn:
      - representationpublishersjetstream
      - pagepublication
      - contentformatgraph
    canUse:
      - yacycrawlcontract
      - nats
      - natstestserver
  htmlflattening:
    mayDependOn:
      - htmlflattening
    canUse:
      - xnet
  contextcancellation:
    mayDependOn:
      - contextcancellation
  crawlercmd:
    mayDependOn:
      - ordersettlement
      - ordertraversal
      - frontier
      - retrydelay
      - pagevisit
      - redirectrecording
      - pageabsorption
      - pagepublication
      - contentformatgraph
      - contentextraction
      - pagefetchershttp
      - mediaextractorshtml
      - containerexpandersarchive
      - pagederivationsfulltext
      - pagederivationsreadablehtml
      - pagederivationsreadabletext
      - pagederivationsmarkdown
      - pagerepresentationsrwi
      - pagerepresentationstext
      - pagerepresentationsmarkdown
      - recrawldecisionsalwaysdue
      - recrawldecisionsdueaftergrace
      - orderreceiversjetstream
      - redirectresolversjetstream
      - progressobserversprometheus
      - representationpublishersjetstream
      - disposedpagesjetstream
    canUse:
      - yacycrawlcontract
      - nats
      - natstestserver
      - serviceruntime
      - wallclock

excludeFiles:
  - "test/e2e"
