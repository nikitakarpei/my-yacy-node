version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

commonVendors:
  - yacycrawlcontract
  - canonicalurl

components:
  disposal:
    in: internal/crawl/disposal/**
  retrydelay:
    in: internal/crawl/retrydelay/**
  pendingpagevisit:
    in: internal/crawl/pendingpagevisit/**
  profileadmission:
    in: internal/crawl/profileadmission/**
  acceptedorder:
    in: internal/crawl/acceptedorder/**
  orderintake:
    in: internal/crawl/orderintake/**
  pagevisitintake:
    in: internal/crawl/pagevisitintake/**
  pagevisit:
    in: internal/crawl/pagevisit/**
  observedfetch:
    in: internal/crawl/observedfetch/**
  pagehtml:
    in: internal/crawl/pagehtml/**
  linkdiscovery:
    in: internal/crawl/linkdiscovery/**
  pagehtmlreading:
    in: internal/crawl/pagehtmlreading/**
  pagevisitallowance:
    in: internal/crawl/pagevisitallowance/**
  pagevisitrecordsnorecords:
    in: internal/pagevisitrecords/norecords/**
  pagevisitrecordsredis:
    in: internal/pagevisitrecords/redis/**
  recrawlrulesdueaftergrace:
    in: internal/recrawlrules/dueaftergrace/**
  acceptedordersredis:
    in: internal/acceptedorders/redis/**
  pendingpagevisitsjetstream:
    in: internal/pendingpagevisits/jetstream/**
  redisrecord:
    in: internal/redisrecord/**
  takenpagevisitsredis:
    in: internal/takenpagevisits/redis/**
  pagevisitlimitsredis:
    in: internal/pagevisitlimits/redis/**
  crawlorderobserversapplog:
    in: internal/crawlorderobservers/applog/**
  crawlorderobserversprometheus:
    in: internal/crawlorderobservers/prometheus/**
  pendingpagevisitobserversapplog:
    in: internal/pendingpagevisitobservers/applog/**
  pendingpagevisitobserversprometheus:
    in: internal/pendingpagevisitobservers/prometheus/**
  pagefetchobserversapplog:
    in: internal/pagefetchobservers/applog/**
  pagefetchobserversprometheus:
    in: internal/pagefetchobservers/prometheus/**
  mediatypeobserversapplog:
    in: internal/mediatypeobservers/applog/**
  mediatypeobserversprometheus:
    in: internal/mediatypeobservers/prometheus/**
  linkresolutionobserversapplog:
    in: internal/linkresolutionobservers/applog/**
  linkresolutionobserversprometheus:
    in: internal/linkresolutionobservers/prometheus/**
  refusalenforcementobserversapplog:
    in: internal/refusalenforcementobservers/applog/**
  refusalenforcementobserversprometheus:
    in: internal/refusalenforcementobservers/prometheus/**
  crawledpageobserversapplog:
    in: internal/crawledpageobservers/applog/**
  crawledpageobserversprometheus:
    in: internal/crawledpageobservers/prometheus/**
  pagevisitrecordobserversapplog:
    in: internal/pagevisitrecordobservers/applog/**
  pagevisitrecordobserversprometheus:
    in: internal/pagevisitrecordobservers/prometheus/**
  crawledpagesjetstream:
    in: internal/crawledpages/jetstream/**
  crawlercmd:
    in: cmd/yacycrawler/**

vendors:
  budgetbuckets:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/budgetbuckets
  canonicalurl:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl/**
  yacycrawlcontract:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract/**
  nats:
    in:
      - github.com/nats-io/nats.go
      - github.com/nats-io/nats.go/**
  redis:
    in:
      - github.com/redis/go-redis/v9
  wallclock:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/wallclock
  prometheus:
    in:
      - github.com/prometheus/client_golang/**
  pagefetch:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/pagefetch
  robotsmeta:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/robotsmeta
      - github.com/nikitakarpei/yacy-rwi-node/robotsmeta/**
  nethtml:
    in:
      - golang.org/x/net/html
      - golang.org/x/net/html/**
  serviceruntime:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/jetstreamconnect
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/applog
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/opsmetrics
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/servergroup
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/envconfig
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/poisonhalt
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/pullintake

deps:
  pendingpagevisit:
    canUse:
      - canonicalurl
  acceptedorder:
    mayDependOn:
      - profileadmission
    canUse:
      - canonicalurl
      - yacycrawlcontract
  orderintake:
    mayDependOn:
      - pendingpagevisit
      - acceptedorder
    canUse:
      - yacycrawlcontract
      - serviceruntime
  pagevisitintake:
    mayDependOn:
      - disposal
      - pagevisitallowance
      - pendingpagevisit
      - acceptedorder
      - pagevisit
    canUse:
      - canonicalurl
      - yacycrawlcontract
      - serviceruntime
  pagehtml:
    canUse:
      - nethtml
  linkdiscovery:
    mayDependOn:
      - pagehtml
    canUse:
      - canonicalurl
  pagevisit:
    mayDependOn:
      - acceptedorder
      - disposal
      - pagehtmlreading
      - pendingpagevisit
    canUse:
      - canonicalurl
      - pagefetch
  observedfetch:
    canUse:
      - canonicalurl
      - pagefetch
  pagehtmlreading:
    mayDependOn:
      - pagehtml
      - linkdiscovery
    canUse:
      - canonicalurl
      - pagefetch
      - robotsmeta
  pagevisitallowance:
    mayDependOn:
      - disposal
      - pendingpagevisit
      - retrydelay
    canUse:
      - canonicalurl
  pagevisitrecordsnorecords:
    mayDependOn:
      - pagevisit
    canUse:
      - pagefetch
  pagevisitrecordsredis:
    mayDependOn:
      - pagevisit
      - redisrecord
    canUse:
      - redis
      - pagefetch
  recrawlrulesdueaftergrace:
    mayDependOn:
      - pagevisit
  acceptedordersredis:
    mayDependOn:
      - acceptedorder
      - redisrecord
    canUse:
      - redis
      - yacycrawlcontract
  pendingpagevisitsjetstream:
    mayDependOn:
      - pendingpagevisit
    canUse:
      - nats
  redisrecord:
    canUse:
      - redis
  takenpagevisitsredis:
    mayDependOn:
      - redisrecord
    canUse:
      - redis
      - canonicalurl
  pagevisitlimitsredis:
    mayDependOn:
      - redisrecord
    canUse:
      - redis
      - canonicalurl
      - yacycrawlcontract
  crawledpagesjetstream:
    canUse:
      - nats
  crawlorderobserversapplog:
    mayDependOn:
      - orderintake
  crawlorderobserversprometheus:
    mayDependOn:
      - orderintake
    canUse:
      - prometheus
  pendingpagevisitobserversapplog:
    mayDependOn:
      - disposal
      - pendingpagevisit
  pendingpagevisitobserversprometheus:
    mayDependOn:
      - disposal
      - pendingpagevisit
    canUse:
      - prometheus
      - canonicalurl
  pagefetchobserversapplog:
    canUse:
      - canonicalurl
      - pagefetch
  pagefetchobserversprometheus:
    canUse:
      - prometheus
      - budgetbuckets
      - canonicalurl
      - pagefetch
  mediatypeobserversprometheus:
    canUse:
      - prometheus
  linkresolutionobserversapplog:
    canUse:
      - canonicalurl
  linkresolutionobserversprometheus:
    canUse:
      - prometheus
      - canonicalurl
  refusalenforcementobserversapplog:
    canUse:
      - canonicalurl
  refusalenforcementobserversprometheus:
    canUse:
      - prometheus
      - canonicalurl
  crawledpageobserversapplog:
    mayDependOn:
      - crawledpagesjetstream
    canUse:
      - canonicalurl
  crawledpageobserversprometheus:
    mayDependOn:
      - crawledpagesjetstream
    canUse:
      - prometheus
      - canonicalurl
  pagevisitrecordobserversapplog:
    canUse:
      - canonicalurl
  pagevisitrecordobserversprometheus:
    canUse:
      - prometheus
      - canonicalurl
  crawlercmd:
    anyProjectDeps: true
    anyVendorDeps: true

excludeFiles:
  - "test/e2e"
  - "_test\\.go"
  - "contract"
