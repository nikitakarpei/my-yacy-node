version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

commonVendors:
  - yacycrawlcontract
  - canonicalurl

components:
  retrydelay:
    in: internal/crawl/retrydelay/**
  crawlid:
    in: internal/crawl/crawlid/**
  pendingpagevisit:
    in: internal/crawl/pendingpagevisit/**
  profileadmission:
    in: internal/crawl/profileadmission/**
  acceptedorder:
    in: internal/crawl/acceptedorder/**
  orderintake:
    in: internal/crawl/orderintake/**
  pagevisitintake:
    in: internal/crawl/pagevisitintake/**
  pagevisit:
    in: internal/crawl/pagevisit/**
  observedfetch:
    in: internal/crawl/observedfetch/**
  pagehtml:
    in: internal/crawl/pagehtml/**
  linkdiscovery:
    in: internal/crawl/linkdiscovery/**
  pagehtmlreading:
    in: internal/crawl/pagehtmlreading/**
  pagevisitallowance:
    in: internal/crawl/pagevisitallowance/**
  pagevisitrecords:
    in: internal/crawl/pagevisitrecords/**
  recrawlrulesdueaftergrace:
    in: internal/recrawlrules/dueaftergrace/**
  urlhash:
    in: internal/crawl/urlhash/**
  crawls:
    in: internal/crawl/crawls/**
  frontier:
    in: internal/crawl/frontier/**
  crawlprogress:
    in: internal/crawl/crawlprogress/**
  pagevisitlimits:
    in: internal/crawl/pagevisitlimits/**
  crawlfinishing:
    in: internal/crawl/crawlfinishing/**
  crawlobserversorderintakeapplog:
    in: internal/crawlobservers/orderintake/applog/**
  crawlobserversorderintakeprometheus:
    in: internal/crawlobservers/orderintake/prometheus/**
  crawlobserverspagevisitintakeapplog:
    in: internal/crawlobservers/pagevisitintake/applog/**
  crawlobserversfrontierapplog:
    in: internal/crawlobservers/frontier/applog/**
  crawlobserverscrawlfinishingapplog:
    in: internal/crawlobservers/crawlfinishing/applog/**
  crawlobserverscrawlprogressapplog:
    in: internal/crawlobservers/crawlprogress/applog/**
  frontiermetricsprometheus:
    in: internal/frontiermetrics/prometheus/**
  crawlobserverspagevisitintakeprometheus:
    in: internal/crawlobservers/pagevisitintake/prometheus/**
  crawlobserversobservedfetchapplog:
    in: internal/crawlobservers/observedfetch/applog/**
  crawlobserversobservedfetchprometheus:
    in: internal/crawlobservers/observedfetch/prometheus/**
  crawlobserverspagehtmlapplog:
    in: internal/crawlobservers/pagehtml/applog/**
  crawlobserverspagehtmlprometheus:
    in: internal/crawlobservers/pagehtml/prometheus/**
  crawlobserverslinkdiscoveryapplog:
    in: internal/crawlobservers/linkdiscovery/applog/**
  crawlobserverslinkdiscoveryprometheus:
    in: internal/crawlobservers/linkdiscovery/prometheus/**
  crawlobserverspagehtmlreadingapplog:
    in: internal/crawlobservers/pagehtmlreading/applog/**
  crawlobserverspagehtmlreadingprometheus:
    in: internal/crawlobservers/pagehtmlreading/prometheus/**
  crawledpageobserversapplog:
    in: internal/crawledpageobservers/applog/**
  crawledpageobserversprometheus:
    in: internal/crawledpageobservers/prometheus/**
  crawlobserverspagevisitapplog:
    in: internal/crawlobservers/pagevisit/applog/**
  crawlobserverspagevisitprometheus:
    in: internal/crawlobservers/pagevisit/prometheus/**
  crawledpagesjetstream:
    in: internal/crawledpages/jetstream/**
  crawlerapishttp:
    in: internal/crawlerapis/http/**
  crawlerapiobservershttpapplog:
    in: internal/crawlerapiobservers/http/applog/**
  crawlercmd:
    in: cmd/yacycrawler/**

vendors:
  budgetbuckets:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/budgetbuckets
  canonicalurl:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl/**
  yacycrawlcontract:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract/**
  nats:
    in:
      - github.com/nats-io/nats.go
      - github.com/nats-io/nats.go/**
  vault:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/vault
  uuid:
    in:
      - github.com/google/uuid
  wallclock:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/wallclock
  prometheus:
    in:
      - github.com/prometheus/client_golang/**
  pagefetch:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/pagefetch
  robotsmeta:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/robotsmeta
      - github.com/nikitakarpei/yacy-rwi-node/robotsmeta/**
  nethtml:
    in:
      - golang.org/x/net/html
      - golang.org/x/net/html/**
  serviceruntime:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/jetstreamconnect
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/applog
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/opsmetrics
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/servergroup
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/envconfig
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/poisonhalt
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/pullintake

deps:
  crawlid:
    canUse:
      - uuid
      - vault
  pendingpagevisit:
    mayDependOn:
      - crawlid
    canUse:
      - canonicalurl
  acceptedorder:
    mayDependOn:
      - profileadmission
    canUse:
      - canonicalurl
      - yacycrawlcontract
  orderintake:
    mayDependOn:
      - crawlid
      - acceptedorder
      - pendingpagevisit
    canUse:
      - yacycrawlcontract
      - serviceruntime
      - vault
  pagevisitintake:
    mayDependOn:
      - crawlid
      - pagevisitallowance
      - pendingpagevisit
      - acceptedorder
      - pagevisit
    canUse:
      - canonicalurl
      - yacycrawlcontract
      - serviceruntime
      - vault
  pagehtml:
    canUse:
      - nethtml
  linkdiscovery:
    mayDependOn:
      - pagehtml
    canUse:
      - canonicalurl
  pagevisit:
    mayDependOn:
      - acceptedorder
      - crawlid
      - pagehtmlreading
      - pendingpagevisit
    canUse:
      - canonicalurl
      - pagefetch
      - vault
  observedfetch:
    canUse:
      - canonicalurl
      - pagefetch
  pagehtmlreading:
    mayDependOn:
      - pagehtml
      - linkdiscovery
    canUse:
      - canonicalurl
      - pagefetch
      - robotsmeta
  pagevisitallowance:
    mayDependOn:
      - crawlid
      - pendingpagevisit
      - retrydelay
    canUse:
      - canonicalurl
      - vault
  pagevisitrecords:
    mayDependOn:
      - pagevisit
      - urlhash
    canUse:
      - vault
      - pagefetch
  recrawlrulesdueaftergrace:
    mayDependOn:
      - pagevisit
  urlhash:
    canUse:
      - canonicalurl
      - vault
  crawls:
    mayDependOn:
      - acceptedorder
      - crawlid
    canUse:
      - vault
      - yacycrawlcontract
  frontier:
    mayDependOn:
      - pendingpagevisit
      - crawlid
      - urlhash
    canUse:
      - vault
      - serviceruntime
  crawlprogress:
    mayDependOn:
      - crawlid
      - pendingpagevisit
    canUse:
      - vault
  pagevisitlimits:
    mayDependOn:
      - crawlid
      - urlhash
    canUse:
      - vault
      - canonicalurl
      - yacycrawlcontract
  crawledpagesjetstream:
    canUse:
      - nats
  crawlerapishttp:
    mayDependOn:
      - acceptedorder
      - crawlid
      - pendingpagevisit
      - crawls
      - crawlprogress
    canUse:
      - vault
  crawlobserversorderintakeapplog:
    mayDependOn:
      - crawlid
      - orderintake
  crawlobserversorderintakeprometheus:
    mayDependOn:
      - crawlid
      - orderintake
    canUse:
      - prometheus
  crawlobserverspagevisitintakeapplog:
    mayDependOn:
      - pendingpagevisit
  crawlobserversfrontierapplog:
    mayDependOn:
      - pendingpagevisit
  crawlfinishing:
    mayDependOn:
      - crawlid
    canUse:
      - vault
  crawlobserverscrawlfinishingapplog:
    mayDependOn:
      - crawlid
  crawlobserverscrawlprogressapplog:
    mayDependOn:
      - crawlid
  frontiermetricsprometheus:
    canUse:
      - prometheus
  crawlobserverspagevisitintakeprometheus:
    mayDependOn:
      - pendingpagevisit
    canUse:
      - prometheus
      - canonicalurl
  crawlobserversobservedfetchapplog:
    canUse:
      - canonicalurl
      - pagefetch
  crawlobserversobservedfetchprometheus:
    canUse:
      - prometheus
      - budgetbuckets
      - canonicalurl
      - pagefetch
  crawlobserverspagehtmlprometheus:
    canUse:
      - prometheus
  crawlobserverslinkdiscoveryapplog:
    canUse:
      - canonicalurl
  crawlobserverslinkdiscoveryprometheus:
    canUse:
      - prometheus
      - canonicalurl
  crawlobserverspagehtmlreadingapplog:
    canUse:
      - canonicalurl
  crawlobserverspagehtmlreadingprometheus:
    canUse:
      - prometheus
      - canonicalurl
  crawledpageobserversapplog:
    mayDependOn:
      - crawledpagesjetstream
    canUse:
      - canonicalurl
  crawledpageobserversprometheus:
    mayDependOn:
      - crawledpagesjetstream
    canUse:
      - prometheus
      - canonicalurl
  crawlobserverspagevisitapplog:
    canUse:
      - canonicalurl
  crawlobserverspagevisitprometheus:
    canUse:
      - prometheus
      - canonicalurl
  crawlercmd:
    anyProjectDeps: true
    anyVendorDeps: true

excludeFiles:
  - "test/e2e"
  - "_test\\.go"
  - "contract"
