version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

commonVendors:
  - yacycrawlcontract
  - canonicalurl

components:
  pagevisitdrop:
    in: internal/crawl/pagevisitdrop/**
  pagevisitresult:
    in: internal/crawl/pagevisitresult/**
  retrydelay:
