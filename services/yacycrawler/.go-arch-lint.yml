version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  ordersettlement:
    in: internal/crawl/ordersettlement/**
  ordertraversal:
    in: internal/crawl/ordertraversal/**
  pagevisit:
    in: internal/crawl/pagevisit/**
  pageabsorption:
    in: internal/crawl/pageabsorption/**
  contentformatgraph:
    in: internal/crawl/contentformatgraph/**
  contentextraction:
    in: internal/crawl/contentextraction/**
  pagefetchershttp:
    in: internal/pagefetchers/http/**
  documentextractorshtml:
    in: internal/documentextractors/html/**
  documentextractorsarchive:
    in: internal/documentextractors/archive/**
  pagederivationsfulltext:
    in: internal/pagederivations/fulltext/**
  pagederivationsreadablehtml:
    in: internal/pagederivations/readablehtml/**
  pagederivationsreadabletext:
    in: internal/pagederivations/readabletext/**
  pagederivationsmarkdown:
    in: internal/pagederivations/markdown/**
  pagefeedsrwi:
    in: internal/pagefeeds/rwi/**
  pagefeedstext:
    in: internal/pagefeeds/text/**
  pagefeedsmarkdown:
    in: internal/pagefeeds/markdown/**
  recrawlpoliciesalwaysdue:
    in: internal/recrawlpolicies/alwaysdue/**
  orderreceiversjetstream:
    in: internal/orderreceivers/jetstream/**
  redirectresolversjetstream:
    in: internal/redirectresolvers/jetstream/**
  progressobserversprometheus:
    in: internal/progressobservers/prometheus/**
  feedpublishersjetstream:
    in: internal/feedpublishers/jetstream/**
  htmlflattening:
    in: internal/htmlflattening/**
  contextcancellation:
    in: internal/contextcancellation/**
  crawlercmd:
    in: cmd/yacycrawler/**

vendors:
  canonicalurl:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl/**
  yacycrawlcontract:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract/**
  yacymodel:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/yacymodel
      - github.com/nikitakarpei/yacy-rwi-node/yacymodel/**
  nats:
    in:
      - github.com/nats-io/nats.go
      - github.com/nats-io/nats.go/**
  natstestserver:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/natstestserver
  wallclock:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/wallclock
  prometheus:
    in:
      - github.com/prometheus/client_golang/**
  readability:
    in:
      - codeberg.org/readeck/go-readability/v2
  htmltomarkdown:
    in:
      - github.com/JohannesKaufmann/html-to-markdown/v2
  xnet:
    in:
      - golang.org/x/net/**
  backoff:
    in:
      - github.com/cenkalti/backoff/v4
  serviceruntime:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/jetstreamconnect
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/applog
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/opsmetrics
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/servergroup
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/envconfig

deps:
  ordersettlement:
    mayDependOn:
      - ordersettlement
      - contextcancellation
    canUse:
      - yacycrawlcontract
  ordertraversal:
    mayDependOn:
      - ordertraversal
      - ordersettlement
      - pagevisit
      - contextcancellation
    canUse:
      - yacycrawlcontract
      - canonicalurl
  pagevisit:
    mayDependOn:
      - pagevisit
      - recrawlpoliciesalwaysdue
  pageabsorption:
    mayDependOn:
      - pageabsorption
      - contentformatgraph
      - contentextraction
      - pagevisit
    canUse:
      - yacycrawlcontract
      - canonicalurl
      - backoff
  contentformatgraph:
    mayDependOn:
      - contentformatgraph
  contentextraction:
    mayDependOn:
      - contentextraction
      - contentformatgraph
  pagefetchershttp:
    mayDependOn:
      - pagefetchershttp
      - pagevisit
  documentextractorshtml:
    mayDependOn:
      - documentextractorshtml
      - contentextraction
      - contentformatgraph
    canUse:
      - canonicalurl
      - xnet
  documentextractorsarchive:
    mayDependOn:
      - documentextractorsarchive
      - contentextraction
  pagederivationsfulltext:
    mayDependOn:
      - pagederivationsfulltext
      - contentformatgraph
      - htmlflattening
  pagederivationsreadablehtml:
    mayDependOn:
      - pagederivationsreadablehtml
      - contentformatgraph
    canUse:
      - readability
      - xnet
  pagederivationsreadabletext:
    mayDependOn:
      - pagederivationsreadabletext
      - contentformatgraph
      - htmlflattening
  pagederivationsmarkdown:
    mayDependOn:
      - pagederivationsmarkdown
      - contentformatgraph
    canUse:
      - htmltomarkdown
  pagefeedsrwi:
    mayDependOn:
      - pagefeedsrwi
      - pageabsorption
      - contentformatgraph
    canUse:
      - yacycrawlcontract
      - yacymodel
  pagefeedstext:
    mayDependOn:
      - pagefeedstext
      - pageabsorption
      - contentformatgraph
    canUse:
      - yacycrawlcontract
  pagefeedsmarkdown:
    mayDependOn:
      - pagefeedsmarkdown
      - pageabsorption
      - contentformatgraph
    canUse:
      - yacycrawlcontract
  recrawlpoliciesalwaysdue:
    mayDependOn:
      - recrawlpoliciesalwaysdue
  orderreceiversjetstream:
    mayDependOn:
      - orderreceiversjetstream
      - ordersettlement
    canUse:
      - yacycrawlcontract
      - nats
      - natstestserver
  redirectresolversjetstream:
    mayDependOn:
      - redirectresolversjetstream
    canUse:
      - yacycrawlcontract
      - nats
      - natstestserver
  progressobserversprometheus:
    mayDependOn:
      - progressobserversprometheus
      - ordersettlement
      - ordertraversal
      - pageabsorption
      - pagevisit
    canUse:
      - prometheus
  feedpublishersjetstream:
    mayDependOn:
      - feedpublishersjetstream
      - pageabsorption
      - contentformatgraph
    canUse:
      - yacycrawlcontract
      - nats
      - natstestserver
  htmlflattening:
    mayDependOn:
      - htmlflattening
    canUse:
      - xnet
  contextcancellation:
    mayDependOn:
      - contextcancellation
  crawlercmd:
    mayDependOn:
      - ordersettlement
      - ordertraversal
      - pagevisit
      - pageabsorption
      - contentformatgraph
      - contentextraction
      - pagefetchershttp
      - documentextractorshtml
      - documentextractorsarchive
      - pagederivationsfulltext
      - pagederivationsreadablehtml
      - pagederivationsreadabletext
      - pagederivationsmarkdown
      - pagefeedsrwi
      - pagefeedstext
      - pagefeedsmarkdown
      - recrawlpoliciesalwaysdue
      - orderreceiversjetstream
      - redirectresolversjetstream
      - progressobserversprometheus
      - feedpublishersjetstream
    canUse:
      - yacycrawlcontract
      - nats
      - natstestserver
      - serviceruntime
      - wallclock

excludeFiles:
  - "test/e2e"
