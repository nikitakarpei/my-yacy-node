version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

commonVendors:
  - yacycrawlcontract
  - canonicalurl

components:
  pagevisitdrop:
    in: internal/crawl/pagevisitdrop/**
  pagevisitresult:
    in: internal/crawl/pagevisitresult/**
  retrydelay:
    in: internal/crawl/retrydelay/**
  crawlid:
    in: internal/crawl/crawlid/**
  pendingpagevisit:
    in: internal/crawl/pendingpagevisit/**
  profileadmission:
    in: internal/crawl/profileadmission/**
  acceptedorder:
    in: internal/crawl/acceptedorder/**
  orderintake:
    in: internal/crawl/orderintake/**
  pagevisitintake:
    in: internal/crawl/pagevisitintake/**
  pagevisit:
    in: internal/crawl/pagevisit/**
  observedfetch:
    in: internal/crawl/observedfetch/**
  pagehtml:
    in: internal/crawl/pagehtml/**
  linkdiscovery:
    in: internal/crawl/linkdiscovery/**
  pagehtmlreading:
    in: internal/crawl/pagehtmlreading/**
  pagevisitallowance:
    in: internal/crawl/pagevisitallowance/**
  pagevisitrecordsnorecords:
    in: internal/pagevisitrecords/norecords/**
  pagevisitrecordsvault:
    in: internal/pagevisitrecords/vault/**
  recrawlrulesdueaftergrace:
    in: internal/recrawlrules/dueaftergrace/**
  urlhash:
    in: internal/urlhash/**
  vaultkeyparts:
    in: internal/vaultkeyparts/**
  crawlsvault:
    in: internal/crawls/vault/**
  frontiersvault:
    in: internal/frontiers/vault/**
  takenpagevisitsvault:
    in: internal/takenpagevisits/vault/**
  pagevisitlimitsvault:
    in: internal/pagevisitlimits/vault/**
  crawlorderobserversapplog:
    in: internal/crawlorderobservers/applog/**
  crawlorderobserversprometheus:
    in: internal/crawlorderobservers/prometheus/**
  pendingpagevisitobserversapplog:
    in: internal/pendingpagevisitobservers/applog/**
  frontierobserversapplog:
    in: internal/frontierobservers/applog/**
  frontiermetricsprometheus:
    in: internal/frontiermetrics/prometheus/**
  pendingpagevisitobserversprometheus:
    in: internal/pendingpagevisitobservers/prometheus/**
  pagefetchobserversapplog:
    in: internal/pagefetchobservers/applog/**
  pagefetchobserversprometheus:
    in: internal/pagefetchobservers/prometheus/**
  mediatypeobserversapplog:
    in: internal/mediatypeobservers/applog/**
  mediatypeobserversprometheus:
    in: internal/mediatypeobservers/prometheus/**
  linkresolutionobserversapplog:
    in: internal/linkresolutionobservers/applog/**
  linkresolutionobserversprometheus:
    in: internal/linkresolutionobservers/prometheus/**
  refusalenforcementobserversapplog:
    in: internal/refusalenforcementobservers/applog/**
  refusalenforcementobserversprometheus:
    in: internal/refusalenforcementobservers/prometheus/**
  crawledpageobserversapplog:
    in: internal/crawledpageobservers/applog/**
  crawledpageobserversprometheus:
    in: internal/crawledpageobservers/prometheus/**
  pagevisitrecordobserversapplog:
    in: internal/pagevisitrecordobservers/applog/**
  pagevisitrecordobserversprometheus:
    in: internal/pagevisitrecordobservers/prometheus/**
  crawledpagesjetstream:
    in: internal/crawledpages/jetstream/**
  crawlercmd:
    in: cmd/yacycrawler/**

vendors:
  budgetbuckets:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/budgetbuckets
  canonicalurl:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl/**
  yacycrawlcontract:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract/**
  nats:
    in:
      - github.com/nats-io/nats.go
      - github.com/nats-io/nats.go/**
  vault:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/vault
  uuid:
    in:
      - github.com/google/uuid
  wallclock:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/wallclock
  prometheus:
    in:
      - github.com/prometheus/client_golang/**
  pagefetch:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/pagefetch
  robotsmeta:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/robotsmeta
      - github.com/nikitakarpei/yacy-rwi-node/robotsmeta/**
  nethtml:
    in:
      - golang.org/x/net/html
      - golang.org/x/net/html/**
  serviceruntime:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/jetstreamconnect
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/applog
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/opsmetrics
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/servergroup
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/envconfig
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/poisonhalt
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/pullintake

deps:
  crawlid:
    canUse:
      - uuid
  pendingpagevisit:
    mayDependOn:
      - crawlid
    canUse:
      - canonicalurl
  acceptedorder:
    mayDependOn:
      - profileadmission
    canUse:
      - canonicalurl
      - yacycrawlcontract
  orderintake:
    mayDependOn:
      - crawlid
      - pendingpagevisit
      - acceptedorder
    canUse:
      - yacycrawlcontract
      - serviceruntime
  pagevisitintake:
    mayDependOn:
      - crawlid
      - pagevisitdrop
      - pagevisitresult
      - pagevisitallowance
      - pendingpagevisit
      - acceptedorder
      - pagevisit
    canUse:
      - canonicalurl
      - yacycrawlcontract
      - serviceruntime
  pagehtml:
    canUse:
      - nethtml
  linkdiscovery:
    mayDependOn:
      - pagehtml
    canUse:
      - canonicalurl
  pagevisit:
    mayDependOn:
      - acceptedorder
      - pagevisitdrop
      - pagevisitresult
      - pagehtmlreading
      - pendingpagevisit
    canUse:
      - canonicalurl
      - pagefetch
  observedfetch:
    canUse:
      - canonicalurl
      - pagefetch
  pagehtmlreading:
    mayDependOn:
      - pagehtml
      - linkdiscovery
    canUse:
      - canonicalurl
      - pagefetch
      - robotsmeta
  pagevisitallowance:
    mayDependOn:
      - crawlid
      - pagevisitdrop
      - pendingpagevisit
      - retrydelay
    canUse:
      - canonicalurl
  pagevisitrecordsnorecords:
    mayDependOn:
      - pagevisit
    canUse:
      - pagefetch
  pagevisitrecordsvault:
    mayDependOn:
      - pagevisit
      - vaultkeyparts
      - urlhash
    canUse:
      - vault
      - pagefetch
  recrawlrulesdueaftergrace:
    mayDependOn:
      - pagevisit
  urlhash:
    canUse:
      - canonicalurl
  vaultkeyparts:
    mayDependOn:
      - crawlid
      - urlhash
    canUse:
      - vault
  crawlsvault:
    mayDependOn:
      - acceptedorder
      - crawlid
      - vaultkeyparts
    canUse:
      - vault
      - yacycrawlcontract
  frontiersvault:
    mayDependOn:
      - pendingpagevisit
      - crawlid
      - vaultkeyparts
      - urlhash
    canUse:
      - vault
      - serviceruntime
  takenpagevisitsvault:
    mayDependOn:
      - crawlid
      - vaultkeyparts
      - urlhash
    canUse:
      - vault
      - canonicalurl
  pagevisitlimitsvault:
    mayDependOn:
      - crawlid
      - vaultkeyparts
      - urlhash
    canUse:
      - vault
      - canonicalurl
      - yacycrawlcontract
  crawledpagesjetstream:
    canUse:
      - nats
  crawlorderobserversapplog:
    mayDependOn:
      - crawlid
      - orderintake
  crawlorderobserversprometheus:
    mayDependOn:
      - crawlid
      - orderintake
    canUse:
      - prometheus
  pendingpagevisitobserversapplog:
    mayDependOn:
      - pagevisitdrop
      - pagevisitresult
      - pendingpagevisit
  frontiermetricsprometheus:
    canUse:
      - prometheus
  pendingpagevisitobserversprometheus:
    mayDependOn:
      - pagevisitdrop
      - pagevisitresult
      - pendingpagevisit
    canUse:
      - prometheus
      - canonicalurl
  pagefetchobserversapplog:
    canUse:
      - canonicalurl
      - pagefetch
  pagefetchobserversprometheus:
    canUse:
      - prometheus
      - budgetbuckets
      - canonicalurl
      - pagefetch
  mediatypeobserversprometheus:
    canUse:
      - prometheus
  linkresolutionobserversapplog:
    canUse:
      - canonicalurl
  linkresolutionobserversprometheus:
    canUse:
      - prometheus
      - canonicalurl
  refusalenforcementobserversapplog:
    canUse:
      - canonicalurl
  refusalenforcementobserversprometheus:
    canUse:
      - prometheus
      - canonicalurl
  crawledpageobserversapplog:
    mayDependOn:
      - crawledpagesjetstream
    canUse:
      - canonicalurl
  crawledpageobserversprometheus:
    mayDependOn:
      - crawledpagesjetstream
    canUse:
      - prometheus
      - canonicalurl
  pagevisitrecordobserversapplog:
    canUse:
      - canonicalurl
  pagevisitrecordobserversprometheus:
    canUse:
      - prometheus
      - canonicalurl
  crawlercmd:
    anyProjectDeps: true
    anyVendorDeps: true

excludeFiles:
  - "test/e2e"
  - "_test\\.go"
  - "contract"
