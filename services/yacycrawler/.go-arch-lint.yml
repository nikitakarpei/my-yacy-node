version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

commonVendors:
  - yacycrawlcontract

commonComponents:
  - clock
  - contentformatgraph

components:
  clock:
    in: internal/crawl/clock/**
  disposal:
    in: internal/crawl/disposal/**
  refusal:
    in: internal/crawl/refusal/**
  retrydelay:
    in: internal/crawl/retrydelay/**
  fetchedpage:
    in: internal/crawl/fetchedpage/**
  frontier:
    in: internal/crawl/frontier/**
  profileadmission:
    in: internal/crawl/profileadmission/**
  redirectrecording:
    in: internal/crawl/redirectrecording/**
  pagepublication:
    in: internal/crawl/pagepublication/**
  ordersettlement:
    in: internal/crawl/ordersettlement/**
  ordertraversal:
    in: internal/crawl/ordertraversal/**
  visitdispatch:
    in: internal/crawl/visitdispatch/**
  mediatypeallowance:
    in: internal/mediatypeallowance/**
  pagevisit:
    in: internal/crawl/pagevisit/**
  pageabsorption:
    in: internal/crawl/pageabsorption/**
  contentformatgraph:
    in: internal/crawl/contentformatgraph/**
  contentextraction:
    in: internal/crawl/contentextraction/**
  pagefetchershttp:
    in: internal/pagefetchers/http/**
  mediaextractorshtml:
    in: internal/mediaextractors/html/**
  containerexpandersarchive:
    in: internal/containerexpanders/archive/**
  pagederivationsfulltext:
    in: internal/pagederivations/fulltext/**
  pagederivationsreadablehtml:
    in: internal/pagederivations/readablehtml/**
  pagederivationsreadabletext:
    in: internal/pagederivations/readabletext/**
  pagederivationsmarkdown:
    in: internal/pagederivations/markdown/**
  pagerepresentationsrwi:
    in: internal/pagerepresentations/rwi/**
  pagerepresentationstext:
    in: internal/pagerepresentations/text/**
  pagerepresentationsmarkdown:
    in: internal/pagerepresentations/markdown/**
  recrawlrulesalwaysdue:
    in: internal/recrawlrules/alwaysdue/**
  recrawlrulesdueaftergrace:
    in: internal/recrawlrules/dueaftergrace/**
  orderreceiversjetstream:
    in: internal/orderreceivers/jetstream/**
  redirectresolversjetstream:
    in: internal/redirectresolvers/jetstream/**
  progressobserversprometheus:
    in: internal/progressobservers/prometheus/**
  representationpublishersjetstream:
    in: internal/representationpublishers/jetstream/**
  htmlflattening:
    in: internal/htmlflattening/**
  contextcancellation:
    in: internal/contextcancellation/**
  disposedpagesjetstream:
    in: internal/disposedpages/jetstream/**
  crawlercmd:
    in: cmd/yacycrawler/**

vendors:
  canonicalurl:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl/**
  yacycrawlcontract:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract/**
  yacymodel:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/yacymodel
      - github.com/nikitakarpei/yacy-rwi-node/yacymodel/**
  nats:
    in:
      - github.com/nats-io/nats.go
      - github.com/nats-io/nats.go/**
  wallclock:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/wallclock
  prometheus:
    in:
      - github.com/prometheus/client_golang/**
  readability:
    in:
      - codeberg.org/readeck/go-readability/v2
  htmltomarkdown:
    in:
      - github.com/JohannesKaufmann/html-to-markdown/v2
  xnet:
    in:
      - golang.org/x/net/**
  serviceruntime:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/jetstreamconnect
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/applog
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/opsmetrics
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/servergroup
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/envconfig

deps:
  frontier:
    mayDependOn:
      - retrydelay
  redirectrecording:
    mayDependOn:
      - pagevisit
    canUse:
      - canonicalurl
  ordersettlement:
    mayDependOn:
      - contextcancellation
  ordertraversal:
    mayDependOn:
      - visitdispatch
      - disposal
      - refusal
      - frontier
      - profileadmission
      - pagevisit
      - pageabsorption
      - contextcancellation
    canUse:
      - canonicalurl
  visitdispatch:
    mayDependOn:
      - frontier
      - pagevisit
  pagevisit:
    mayDependOn:
      - disposal
      - refusal
      - fetchedpage
      - pageabsorption
  pageabsorption:
    mayDependOn:
      - disposal
      - contentextraction
      - pagepublication
      - fetchedpage
    canUse:
      - canonicalurl
  pagepublication:
    mayDependOn:
      - retrydelay
  pagefetchershttp:
    mayDependOn:
      - pagevisit
      - fetchedpage
  mediaextractorshtml:
    mayDependOn:
      - contentextraction
    canUse:
      - canonicalurl
      - xnet
  containerexpandersarchive:
    mayDependOn:
      - contentextraction
  pagederivationsfulltext:
    mayDependOn:
      - htmlflattening
  pagederivationsreadablehtml:
    canUse:
      - readability
      - xnet
  pagederivationsreadabletext:
    mayDependOn:
      - htmlflattening
  pagederivationsmarkdown:
    canUse:
      - htmltomarkdown
  pagerepresentationsrwi:
    mayDependOn:
      - pagepublication
    canUse:
      - yacymodel
  pagerepresentationstext:
    mayDependOn:
      - pagepublication
  pagerepresentationsmarkdown:
    mayDependOn:
      - pagepublication
  recrawlrulesalwaysdue:
    mayDependOn:
      - pagevisit
  recrawlrulesdueaftergrace:
    mayDependOn:
      - pagevisit
    canUse:
      - nats
  orderreceiversjetstream:
    mayDependOn:
      - ordersettlement
    canUse:
      - nats
  redirectresolversjetstream:
    canUse:
      - nats
  disposedpagesjetstream:
    canUse:
      - nats
  progressobserversprometheus:
    mayDependOn:
      - ordersettlement
      - ordertraversal
      - pagepublication
      - pagevisit
      - disposal
      - refusal
    canUse:
      - prometheus
  representationpublishersjetstream:
    mayDependOn:
      - pagepublication
    canUse:
      - nats
  htmlflattening:
    canUse:
      - xnet
  crawlercmd:
    anyProjectDeps: true
    anyVendorDeps: true

excludeFiles:
  - "test/e2e"
  - "_test\\.go"
  - "contract"
