version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  redirectresolution:
    in: internal/redirectresolution/**
  crawlcapability:
    in: internal/crawlcapability/**
  contextcancellation:
    in: internal/contextcancellation/**
  ordersettlement:
    in: internal/ordersettlement/**
  ordertraversal:
    in: internal/ordertraversal/**
  pagevisit:
    in: internal/pagevisit/**
  pageabsorption:
    in: internal/pageabsorption/**
  contentformatgraph:
    in: internal/contentformatgraph/**
  htmlpage:
    in: internal/htmlpage/**
  contentextraction:
    in: internal/contentextraction/**
  archivemember:
    in: internal/archivemember/**
  httpfetch:
    in: internal/httpfetch/**
  rwirepresentation:
    in: internal/rwirepresentation/**
  pagereadabletext:
    in: internal/pagereadabletext/**
  pagereadablehtml:
    in: internal/pagereadablehtml/**
  htmltext:
    in: internal/htmltext/**
  pagemarkdown:
    in: internal/pagemarkdown/**
  pagefulltext:
    in: internal/pagefulltext/**
  pagefeed:
    in: internal/pagefeed/**
  orderintake:
    in: internal/orderintake/**
  crawlmetrics:
    in: internal/crawlmetrics/**
  crawlercmd:
    in: cmd/yacycrawler/**

vendors:
  canonicalurl:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl/**
  yacycrawlcontract:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract/**
  yacymodel:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/yacymodel
      - github.com/nikitakarpei/yacy-rwi-node/yacymodel/**
  nats:
    in:
      - github.com/nats-io/nats.go
      - github.com/nats-io/nats.go/**
  natstestserver:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/natstestserver
  wallclock:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/wallclock
  prometheus:
    in:
      - github.com/prometheus/client_golang/**
  readability:
    in:
      - codeberg.org/readeck/go-readability/v2
  htmltomarkdown:
    in:
      - github.com/JohannesKaufmann/html-to-markdown/v2
  xnet:
    in:
      - golang.org/x/net/**
  backoff:
    in:
      - github.com/cenkalti/backoff/v4
  serviceruntime:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/jetstreamconnect
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/applog
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/opsmetrics
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/servergroup
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/envconfig

deps:
  redirectresolution:
    mayDependOn:
      - redirectresolution
    canUse:
      - yacycrawlcontract
      - nats
      - natstestserver
  crawlcapability:
    mayDependOn:
      - crawlcapability
    canUse:
      - yacycrawlcontract
      - yacymodel
  contextcancellation:
    mayDependOn:
      - contextcancellation
  ordersettlement:
    mayDependOn:
      - ordersettlement
      - crawlcapability
      - contextcancellation
    canUse:
      - yacycrawlcontract
  ordertraversal:
    mayDependOn:
      - ordertraversal
      - pagevisit
      - crawlcapability
      - contextcancellation
    canUse:
      - yacycrawlcontract
      - canonicalurl
  pagevisit:
    mayDependOn:
      - pagevisit
      - crawlcapability
  pageabsorption:
    mayDependOn:
      - pageabsorption
      - contentformatgraph
      - crawlcapability
    canUse:
      - yacycrawlcontract
      - canonicalurl
      - backoff
  contentformatgraph:
    mayDependOn:
      - contentformatgraph
      - crawlcapability
  rwirepresentation:
    mayDependOn:
      - rwirepresentation
      - crawlcapability
      - htmltext
    canUse:
      - yacycrawlcontract
      - yacymodel
  pagereadabletext:
    mayDependOn:
      - pagereadabletext
      - crawlcapability
      - htmltext
    canUse:
      - yacycrawlcontract
  pagereadablehtml:
    mayDependOn:
      - pagereadablehtml
      - crawlcapability
    canUse:
      - readability
      - xnet
  htmltext:
    mayDependOn:
      - htmltext
    canUse:
      - xnet
  pagemarkdown:
    mayDependOn:
      - pagemarkdown
      - crawlcapability
    canUse:
      - yacycrawlcontract
      - htmltomarkdown
  pagefulltext:
    mayDependOn:
      - pagefulltext
      - crawlcapability
      - htmltext
  htmlpage:
    mayDependOn:
      - htmlpage
      - crawlcapability
    canUse:
      - canonicalurl
      - xnet
  contentextraction:
    mayDependOn:
      - contentextraction
      - crawlcapability
  archivemember:
    mayDependOn:
      - archivemember
      - crawlcapability
  httpfetch:
    mayDependOn:
      - httpfetch
      - crawlcapability
  pagefeed:
    mayDependOn:
      - pagefeed
      - crawlcapability
      - rwirepresentation
    canUse:
      - yacycrawlcontract
      - yacymodel
      - nats
      - natstestserver
  orderintake:
    mayDependOn:
      - orderintake
      - crawlcapability
    canUse:
      - yacycrawlcontract
      - nats
      - natstestserver
  crawlmetrics:
    mayDependOn:
      - crawlmetrics
    canUse:
      - prometheus
  crawlercmd:
    mayDependOn:
      - ordersettlement
      - ordertraversal
      - pagevisit
      - pageabsorption
      - contentformatgraph
      - crawlcapability
      - htmlpage
      - contentextraction
      - archivemember
      - httpfetch
      - pagefeed
      - pagereadabletext
      - pagereadablehtml
      - pagemarkdown
      - pagefulltext
      - orderintake
      - crawlmetrics
      - redirectresolution
    canUse:
      - yacycrawlcontract
      - nats
      - natstestserver
      - serviceruntime
      - wallclock

excludeFiles:
  - "test/e2e"
