    in: internal/pagevisitrecordobservers/prometheus/**
  crawledpagesjetstream:
    in: internal/crawledpages/jetstream/**
  crawlercmd:
    in: cmd/yacycrawler/**

vendors:
  budgetbuckets:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/budgetbuckets
  canonicalurl:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl/**
  yacycrawlcontract:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract/**
  nats:
    in:
      - github.com/nats-io/nats.go
      - github.com/nats-io/nats.go/**
  redis:
    in:
      - github.com/redis/go-redis/v9
  wallclock:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/wallclock
  prometheus:
    in:
      - github.com/prometheus/client_golang/**
  pagefetch:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/pagefetch
  redirectfollowingfetch:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/pagefetch/redirectfollowingfetch
  grobotstxt:
    in:
      - github.com/jimsmart/grobotstxt
  robotsmeta:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/robotsmeta
      - github.com/nikitakarpei/yacy-rwi-node/robotsmeta/**
  nethtml:
    in:
      - golang.org/x/net/html
      - golang.org/x/net/html/**
  serviceruntime:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/jetstreamconnect
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/applog
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/opsmetrics
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/servergroup
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/envconfig
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/poisonhalt
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/pullintake

deps:
  pendingpagevisit:
    canUse:
      - canonicalurl
  acceptedorder:
    mayDependOn:
      - profileadmission
    canUse:
      - canonicalurl
      - yacycrawlcontract
  orderintake:
    mayDependOn:
      - pendingpagevisit
      - acceptedorder
    canUse:
      - yacycrawlcontract
      - serviceruntime
  pagevisitintake:
    mayDependOn:
      - pagevisitdrop
      - pagevisitresult
      - pagevisitallowance
      - pendingpagevisit
      - acceptedorder
      - pagevisit
      - robotsexclusion
    canUse:
      - canonicalurl
      - yacycrawlcontract
      - serviceruntime
  pagehtml:
    canUse:
      - nethtml
  linkdiscovery:
    mayDependOn:
      - pagehtml
    canUse:
      - canonicalurl
  pagevisit:
    mayDependOn:
      - acceptedorder
      - pagevisitdrop
      - pagevisitresult
      - pagehtmlreading
      - pendingpagevisit
    canUse:
      - canonicalurl
      - pagefetch
  observedfetch:
    canUse:
      - canonicalurl
      - pagefetch
  pagehtmlreading:
    mayDependOn:
      - pagehtml
      - linkdiscovery
    canUse:
      - canonicalurl
      - pagefetch
      - robotsmeta
  pagevisitallowance:
    mayDependOn:
      - pagevisitdrop
      - pendingpagevisit
      - retrydelay
    canUse:
      - canonicalurl
  robotsexclusion:
    canUse:
      - canonicalurl
      - grobotstxt
  robotsrulesorigin:
    mayDependOn:
      - robotsexclusion
    canUse:
      - canonicalurl
      - pagefetch
      - redirectfollowingfetch
  robotsrulesredis:
    mayDependOn:
      - robotsexclusion
      - redisrecord
    canUse:
      - redis
      - canonicalurl
  pagevisitrecordsnorecords:
    mayDependOn:
      - pagevisit
    canUse:
      - pagefetch
  pagevisitrecordsredis:
    mayDependOn:
      - pagevisit
      - redisrecord
    canUse:
      - redis
      - pagefetch
  recrawlrulesdueaftergrace:
    mayDependOn:
      - pagevisit
  acceptedordersredis:
    mayDependOn:
      - acceptedorder
      - redisrecord
    canUse:
      - redis
      - yacycrawlcontract
  pendingpagevisitsredis:
    mayDependOn:
      - pendingpagevisit
      - redisrecord
    canUse:
      - redis
      - serviceruntime
  redisrecord:
    canUse:
      - redis
  takenpagevisitsredis:
    mayDependOn:
      - redisrecord
    canUse:
      - redis
      - canonicalurl
  pagevisitlimitsredis:
    mayDependOn:
      - redisrecord
    canUse:
      - redis
      - canonicalurl
      - yacycrawlcontract
  crawledpagesjetstream:
    canUse:
      - nats
  crawlorderobserversapplog:
    mayDependOn:
      - orderintake
  crawlorderobserversprometheus:
    mayDependOn:
      - orderintake
    canUse:
      - prometheus
  pendingpagevisitobserversapplog:
    mayDependOn:
      - pagevisitdrop
      - pagevisitresult
      - pendingpagevisit
  frontiermetricsprometheus:
    canUse:
      - prometheus
  pendingpagevisitobserversprometheus:
    mayDependOn:
      - pagevisitdrop
      - pagevisitresult
      - pendingpagevisit
    canUse:
      - prometheus
      - canonicalurl
  pagefetchobserversapplog:
    canUse:
      - canonicalurl
      - pagefetch
  pagefetchobserversprometheus:
    canUse:
      - prometheus
      - budgetbuckets
      - canonicalurl
      - pagefetch
  mediatypeobserversprometheus:
    canUse:
      - prometheus
  linkresolutionobserversapplog:
    canUse:
      - canonicalurl
  linkresolutionobserversprometheus:
    canUse:
      - prometheus
      - canonicalurl
  refusalenforcementobserversapplog:
    canUse:
      - canonicalurl
  refusalenforcementobserversprometheus:
    canUse:
      - prometheus
      - canonicalurl
  robotstxtfetchobserversapplog:
    canUse:
      - canonicalurl
  robotstxtfetchobserversprometheus:
    canUse:
      - prometheus
      - canonicalurl
  robotsrulesobserversapplog:
    canUse:
      - canonicalurl
  robotsrulesobserversprometheus:
    canUse:
      - prometheus
      - canonicalurl
  crawledpageobserversapplog:
    mayDependOn:
      - crawledpagesjetstream
    canUse:
      - canonicalurl
  crawledpageobserversprometheus:
    mayDependOn:
      - crawledpagesjetstream
    canUse:
      - prometheus
      - canonicalurl
  pagevisitrecordobserversapplog:
    canUse:
      - canonicalurl
  pagevisitrecordobserversprometheus:
    canUse:
      - prometheus
      - canonicalurl
  crawlercmd:
    anyProjectDeps: true
    anyVendorDeps: true

excludeFiles:
  - "test/e2e"
  - "_test\\.go"
  - "contract"
