version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

commonVendors:
  - yacycrawlcontract
  - scraperequestcontract
  - canonicalurl

commonComponents:
  - clock

components:
  clock:
    in: internal/crawl/clock/**
  disposal:
    in: internal/crawl/disposal/**
  refusal:
    in: internal/crawl/refusal/**
  retrydelay:
    in: internal/crawl/retrydelay/**
  pendingvisit:
    in: internal/crawl/pendingvisit/**
  profileadmission:
    in: internal/crawl/profileadmission/**
  acceptedorder:
    in: internal/crawl/acceptedorder/**
  orderintake:
    in: internal/crawl/orderintake/**
  visitclaim:
    in: internal/crawl/visitclaim/**
  visitintake:
    in: internal/crawl/visitintake/**
  fetchtiming:
    in: internal/crawl/fetchtiming/**
  pagevisit:
    in: internal/crawl/pagevisit/**
  pagemarkup:
    in: internal/crawl/pagemarkup/**
  pagerobots:
    in: internal/crawl/pagerobots/**
  linkdiscovery:
    in: internal/crawl/linkdiscovery/**
  recrawlrulesalwaysdue:
    in: internal/recrawlrules/alwaysdue/**
  recrawlrulesdueaftergrace:
    in: internal/recrawlrules/dueaftergrace/**
  acceptedordersjetstream:
    in: internal/acceptedorders/jetstream/**
  pendingvisitsjetstream:
    in: internal/pendingvisits/jetstream/**
  jetstreamrecord:
    in: internal/jetstreamrecord/**
  visitclaimsjetstream:
    in: internal/visitclaims/jetstream/**
  progressobserversprometheus:
    in: internal/progressobservers/prometheus/**
  scraperequestsjetstream:
    in: internal/scraperequests/jetstream/**
  crawlercmd:
    in: cmd/yacycrawler/**

vendors:
  canonicalurl:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl/**
  yacycrawlcontract:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract/**
  scraperequestcontract:
    in: github.com/nikitakarpei/yacy-rwi-node/scraperequestcontract
  nats:
    in:
      - github.com/nats-io/nats.go
      - github.com/nats-io/nats.go/**
  wallclock:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/wallclock
  prometheus:
    in:
      - github.com/prometheus/client_golang/**
  pagefetch:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/pagefetch
  nethtml:
    in:
      - golang.org/x/net/html
      - golang.org/x/net/html/**
  serviceruntime:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/jetstreamconnect
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/applog
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/opsmetrics
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/servergroup
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/envconfig
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/poisonhalt
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/pullintake

deps:
  pendingvisit:
    canUse:
      - canonicalurl
  acceptedorder:
    mayDependOn:
      - profileadmission
    canUse:
      - canonicalurl
      - yacycrawlcontract
  orderintake:
    mayDependOn:
      - pendingvisit
      - acceptedorder
    canUse:
      - yacycrawlcontract
      - serviceruntime
  visitintake:
    mayDependOn:
      - disposal
      - visitclaim
      - refusal
      - retrydelay
      - pendingvisit
      - acceptedorder
      - pagevisit
    canUse:
      - canonicalurl
      - yacycrawlcontract
      - serviceruntime
  fetchtiming:
    canUse:
      - pagefetch
  pagemarkup:
    canUse:
      - nethtml
  pagerobots:
    mayDependOn:
      - pagemarkup
    canUse:
      - nethtml
  linkdiscovery:
    mayDependOn:
      - pagemarkup
    canUse:
      - canonicalurl
      - nethtml
  pagevisit:
    mayDependOn:
      - disposal
      - refusal
      - pagemarkup
      - pagerobots
      - linkdiscovery
    canUse:
      - canonicalurl
      - pagefetch
  recrawlrulesalwaysdue:
    mayDependOn:
      - pagevisit
    canUse:
      - pagefetch
  recrawlrulesdueaftergrace:
    mayDependOn:
      - pagevisit
    canUse:
      - nats
      - pagefetch
  acceptedordersjetstream:
    mayDependOn:
      - acceptedorder
    canUse:
      - nats
      - yacycrawlcontract
  pendingvisitsjetstream:
    mayDependOn:
      - pendingvisit
    canUse:
      - nats
  jetstreamrecord:
    canUse:
      - nats
  visitclaimsjetstream:
    mayDependOn:
      - visitclaim
      - jetstreamrecord
    canUse:
      - nats
      - canonicalurl
      - yacycrawlcontract
  scraperequestsjetstream:
    canUse:
      - nats
  progressobserversprometheus:
    mayDependOn:
      - orderintake
      - visitintake
      - pagevisit
      - fetchtiming
      - disposal
      - refusal
    canUse:
      - prometheus
  crawlercmd:
    anyProjectDeps: true
    anyVendorDeps: true

excludeFiles:
  - "test/e2e"
  - "_test\\.go"
  - "contract"
