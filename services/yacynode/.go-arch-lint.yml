version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

commonVendors:
  - yacymodel

commonComponents:
  - vaulttest
  - searchtest

components:
  vaultkey:
    in: internal/vaultkey/**
  hashcodec:
    in: internal/hashcodec/**
  vault:
    in: internal/vault/**
  vaultenginesbolt:
    in: internal/vaultengines/bolt/**
  vaultenginesmemory:
    in: internal/vaultengines/memory/**
  vaulttest:
    in: internal/vaulttest/**
  httpguard:
    in: internal/httpguard/**
  nodeidentity:
    in: internal/nodeidentity/**
  peeradmission:
    in: internal/peeradmission/**
  peerroster:
    in: internal/peerroster/**
  peerannouncement:
    in: internal/peerannouncement/**
  peerwire:
    in: internal/peerwire/**
  bootstrap:
    in: internal/bootstrap/**
  landing:
    in: internal/landing/**
  urlmeta:
    in: internal/urlmeta/**
  urlmetastaleness:
    in: internal/urlmetastaleness/**
  urlreferences:
    in: internal/urlreferences/**
  rwipostings:
    in: internal/rwipostings/**
  rwiescrow:
    in: internal/rwiescrow/**
  rwiadmission:
    in: internal/rwiadmission/**
  rwiingress:
    in: internal/rwiingress/**
  rwidistribution:
    in: internal/rwidistribution/**
  postingcourier:
    in: internal/rwidistribution/postingcourier/**
  urlmetadatacourier:
    in: internal/rwidistribution/urlmetadatacourier/**
  replicaeligibility:
    in: internal/rwidistribution/replicaeligibility/**
  documentsearch:
    in: internal/documentsearch/**
  searchmetrics:
    in: internal/documentsearch/searchmetrics/**
  searchtest:
    in: internal/documentsearch/searchtest/**
  nodestatus:
    in: internal/nodestatus/**
  eviction:
    in: internal/eviction/**
  metrics:
    in: internal/metrics/**
  crawlresults:
    in: internal/crawlresults/**
  crawlbroker:
    in: internal/crawlbroker/**
  cmd:
    in:
      - cmd/yacy-peer-hash/**
      - cmd/yacy-rwi-node/**

vendors:
  yacymodel:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/yacymodel
      - github.com/nikitakarpei/yacy-rwi-node/yacymodel/**
  yacyproto:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/yacyproto
      - github.com/nikitakarpei/yacy-rwi-node/yacyproto/**
  yacycrawlcontract:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract/**
  bbolt:
    in: go.etcd.io/bbolt
  orderedcode:
    in: github.com/google/orderedcode
  prometheus:
    in:
      - github.com/prometheus/client_golang/prometheus
      - github.com/prometheus/client_golang/prometheus/**
      - github.com/prometheus/client_model/go
  nats:
    in:
      - github.com/nats-io/nats.go
      - github.com/nats-io/nats.go/**
  natstestserver:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/natstestserver
  bytesize:
    in: github.com/nikitakarpei/yacy-rwi-node/bytesize
  serviceruntime:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/jetstreamconnect
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/applog
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/opsmetrics
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/servergroup
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/envconfig

deps:
  vaultkey:
    mayDependOn:
      - vaultkey
    canUse:
      - orderedcode
  hashcodec:
    mayDependOn:
      - hashcodec
      - vaultkey
  vault:
    mayDependOn:
      - vault
      - vaultkey
  vaultenginesbolt:
    deepScan: false
    mayDependOn:
      - vaultenginesbolt
      - vaultkey
      - vault
    canUse:
      - bbolt
  vaultenginesmemory:
    mayDependOn:
      - vaultenginesmemory
      - vaultkey
      - vault
  vaulttest:
    mayDependOn:
      - vaultkey
      - vault
  httpguard:
    mayDependOn:
      - httpguard
    canUse:
      - yacyproto
  nodeidentity:
    canUse:
      - yacyproto
  peeradmission:
    mayDependOn:
      - peeradmission
      - peerroster
      - httpguard
      - nodeidentity
    canUse:
      - yacyproto
  peerroster:
    mayDependOn:
      - peerroster
      - vaultkey
      - hashcodec
      - vault
      - vaultenginesmemory
    canUse:
      - yacyproto
  peerannouncement:
    mayDependOn:
      - peerannouncement
      - peerroster
      - peerwire
      - bootstrap
    canUse:
      - yacyproto
  peerwire:
    mayDependOn:
      - peerwire
    canUse:
      - yacyproto
  bootstrap:
    mayDependOn:
      - bootstrap
    canUse:
      - yacyproto
  landing:
    mayDependOn:
      - landing
  urlmeta:
    mayDependOn:
      - urlmeta
      - vaultkey
      - hashcodec
      - vault
      - vaultenginesmemory
      - httpguard
      - nodeidentity
    canUse:
      - yacyproto
  urlmetastaleness:
    mayDependOn:
      - urlmetastaleness
      - urlmeta
      - vaultkey
      - hashcodec
      - vault
      - vaultenginesmemory
  urlreferences:
    mayDependOn:
      - urlreferences
      - rwipostings
      - vaultkey
      - hashcodec
      - vault
      - vaultenginesmemory
  rwipostings:
    mayDependOn:
      - rwipostings
      - vaultkey
      - hashcodec
      - vault
      - vaultenginesmemory
  rwiescrow:
    mayDependOn:
      - rwiescrow
      - rwipostings
      - urlmeta
      - vaultkey
      - hashcodec
      - vault
      - vaultenginesmemory
  rwiadmission:
    mayDependOn:
      - rwiadmission
      - rwiescrow
      - rwipostings
      - urlmeta
      - vault
      - vaultenginesmemory
  rwiingress:
    mayDependOn:
      - rwiingress
      - rwiadmission
      - httpguard
      - nodeidentity
    canUse:
      - yacyproto
  rwidistribution:
    mayDependOn:
      - rwidistribution
      - rwipostings
      - vault
      - vaultenginesmemory
      - vaultkey
      - hashcodec
      - peerroster
      - urlmeta
      - postingcourier
      - urlmetadatacourier
      - replicaeligibility
  postingcourier:
    mayDependOn:
      - postingcourier
      - peerwire
    canUse:
      - yacyproto
  urlmetadatacourier:
    mayDependOn:
      - urlmetadatacourier
      - peerwire
    canUse:
      - yacyproto
  replicaeligibility:
    mayDependOn:
      - replicaeligibility
  documentsearch:
    mayDependOn:
      - documentsearch
      - searchmetrics
      - rwipostings
      - urlmeta
      - httpguard
      - nodeidentity
    canUse:
      - yacyproto
      - prometheus
  searchmetrics:
    mayDependOn:
      - searchmetrics
    canUse:
      - prometheus
  nodestatus:
    mayDependOn:
      - nodestatus
      - httpguard
      - nodeidentity
    canUse:
      - yacyproto
  eviction:
    mayDependOn:
      - eviction
      - rwipostings
      - urlmeta
      - urlmetastaleness
      - urlreferences
      - vaultkey
      - vault
      - vaultenginesmemory
  metrics:
    mayDependOn:
      - metrics
      - eviction
      - vault
    canUse:
      - prometheus
  crawlresults:
    mayDependOn:
      - crawlresults
      - urlmeta
      - rwiadmission
    canUse:
      - yacycrawlcontract
  crawlbroker:
    mayDependOn:
      - crawlbroker
      - crawlresults
    canUse:
      - yacycrawlcontract
      - nats
      - natstestserver
      - serviceruntime
  cmd:
    anyProjectDeps: true
    anyVendorDeps: true

excludeFiles:
  - "test/e2e"
