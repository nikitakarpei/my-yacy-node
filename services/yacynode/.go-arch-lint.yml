version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

commonVendors:
  - yacymodel
  - canonicalurl

components:
  hashcodec:
    in: internal/hashcodec/**
  httpguard:
    in: internal/httpguard/**
  nodeconfiguration:
    in: internal/nodeconfiguration/**
  nodeidentity:
    in: internal/nodeidentity/**
  peeradmission:
    in: internal/peeradmission/**
  peerroster:
    in: internal/peerroster/**
  peerannouncement:
    in: internal/peerannouncement/**
  peerwire:
    in: internal/peerwire/**
  nodepeerhash:
    in: internal/nodepeerhash/**
  bootstrap:
    in: internal/bootstrap/**
  landing:
    in: internal/landing/**
  urlmeta:
    in: internal/urlmeta/**
  urlmetastaleness:
    in: internal/urlmetastaleness/**
  urlreferences:
    in: internal/urlreferences/**
  rwipostings:
    in: internal/rwipostings/**
  rwiescrow:
    in: internal/rwiescrow/**
  rwiadmission:
    in: internal/rwiadmission/**
  rwiingress:
    in: internal/rwiingress/**
  rwidistribution:
    in: internal/rwidistribution/**
  postingcourier:
    in: internal/rwidistribution/postingcourier/**
  urlmetadatacourier:
    in: internal/rwidistribution/urlmetadatacourier/**
  replicaeligibility:
    in: internal/rwidistribution/replicaeligibility/**
  documentsearch:
    in: internal/documentsearch/**
  searchmetrics:
    in: internal/documentsearch/searchmetrics/**
  searchtest:
    in: internal/documentsearch/searchtest/**
  nodestatus:
    in: internal/nodestatus/**
  eviction:
    in: internal/eviction/**
  metrics:
    in: internal/metrics/**
  pagerwi:
    in: internal/pagerwi/**
  scraperequestintake:
    in: internal/scraperequestintake/**
  crawlbroker:
    in: internal/crawlbroker/**
  cmd:
    in:
      - cmd/yacy-peer-hash/**
      - cmd/yacy-rwi-node/**

vendors:
  yacymodel:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/yacymodel
      - github.com/nikitakarpei/yacy-rwi-node/yacymodel/**
  yacyproto:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/yacyproto
      - github.com/nikitakarpei/yacy-rwi-node/yacyproto/**
  yacycrawlcontract:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract/**
  scraperequestcontract:
    in: github.com/nikitakarpei/yacy-rwi-node/scraperequestcontract
  vault:
    in: github.com/nikitakarpei/yacy-rwi-node/vault
  boltvault:
    in: github.com/nikitakarpei/yacy-rwi-node/vaultengines/boltvault
  prometheus:
    in:
      - github.com/prometheus/client_golang/prometheus
      - github.com/prometheus/client_golang/prometheus/**
      - github.com/prometheus/client_model/go
  nats:
    in:
      - github.com/nats-io/nats.go
      - github.com/nats-io/nats.go/**
  pagescrape:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/pagescrape
      - github.com/nikitakarpei/yacy-rwi-node/pagescrape/**
  canonicalurl:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl/**
  serviceruntime:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/jetstreamconnect
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/applog
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/httpaccesslog
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/httpobservation
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/opsmetrics
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/servergroup
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/envconfig
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/poisonhalt
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/pullintake

deps:
  hashcodec:
    canUse:
      - vault
  httpguard:
    canUse:
      - yacyproto
  nodeconfiguration:
    canUse:
      - serviceruntime
      - yacyproto
      - yacycrawlcontract
      - scraperequestcontract
      - pagescrape
  nodeidentity:
    canUse:
      - yacyproto
  peeradmission:
    mayDependOn:
      - httpguard
      - nodeidentity
    canUse:
      - yacyproto
  peerroster:
    mayDependOn:
      - hashcodec
    canUse:
      - yacyproto
      - vault
  peerannouncement:
    mayDependOn:
      - peerwire
      - bootstrap
    canUse:
      - yacyproto
  peerwire:
    canUse:
      - yacyproto
  nodepeerhash:
    canUse:
      - vault
  bootstrap:
    canUse:
      - yacyproto
  urlmeta:
    mayDependOn:
      - hashcodec
      - httpguard
      - nodeidentity
    canUse:
      - yacyproto
      - vault
  urlmetastaleness:
    mayDependOn:
      - urlmeta
      - hashcodec
    canUse:
      - vault
  urlreferences:
    mayDependOn:
      - rwipostings
      - hashcodec
    canUse:
      - vault
  rwipostings:
    mayDependOn:
      - hashcodec
    canUse:
      - vault
  rwiescrow:
    mayDependOn:
      - rwipostings
      - urlmeta
      - hashcodec
    canUse:
      - vault
  rwiadmission:
    mayDependOn:
      - rwipostings
      - rwiescrow
      - urlmeta
    canUse:
      - vault
  rwiingress:
    mayDependOn:
      - rwiadmission
      - httpguard
      - nodeidentity
    canUse:
      - yacyproto
  rwidistribution:
    mayDependOn:
      - rwidistribution
      - rwipostings
      - hashcodec
      - urlmeta
      - postingcourier
      - urlmetadatacourier
    canUse:
      - vault
  postingcourier:
    mayDependOn:
      - peerwire
    canUse:
      - yacyproto
  urlmetadatacourier:
    mayDependOn:
      - peerwire
    canUse:
      - yacyproto
  documentsearch:
    mayDependOn:
      - documentsearch
      - searchmetrics
      - rwipostings
      - urlmeta
      - httpguard
      - nodeidentity
    canUse:
      - yacyproto
  searchmetrics:
    canUse:
      - prometheus
  nodestatus:
    mayDependOn:
      - httpguard
      - nodeidentity
    canUse:
      - yacyproto
  eviction:
    mayDependOn:
      - rwipostings
      - urlmeta
      - urlmetastaleness
      - urlreferences
    canUse:
      - vault
  metrics:
    mayDependOn:
      - eviction
      - rwiadmission
    canUse:
      - prometheus
      - vault
  pagerwi:
    canUse:
      - pagescrape
  scraperequestintake:
    mayDependOn:
      - pagerwi
      - urlmeta
      - rwiadmission
    canUse:
      - yacycrawlcontract
      - scraperequestcontract
      - pagescrape
      - nats
      - serviceruntime
  crawlbroker:
    canUse:
      - yacycrawlcontract
      - scraperequestcontract
      - nats
      - serviceruntime
  cmd:
    anyProjectDeps: true
    anyVendorDeps: true

excludeFiles:
  - "test/e2e"
  - "_test\\.go"
