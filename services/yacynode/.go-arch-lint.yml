version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  vault:
    in: internal/vault/**
  boltvault:
    in: internal/boltvault/**
  memvault:
    in: internal/memvault/**
  vaulttest:
    in: internal/vaulttest/**
  httpguard:
    in: internal/httpguard/**
  nodeidentity:
    in: internal/nodeidentity/**
  peeradmission:
    in: internal/peeradmission/**
  peerroster:
    in: internal/peerroster/**
  peerannouncement:
    in: internal/peerannouncement/**
  peerwire:
    in: internal/peerwire/**
  bootstrap:
    in: internal/bootstrap/**
  landing:
    in: internal/landing/**
  crawling:
    in: internal/crawling/**
  urlmeta:
    in: internal/urlmeta/**
  urlmetastaleness:
    in: internal/urlmetastaleness/**
  urlreferences:
    in: internal/urlreferences/**
  rwipostings:
    in: internal/rwipostings/**
  rwiescrow:
    in: internal/rwiescrow/**
  rwiadmission:
    in: internal/rwiadmission/**
  rwiingress:
    in: internal/rwiingress/**
  rwidistribution:
    in: internal/rwidistribution/**
  documentsearch:
    in: internal/documentsearch/**
  nodestatus:
    in: internal/nodestatus/**
  eviction:
    in: internal/eviction/**
  metrics:
    in: internal/metrics/**
  crawlresults:
    in: internal/crawlresults/**
  crawlbroker:
    in: internal/crawlbroker/**
  cmd:
    in:
      - cmd/yacy-peer-hash/**
      - cmd/yacy-rwi-node/**

vendors:
  yacymodel:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/yacymodel
      - github.com/nikitakarpei/yacy-rwi-node/yacymodel/**
  yacyproto:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/yacyproto
      - github.com/nikitakarpei/yacy-rwi-node/yacyproto/**
  yacycrawlcontract:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract/**
  bbolt:
    in: go.etcd.io/bbolt
  prometheus:
    in:
      - github.com/prometheus/client_golang/prometheus
      - github.com/prometheus/client_golang/prometheus/**
  nats:
    in:
      - github.com/nats-io/nats.go
      - github.com/nats-io/nats.go/**
  natstestserver:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/natstestserver
  bytesize:
    in: github.com/nikitakarpei/yacy-rwi-node/bytesize
  serviceruntime:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/jetstreamconnect
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/applog
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/opsmetrics
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/servergroup
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/envconfig

deps:
  vault:
    mayDependOn:
      - vault
      - vaulttest
  boltvault:
    deepScan: false
    mayDependOn:
      - boltvault
      - vault
      - vaulttest
    canUse:
      - bbolt
  memvault:
    mayDependOn:
      - memvault
      - vault
      - vaulttest
  vaulttest:
    mayDependOn:
      - vaulttest
      - vault
  httpguard:
    mayDependOn:
      - httpguard
    canUse:
      - yacymodel
      - yacyproto
  nodeidentity:
    canUse:
      - yacymodel
      - yacyproto
  peeradmission:
    mayDependOn:
      - peeradmission
      - peerroster
      - httpguard
      - nodeidentity
    canUse:
      - yacymodel
      - yacyproto
  peerroster:
    mayDependOn:
      - peerroster
      - vault
      - memvault
    canUse:
      - yacymodel
      - yacyproto
  peerannouncement:
    mayDependOn:
      - peerannouncement
      - peerroster
      - peerwire
      - bootstrap
    canUse:
      - yacymodel
      - yacyproto
  peerwire:
    mayDependOn:
      - peerwire
    canUse:
      - yacyproto
  bootstrap:
    mayDependOn:
      - bootstrap
    canUse:
      - yacymodel
      - yacyproto
  landing:
    mayDependOn:
      - landing
  crawling:
    mayDependOn:
      - crawling
      - httpguard
    canUse:
      - yacymodel
      - yacyproto
  urlmeta:
    mayDependOn:
      - urlmeta
      - vault
      - memvault
      - httpguard
      - nodeidentity
    canUse:
      - yacymodel
      - yacyproto
  urlmetastaleness:
    mayDependOn:
      - urlmetastaleness
      - urlmeta
      - vault
      - memvault
    canUse:
      - yacymodel
  urlreferences:
    mayDependOn:
      - urlreferences
      - rwipostings
      - vault
      - memvault
    canUse:
      - yacymodel
  rwipostings:
    mayDependOn:
      - rwipostings
      - vault
      - memvault
    canUse:
      - yacymodel
  rwiescrow:
    mayDependOn:
      - rwiescrow
      - rwipostings
      - urlmeta
      - vault
      - memvault
    canUse:
      - yacymodel
  rwiadmission:
    mayDependOn:
      - rwiadmission
      - rwiescrow
      - rwipostings
      - urlmeta
      - vault
      - memvault
    canUse:
      - yacymodel
  rwiingress:
    mayDependOn:
      - rwiingress
      - rwiadmission
      - httpguard
      - nodeidentity
    canUse:
      - yacymodel
      - yacyproto
  rwidistribution:
    mayDependOn:
      - rwidistribution
      - rwipostings
      - urlmeta
      - peerroster
      - peerwire
      - vault
      - memvault
    canUse:
      - yacymodel
      - yacyproto
  documentsearch:
    mayDependOn:
      - documentsearch
      - rwipostings
      - urlmeta
      - httpguard
      - nodeidentity
    canUse:
      - yacymodel
      - yacyproto
  nodestatus:
    mayDependOn:
      - nodestatus
      - httpguard
      - nodeidentity
    canUse:
      - yacymodel
      - yacyproto
  eviction:
    mayDependOn:
      - eviction
      - rwipostings
      - urlmeta
      - urlmetastaleness
      - urlreferences
      - vault
      - memvault
    canUse:
      - yacymodel
  metrics:
    mayDependOn:
      - metrics
      - eviction
    canUse:
      - prometheus
  crawlresults:
    mayDependOn:
      - crawlresults
      - urlmeta
      - rwiadmission
    canUse:
      - yacycrawlcontract
      - yacymodel
  crawlbroker:
    mayDependOn:
      - crawlbroker
      - crawlresults
    canUse:
      - yacycrawlcontract
      - yacymodel
      - nats
      - natstestserver
      - serviceruntime
  cmd:
    mayDependOn:
      - vault
      - boltvault
      - memvault
      - httpguard
      - peeradmission
      - peerroster
      - peerannouncement
      - bootstrap
      - landing
      - crawling
      - urlmeta
      - rwipostings
      - rwiescrow
      - rwiadmission
      - rwiingress
      - rwidistribution
      - documentsearch
      - eviction
      - metrics
      - nodeidentity
      - nodestatus
      - urlmetastaleness
      - urlreferences
      - crawlresults
      - crawlbroker
    canUse:
      - yacycrawlcontract
      - yacymodel
      - yacyproto
      - prometheus
      - nats
      - natstestserver
      - bytesize
      - serviceruntime

excludeFiles:
  - "test/e2e"
