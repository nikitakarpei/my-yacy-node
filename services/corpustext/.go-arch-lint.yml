version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  scrapedpagedocument:
    in: internal/scrapedpagedocument/**
  languageindex:
    in: internal/languageindex/**
  searchindexeselasticsearch:
    in: internal/searchindexes/elasticsearch/**
  searchindexesmanticore:
    in: internal/searchindexes/manticore/**
  pageintake:
    in: internal/pageintake/**
  indexmetrics:
    in: internal/indexmetrics/**
  corpustextcmd:
    in: cmd/corpustext/**

vendors:
  yacycrawlcontract:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract/**
  scraperequestcontract:
    in: github.com/nikitakarpei/yacy-rwi-node/scraperequestcontract
  pageformats:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/pageformats
  pagefetch:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/pagefetch
  canonicalurl:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl/**
  documentextraction:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/documentextraction
  pagefetchershttp:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/pagefetch/pagefetchers/http
  searchdocument:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/searchdocument
      - github.com/nikitakarpei/yacy-rwi-node/searchdocument/**
  nats:
    in:
      - github.com/nats-io/nats.go
      - github.com/nats-io/nats.go/**
  prometheus:
    in:
      - github.com/prometheus/client_golang/**
  serviceruntime:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/jetstreamconnect
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/applog
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/opsmetrics
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/servergroup
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/envconfig
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/poisonhalt
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/pullintake

deps:
  scrapedpagedocument:
    canUse:
      - canonicalurl
      - documentextraction
      - searchdocument
  searchindexeselasticsearch:
    mayDependOn:
      - languageindex
    canUse:
      - searchdocument
  searchindexesmanticore:
    mayDependOn:
      - languageindex
    canUse:
      - searchdocument
  pageintake:
    mayDependOn:
      - scrapedpagedocument
    canUse:
      - yacycrawlcontract
      - scraperequestcontract
      - pageformats
      - pagefetch
      - searchdocument
      - serviceruntime
      - documentextraction
      - canonicalurl
  indexmetrics:
    canUse:
      - prometheus
  corpustextcmd:
    anyProjectDeps: true
    anyVendorDeps: true

excludeFiles:
  - "_test\\.go"
  - "test/e2e"
  - "contract"
