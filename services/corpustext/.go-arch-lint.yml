version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  crawledpagedocument:
    in: internal/crawledpagedocument/**
  languageindex:
    in: internal/languageindex/**
  searchindexeselasticsearch:
    in: internal/searchindexes/elasticsearch/**
  searchindexesmanticore:
    in: internal/searchindexes/manticore/**
  pageintake:
    in: internal/pageintake/**
  indexmetrics:
    in: internal/indexmetrics/**
  corpustextcmd:
    in: cmd/corpustext/**

vendors:
  yacycrawlcontract:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract/**
  searchdocument:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/searchdocument
      - github.com/nikitakarpei/yacy-rwi-node/searchdocument/**
  nats:
    in:
      - github.com/nats-io/nats.go
      - github.com/nats-io/nats.go/**
  prometheus:
    in:
      - github.com/prometheus/client_golang/**
  serviceruntime:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/jetstreamconnect
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/applog
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/opsmetrics
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/servergroup
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/envconfig
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/poisonhalt
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/pullintake

deps:
  crawledpagedocument:
    canUse:
      - yacycrawlcontract
      - searchdocument
  searchindexeselasticsearch:
    mayDependOn:
      - crawledpagedocument
      - languageindex
    canUse:
      - yacycrawlcontract
      - searchdocument
  searchindexesmanticore:
    mayDependOn:
      - crawledpagedocument
      - languageindex
    canUse:
      - yacycrawlcontract
      - searchdocument
  pageintake:
    canUse:
      - yacycrawlcontract
      - nats
      - serviceruntime
  indexmetrics:
    canUse:
      - prometheus
  corpustextcmd:
    anyProjectDeps: true
    anyVendorDeps: true

excludeFiles:
  - "_test\.go"
  - "test/e2e"
