version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  scrapedpagedocument:
    in: internal/scrapedpagedocument/**
  languageindex:
    in: internal/languageindex/**
  searchindexeselasticsearch:
    in: internal/searchindexes/elasticsearch/**
  searchindexesmanticore:
    in: internal/searchindexes/manticore/**
  pageintake:
    in: internal/pageintake/**
  intakereceiptsnats:
    in: internal/intakereceipts/nats/**
  intakereceiptpublicationobserversapplog:
    in: internal/intakereceiptpublicationobservers/applog/**
  intakereceiptpublicationobserversprometheus:
    in: internal/intakereceiptpublicationobservers/prometheus/**
  intakeprogressobserversapplog:
    in: internal/intakeprogressobservers/applog/**
  intakeprogressobserversprometheus:
    in: internal/intakeprogressobservers/prometheus/**
  corpustextcmd:
    in: cmd/corpustext/**

vendors:
  pagescrapecontract:
    in: github.com/nikitakarpei/yacy-rwi-node/pagescrapecontract
  pageformats:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/pageformats
  canonicalurl:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl/**
  documentextraction:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/documentextraction
  searchdocument:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/searchdocument
      - github.com/nikitakarpei/yacy-rwi-node/searchdocument/**
  nats:
    in:
      - github.com/nats-io/nats.go
      - github.com/nats-io/nats.go/**
  prometheus:
    in:
      - github.com/prometheus/client_golang/**
  serviceruntime:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/jetstreamconnect
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/applog
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/opsmetrics
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/servergroup
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/envconfig
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/poisonhalt
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/pullintake

deps:
  scrapedpagedocument:
    canUse:
      - canonicalurl
      - documentextraction
      - searchdocument
  searchindexeselasticsearch:
    mayDependOn:
      - languageindex
    canUse:
      - searchdocument
  searchindexesmanticore:
    mayDependOn:
      - languageindex
    canUse:
      - searchdocument
  pageintake:
    mayDependOn:
      - scrapedpagedocument
    canUse:
      - pagescrapecontract
      - pageformats
      - searchdocument
      - serviceruntime
      - documentextraction
      - canonicalurl
  intakereceiptsnats:
    canUse:
      - pagescrapecontract
      - canonicalurl
      - nats
  intakereceiptpublicationobserversapplog:
    canUse:
      - canonicalurl
  intakereceiptpublicationobserversprometheus:
    canUse:
      - canonicalurl
      - prometheus
  intakeprogressobserversapplog:
    canUse:
      - canonicalurl
  intakeprogressobserversprometheus:
    canUse:
      - canonicalurl
      - prometheus
  corpustextcmd:
    anyProjectDeps: true
    anyVendorDeps: true

excludeFiles:
  - "_test\\.go"
  - "test/e2e"
  - "contract"
