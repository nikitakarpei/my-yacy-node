version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  scrapedpagedocument:
    in: internal/scrapedpagedocument/**
  languageindex:
    in: internal/languageindex/**
  searchindexeselasticsearch:
    in: internal/searchindexes/elasticsearch/**
  searchindexesmanticore:
    in: internal/searchindexes/manticore/**
  searchindexesbleve:
    in: internal/searchindexes/bleve/**
  pageintake:
    in: internal/pageintake/**
  pageofferopening:
    in: internal/pageofferopening/**
  pageofferopeningobserversapplog:
    in: internal/pageofferopeningobservers/applog/**
  textsearch:
    in: internal/textsearch/**
  hitsreply:
    in: internal/hitsreply/**
  textsearchreceivershttp:
    in: internal/textsearchreceivers/http/**
  textsearchobserversapplog:
    in: internal/textsearchobservers/applog/**
  textsearchobserversprometheus:
    in: internal/textsearchobservers/prometheus/**
  intakereceiptsnats:
    in: internal/intakereceipts/nats/**
  intakereceiptpublicationobserversapplog:
    in: internal/intakereceiptpublicationobservers/applog/**
  intakereceiptpublicationobserversprometheus:
    in: internal/intakereceiptpublicationobservers/prometheus/**
  pageintakeobserversapplog:
    in: internal/pageintakeobservers/applog/**
  pageintakeobserversprometheus:
    in: internal/pageintakeobservers/prometheus/**
  corpustextcmd:
    in: cmd/corpustext/**

vendors:
  pagescrapecontract:
    in: github.com/nikitakarpei/yacy-rwi-node/pagescrapecontract
  pageformats:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/pageformats
  canonicalurl:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl/**
  documentextraction:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/documentextraction
  searchdocument:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/searchdocument
      - github.com/nikitakarpei/yacy-rwi-node/searchdocument/**
  bleve:
    in:
      - github.com/blevesearch/bleve/v2
      - github.com/blevesearch/bleve/v2/**
  nats:
    in:
      - github.com/nats-io/nats.go
      - github.com/nats-io/nats.go/**
  prometheus:
    in:
      - github.com/prometheus/client_golang/**
  serviceruntime:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/jetstreamconnect
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/applog
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/opsmetrics
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/servergroup
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/envconfig
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/poisonhalt
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/pullintake

deps:
  scrapedpagedocument:
    canUse:
      - canonicalurl
      - documentextraction
      - searchdocument
  searchindexeselasticsearch:
    mayDependOn:
      - hitsreply
      - languageindex
      - textsearch
    canUse:
      - searchdocument
  searchindexesmanticore:
    mayDependOn:
      - hitsreply
      - languageindex
      - textsearch
    canUse:
      - searchdocument
  searchindexesbleve:
    mayDependOn:
      - languageindex
      - textsearch
    canUse:
      - searchdocument
      - bleve
  pageintake:
    mayDependOn:
      - scrapedpagedocument
    canUse:
      - pagescrapecontract
      - pageformats
      - searchdocument
      - serviceruntime
      - documentextraction
      - canonicalurl
  textsearch:
    canUse:
      - documentextraction
      - searchdocument
  hitsreply:
    canUse:
      - searchdocument
  textsearchreceivershttp:
    mayDependOn:
      - textsearch
    canUse:
      - searchdocument
  textsearchobserversapplog:
    mayDependOn:
      - textsearch
  textsearchobserversprometheus:
    mayDependOn:
      - textsearch
    canUse:
      - prometheus
  intakereceiptsnats:
    canUse:
      - pagescrapecontract
      - canonicalurl
      - nats
  intakereceiptpublicationobserversapplog:
    canUse:
      - canonicalurl
  intakereceiptpublicationobserversprometheus:
    canUse:
      - canonicalurl
      - prometheus
  pageintakeobserversapplog:
    canUse:
      - canonicalurl
  pageintakeobserversprometheus:
    canUse:
      - canonicalurl
      - prometheus
  corpustextcmd:
    anyProjectDeps: true
    anyVendorDeps: true

excludeFiles:
  - "_test\\.go"
  - "test/e2e"
  - "contract"
