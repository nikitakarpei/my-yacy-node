version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  crawledpagedocument:
    in: internal/crawledpagedocument/**
  languageindex:
    in: internal/languageindex/**
  elasticsearchindex:
    in: internal/elasticsearchindex/**
  manticoreindex:
    in: internal/manticoreindex/**
  pageintake:
    in: internal/pageintake/**
  indexmetrics:
    in: internal/indexmetrics/**
  corpustextcmd:
    in: cmd/corpustext/**

vendors:
  yacycrawlcontract:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract/**
  searchdocument:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/searchdocument
      - github.com/nikitakarpei/yacy-rwi-node/searchdocument/**
  nats:
    in:
      - github.com/nats-io/nats.go
      - github.com/nats-io/nats.go/**
  natstestserver:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/natstestserver
  prometheus:
    in:
      - github.com/prometheus/client_golang/**
  serviceruntime:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/jetstreamconnect
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/applog
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/opsmetrics
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/servergroup
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/envconfig
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/poisonhalt
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/pullintake

deps:
  crawledpagedocument:
    mayDependOn:
      - crawledpagedocument
    canUse:
      - yacycrawlcontract
      - searchdocument
  languageindex:
    mayDependOn:
      - languageindex
  elasticsearchindex:
    mayDependOn:
      - elasticsearchindex
      - crawledpagedocument
      - languageindex
    canUse:
      - yacycrawlcontract
      - searchdocument
  manticoreindex:
    mayDependOn:
      - manticoreindex
      - crawledpagedocument
      - languageindex
    canUse:
      - yacycrawlcontract
      - searchdocument
  pageintake:
    mayDependOn:
      - pageintake
    canUse:
      - yacycrawlcontract
      - nats
      - natstestserver
      - serviceruntime
  indexmetrics:
    mayDependOn:
      - indexmetrics
    canUse:
      - prometheus
  corpustextcmd:
    anyProjectDeps: true
    anyVendorDeps: true

excludeFiles:
  - "test/e2e"
