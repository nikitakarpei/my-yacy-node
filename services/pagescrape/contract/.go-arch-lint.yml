version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  pagescrapecontract:
    in: .

deps:
  pagescrapecontract:
    canUse:
      - canonicalurl
      - intotostatements
      - optional
      - pagefetch

vendors:
  intotostatements:
    in: github.com/nikitakarpei/yacy-rwi-node/intotostatements
  canonicalurl:
    in: github.com/nikitakarpei/yacy-rwi-node/canonicalurl
  pagefetch:
    in: github.com/nikitakarpei/yacy-rwi-node/pagefetch
  optional:
    in: github.com/nikitakarpei/yacy-rwi-node/optional

excludeFiles:
  - "_test\\.go"
