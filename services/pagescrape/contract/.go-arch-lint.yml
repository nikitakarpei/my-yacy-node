version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  pagescrapecontract:
    in: .

deps:
  pagescrapecontract:
    canUse:
      - canonicalurl
      - pagefetch

vendors:
  canonicalurl:
    in: github.com/nikitakarpei/yacy-rwi-node/canonicalurl
  pagefetch:
    in: github.com/nikitakarpei/yacy-rwi-node/pagefetch

excludeFiles:
  - "_test\\.go"
