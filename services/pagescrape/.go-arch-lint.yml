version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

commonVendors:
  - canonicalurl

components:
  scrapeintake:
    in: internal/scrapeintake/**
  offerissuersattested:
    in: internal/offerissuers/attested/**
  offerissuersunattested:
    in: internal/offerissuers/unattested/**
  offerattestationobserversapplog:
    in: internal/offerattestationobservers/applog/**
  scrapestreamsjetstream:
    in: internal/scrapestreams/jetstream/**
  pageofferpublishersjetstream:
    in: internal/pageofferpublishers/jetstream/**
  scrapeoutcomefeedsnats:
    in: internal/scrapeoutcomefeeds/nats/**
  scrapeoutcomefeedobserversapplog:
    in: internal/scrapeoutcomefeedobservers/applog/**
  scrapeoutcomefeedobserversprometheus:
    in: internal/scrapeoutcomefeedobservers/prometheus/**
  scrapeintakeobserversapplog:
    in: internal/scrapeintakeobservers/applog/**
  scrapeintakeobserversprometheus:
    in: internal/scrapeintakeobservers/prometheus/**
  pagescrapeassembly:
    in: assembly/**
  pagescrapecmd:
    in: cmd/pagescrape/**

vendors:
  pagescrapecontract:
    in: github.com/nikitakarpei/yacy-rwi-node/pagescrapecontract
  canonicalurl:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl/**
  pagefetch:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/pagefetch
  redirectfollowingfetch:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/pagefetch/redirectfollowingfetch
  attestedstatements:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/attestedstatements
  verifier:
    in:
      - github.com/nikitakarpei/hardware-attested-statements/verifier
      - github.com/nikitakarpei/hardware-attested-statements/verifier/predicates/httpresponse
  nats:
    in:
      - github.com/nats-io/nats.go
      - github.com/nats-io/nats.go/**
  prometheus:
    in:
      - github.com/prometheus/client_golang/**
  serviceruntime:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/applog
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/opsmetrics
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/servergroup
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/poisonhalt
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/pullintake
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/servicehealth
  jetstreamconnect:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/jetstreamconnect

deps:
  scrapeintake:
    canUse:
      - pagescrapecontract
      - pagefetch
      - redirectfollowingfetch
      - serviceruntime
  offerissuersattested:
    canUse:
      - attestedstatements
      - pagescrapecontract
      - redirectfollowingfetch
      - verifier
  offerissuersunattested:
    canUse:
      - pagescrapecontract
      - redirectfollowingfetch
  scrapestreamsjetstream:
    canUse:
      - pagescrapecontract
      - nats
  pageofferpublishersjetstream:
    canUse:
      - pagescrapecontract
      - nats
  scrapeoutcomefeedsnats:
    canUse:
      - pagescrapecontract
      - nats
  scrapeoutcomefeedobserversapplog:
    canUse:
      - canonicalurl
  scrapeoutcomefeedobserversprometheus:
    canUse:
      - prometheus
  scrapeintakeobserversapplog:
    canUse:
      - pagescrapecontract
      - serviceruntime
  scrapeintakeobserversprometheus:
    canUse:
      - pagescrapecontract
      - prometheus
  pagescrapeassembly:
    anyProjectDeps: true
    anyVendorDeps: true
  pagescrapecmd:
    mayDependOn:
      - pagescrapeassembly
    canUse:
      - serviceruntime
      - jetstreamconnect

excludeFiles:
  - "_test\\.go"
  - "test/e2e"
  - "contract"
