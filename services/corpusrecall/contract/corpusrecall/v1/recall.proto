syntax = "proto3";

package corpusrecall.v1;

option go_package = "github.com/nikitakarpei/yacy-rwi-node/corpusrecallapi/corpusrecall/v1;corpusrecallv1";

// Recall yields an operator's own corpus representation of a requested URL,
// crawling on demand to fill or refresh it.
service Recall {
  rpc Recall(RecallRequest) returns (RecallResponse);
}

// RepresentationKind names a corpus representation of a page.
enum RepresentationKind {
  REPRESENTATION_KIND_UNSPECIFIED = 0;
  REPRESENTATION_KIND_MARKDOWN = 1;
  REPRESENTATION_KIND_TEXT = 2;
}

message RecallRequest {
  string url = 1;
  repeated RepresentationKind kinds = 2;
}

// MarkdownRepresentation is a page rendered as markdown.
message MarkdownRepresentation {
  string canonical_url = 1;
  string markdown = 2;
}

// TextRepresentation is a page's extracted plain text with its metadata.
message TextRepresentation {
  string canonical_url = 1;
  string title = 2;
  string text = 3;
  string language = 4;
}

message Representation {
  oneof representation {
    MarkdownRepresentation markdown = 1;
    TextRepresentation text = 2;
  }
}

message RecallResponse {
  repeated Representation representations = 1;
  repeated RepresentationKind unavailable = 2;
}
