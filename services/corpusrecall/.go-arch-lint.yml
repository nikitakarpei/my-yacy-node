version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  pagerecall:
    in: internal/recall/pagerecall/**
  pagerepresentationsmarkdown:
    in: internal/pagerepresentations/markdown/**
  redirectresolversjetstream:
    in: internal/redirectresolvers/jetstream/**
  disposedpagesjetstream:
    in: internal/disposedpages/jetstream/**
  crawlorderplacersjetstream:
    in: internal/crawlorderplacers/jetstream/**
  recallreceiversgrpc:
    in: internal/recallreceivers/grpc/**
  progressobserversprometheus:
    in: internal/progressobservers/prometheus/**
  corpusrecallcmd:
    in: cmd/corpusrecall/**

vendors:
  canonicalurl:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl/**
  pagemarkdownstore:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/pagemarkdownstore
      - github.com/nikitakarpei/yacy-rwi-node/pagemarkdownstore/**
  yacycrawlcontract:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract/**
  corpusrecallapi:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/corpusrecallapi/corpusrecall/v1
  recallclienttest:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/corpusrecallapi/recallclienttest
  nats:
    in:
      - github.com/nats-io/nats.go
      - github.com/nats-io/nats.go/**
  natstestserver:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/natstestserver
  prometheus:
    in:
      - github.com/prometheus/client_golang/**
  grpc:
    in:
      - google.golang.org/grpc
      - google.golang.org/grpc/**
  uuid:
    in:
      - github.com/google/uuid
  serviceruntime:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/jetstreamconnect
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/applog
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/opsmetrics
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/servergroup
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/envconfig

deps:
  pagerecall:
    mayDependOn:
      - pagerecall
    canUse:
      - canonicalurl
  pagerepresentationsmarkdown:
    mayDependOn:
      - pagerepresentationsmarkdown
      - pagerecall
    canUse:
      - pagemarkdownstore
      - nats
      - natstestserver
  redirectresolversjetstream:
    mayDependOn:
      - redirectresolversjetstream
    canUse:
      - yacycrawlcontract
      - nats
      - natstestserver
  disposedpagesjetstream:
    mayDependOn:
      - disposedpagesjetstream
      - pagerecall
    canUse:
      - yacycrawlcontract
      - nats
      - natstestserver
  crawlorderplacersjetstream:
    mayDependOn:
      - crawlorderplacersjetstream
    canUse:
      - yacycrawlcontract
      - nats
      - natstestserver
      - uuid
  recallreceiversgrpc:
    mayDependOn:
      - recallreceiversgrpc
      - pagerecall
      - pagerepresentationsmarkdown
    canUse:
      - corpusrecallapi
      - recallclienttest
      - grpc
  progressobserversprometheus:
    mayDependOn:
      - progressobserversprometheus
      - pagerecall
    canUse:
      - prometheus
  corpusrecallcmd:
    mayDependOn:
      - corpusrecallcmd
      - pagerecall
      - pagerepresentationsmarkdown
      - redirectresolversjetstream
      - disposedpagesjetstream
      - crawlorderplacersjetstream
      - recallreceiversgrpc
      - progressobserversprometheus
    canUse:
      - corpusrecallapi
      - recallclienttest
      - pagemarkdownstore
      - yacycrawlcontract
      - nats
      - natstestserver
      - grpc
      - serviceruntime

excludeFiles:
  - "test/e2e"
