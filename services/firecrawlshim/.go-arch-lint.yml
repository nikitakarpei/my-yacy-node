version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  firecrawlscrape:
    in: internal/firecrawlscrape/**
  firecrawlshimcmd:
    in: cmd/firecrawlshim/**

vendors:
  corpusrecallapi:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/corpusrecallapi/corpusrecall/v1
  grpc:
    in:
      - google.golang.org/grpc
      - google.golang.org/grpc/**
  serviceruntime:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/applog
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/servergroup
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/envconfig

deps:
  firecrawlscrape:
    canUse:
      - corpusrecallapi
      - grpc
  firecrawlshimcmd:
    anyProjectDeps: true
    anyVendorDeps: true

excludeFiles:
  - "_test\\.go"
  - "test/e2e"
