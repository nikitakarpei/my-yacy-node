version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  visitintake:
    in: internal/visitintake/**
  visitlink:
    in: internal/visitlink/**
  crawlorderbroker:
    in: internal/crawlorderbroker/**
  visitmetrics:
    in: internal/visitmetrics/**
  visitcrawlcmd:
    in: cmd/visitcrawl/**

vendors:
  yacycrawlcontract:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract/**
  nats:
    in:
      - github.com/nats-io/nats.go
      - github.com/nats-io/nats.go/**
  natstestserver:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/natstestserver
  prometheus:
    in:
      - github.com/prometheus/client_golang/**
  uuid:
    in:
      - github.com/google/uuid
  serviceruntime:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/jetstreamconnect
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/applog
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/opsmetrics
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/servergroup
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/envconfig

deps:
  visitintake:
    mayDependOn:
      - visitintake
      - visitlink
    canUse:
      - yacycrawlcontract
      - uuid
  visitlink:
    mayDependOn:
      - visitlink
  crawlorderbroker:
    mayDependOn:
      - crawlorderbroker
    canUse:
      - yacycrawlcontract
      - nats
      - natstestserver
      - serviceruntime
  visitmetrics:
    mayDependOn:
      - visitmetrics
    canUse:
      - prometheus
  visitcrawlcmd:
    anyProjectDeps: true
    anyVendorDeps: true

excludeFiles:
  - "test/e2e"
