version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

commonVendors:
  - canonicalurl

components:
  visitintake:
    in: internal/visitintake/**
  visitlink:
    in: internal/visitlink/**
  crawlorderbroker:
    in: internal/crawlorderbroker/**
  crawlorderplacementobserversapplog:
    in: internal/crawlorderplacementobservers/applog/**
  crawlorderplacementobserversprometheus:
    in: internal/crawlorderplacementobservers/prometheus/**
  visitedpageobserversapplog:
    in: internal/visitedpageobservers/applog/**
  visitedpageobserversprometheus:
    in: internal/visitedpageobservers/prometheus/**
  visitcrawlcmd:
    in: cmd/visitcrawl/**

vendors:
  yacycrawlcontract:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract/**
  canonicalurl:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl/**
  nats:
    in:
      - github.com/nats-io/nats.go
      - github.com/nats-io/nats.go/**
  prometheus:
    in:
      - github.com/prometheus/client_golang/**
  uuid:
    in:
      - github.com/google/uuid
  serviceruntime:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/jetstreamconnect
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/applog
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/opsmetrics
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/servergroup
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/envconfig

deps:
  visitintake:
    mayDependOn:
      - visitlink
    canUse:
      - yacycrawlcontract
      - uuid
  crawlorderbroker:
    canUse:
      - yacycrawlcontract
      - nats
      - serviceruntime
  crawlorderplacementobserversapplog:
    mayDependOn:
      - visitintake
  crawlorderplacementobserversprometheus:
    mayDependOn:
      - visitintake
    canUse:
      - prometheus
  visitedpageobserversapplog:
    mayDependOn:
      - visitintake
  visitedpageobserversprometheus:
    mayDependOn:
      - visitintake
    canUse:
      - prometheus
  visitcrawlcmd:
    anyProjectDeps: true
    anyVendorDeps: true

excludeFiles:
  - "_test\\.go"
  - "test/e2e"
