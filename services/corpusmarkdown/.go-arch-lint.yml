version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

commonVendors:
  - canonicalurl

components:
  pageintake:
    in: internal/pageintake/**
  pageintakeobserversprometheus:
    in: internal/pageintakeobservers/prometheus/**
  pageintakeobserversapplog:
    in: internal/pageintakeobservers/applog/**
  pagemarkdowncorporajetstream:
    in: internal/pagemarkdowncorpora/jetstream/**
  markdownrecall:
    in: internal/markdownrecall/**
  markdownrecallreceivershttp:
    in: internal/markdownrecallreceivers/http/**
  intakereceiptsnats:
    in: internal/intakereceipts/nats/**
  intakereceiptpublicationobserversapplog:
    in: internal/intakereceiptpublicationobservers/applog/**
  intakereceiptpublicationobserversprometheus:
    in: internal/intakereceiptpublicationobservers/prometheus/**
  corpusmarkdowncmd:
    in: cmd/corpusmarkdown/**

vendors:
  yacycrawlcontract:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract/**
  pagescrapecontract:
    in: github.com/nikitakarpei/yacy-rwi-node/pagescrapecontract
  canonicalurl:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl/**
  pageformats:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/pageformats
  documentextraction:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/documentextraction
  pagemarkdownstore:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/pagemarkdownstore
      - github.com/nikitakarpei/yacy-rwi-node/pagemarkdownstore/**
  nats:
    in:
      - github.com/nats-io/nats.go
      - github.com/nats-io/nats.go/**
  prometheus:
    in:
      - github.com/prometheus/client_golang/**
  serviceruntime:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/jetstreamconnect
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/applog
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/opsmetrics
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/servergroup
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/envconfig
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/poisonhalt
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/pullintake

deps:
  pageintake:
    canUse:
      - pagescrapecontract
      - pageformats
      - serviceruntime
      - documentextraction
  pagemarkdowncorporajetstream:
    mayDependOn:
      - markdownrecall
    canUse:
      - pagemarkdownstore
      - yacycrawlcontract
      - pagescrapecontract
      - nats
  intakereceiptsnats:
    canUse:
      - pagescrapecontract
      - nats
  markdownrecallreceivershttp:
    mayDependOn:
      - markdownrecall
    canUse:
      - pagemarkdownstore
  intakereceiptpublicationobserversprometheus:
    canUse:
      - prometheus
  pageintakeobserversprometheus:
    canUse:
      - prometheus
  corpusmarkdowncmd:
    anyProjectDeps: true
    anyVendorDeps: true

excludeFiles:
  - "_test\\.go"
  - "test/e2e"
  - "contract"
