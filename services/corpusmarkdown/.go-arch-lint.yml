version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

commonVendors:
  - canonicalurl

components:
  markdownintake:
    in: internal/markdownintake/**
  scrapeprogressobserversprometheus:
    in: internal/scrapeprogressobservers/prometheus/**
  scrapeprogressobserversapplog:
    in: internal/scrapeprogressobservers/applog/**
  pagemarkdowncorporajetstream:
    in: internal/pagemarkdowncorpora/jetstream/**
  markdownrecall:
    in: internal/markdownrecall/**
  markdownrecallreceiversgrpc:
    in: internal/markdownrecallreceivers/grpc/**
  pageredirectionsjetstream:
    in: internal/pageredirections/jetstream/**
  corpusmarkdowncmd:
    in: cmd/corpusmarkdown/**

vendors:
  yacycrawlcontract:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract
      - github.com/nikitakarpei/yacy-rwi-node/yacycrawlcontract/**
  scrapedpage:
    in: github.com/nikitakarpei/yacy-rwi-node/scrapedpage
  scraperequestcontract:
    in: github.com/nikitakarpei/yacy-rwi-node/scraperequestcontract
  canonicalurl:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl/**
  pageformats:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/pageformats
  pagefetch:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/pagefetch
  documentextraction:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/documentextraction
  pagefetchershttp:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/pagefetch/pagefetchers/http
  pagemarkdownstore:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/pagemarkdownstore
      - github.com/nikitakarpei/yacy-rwi-node/pagemarkdownstore/**
  grpc:
    in:
      - google.golang.org/grpc
      - google.golang.org/grpc/**
  protobuf:
    in:
      - google.golang.org/protobuf
      - google.golang.org/protobuf/**
  nats:
    in:
      - github.com/nats-io/nats.go
      - github.com/nats-io/nats.go/**
  prometheus:
    in:
      - github.com/prometheus/client_golang/**
  serviceruntime:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/jetstreamconnect
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/applog
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/opsmetrics
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/servergroup
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/envconfig
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/poisonhalt
      - github.com/nikitakarpei/yacy-rwi-node/serviceruntime/pullintake

deps:
  markdownintake:
    canUse:
      - yacycrawlcontract
      - scraperequestcontract
      - scrapedpage
      - pageformats
      - pagefetch
      - serviceruntime
      - documentextraction
  pagemarkdowncorporajetstream:
    mayDependOn:
      - markdownrecall
    canUse:
      - pagemarkdownstore
      - yacycrawlcontract
      - scraperequestcontract
      - nats
  pageredirectionsjetstream:
    canUse:
      - nats
  markdownrecallreceiversgrpc:
    mayDependOn:
      - markdownrecall
    canUse:
      - pagemarkdownstore
      - grpc
      - protobuf
  scrapeprogressobserversprometheus:
    canUse:
      - prometheus
  corpusmarkdowncmd:
    anyProjectDeps: true
    anyVendorDeps: true

excludeFiles:
  - "_test\\.go"
  - "test/e2e"
  - "contract"
