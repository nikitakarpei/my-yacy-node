version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

commonVendors:
  - spamassessment

components:
  pageassessment:
    in: internal/pageassessment/**
  responsedeadline:
    in: internal/responsedeadline/**
  contentencoding:
    in: internal/contentencoding/**
  relayedheaders:
    in: internal/relayedheaders/**
  readingcancel:
    in: internal/readingcancel/**
  assessmentgate:
    in: internal/assessmentgate/**
  egresstransportstunnel:
    in: internal/egresstransports/tunnel/**
  egresstransportsabsoluteurl:
    in: internal/egresstransports/absoluteurl/**
  requestrelay:
    in: internal/requestrelay/**
  proxyintake:
    in: internal/proxyintake/**
  requestrelayobserversapplog:
    in: internal/requestrelayobservers/applog/**
  requestrelayobserversprometheus:
    in: internal/requestrelayobservers/prometheus/**
  assessmentgateobserversapplog:
    in: internal/assessmentgateobservers/applog/**
  assessmentgateobserversprometheus:
    in: internal/assessmentgateobservers/prometheus/**
  proxyintakeobserversapplog:
    in: internal/proxyintakeobservers/applog/**
  upstreamrequest:
    in: internal/upstreamrequest/**
  upstreamrequestobserversapplog:
    in: internal/upstreamrequestobservers/applog/**
  upstreamrequestobserversprometheus:
    in: internal/upstreamrequestobservers/prometheus/**
  spamproxycmd:
    in: cmd/spamproxy/**

vendors:
  spamassessment:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/spamassessment
      - github.com/nikitakarpei/yacy-rwi-node/spamassessment/httpheader
  canonicalurl:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl
  spammodel:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/spammodel
      - github.com/nikitakarpei/yacy-rwi-node/spammodel/htmlreading
      - github.com/nikitakarpei/yacy-rwi-node/spammodel/spamfeatures
  prometheus:
    in:
      - github.com/prometheus/client_golang/**

deps:
  pageassessment:
    canUse:
      - canonicalurl
      - spammodel
  relayedheaders:
    mayDependOn:
      - contentencoding
  assessmentgate:
    canUse:
      - canonicalurl
  requestrelay:
    mayDependOn:
      - assessmentgate
      - contentencoding
      - readingcancel
      - relayedheaders
      - responsedeadline
    canUse:
      - canonicalurl
  proxyintake:
    mayDependOn:
      - requestrelay
    canUse:
      - canonicalurl
  requestrelayobserversapplog:
    mayDependOn:
      - requestrelay
    canUse:
      - canonicalurl
  requestrelayobserversprometheus:
    mayDependOn:
      - requestrelay
    canUse:
      - canonicalurl
      - prometheus
  assessmentgateobserversapplog:
    canUse:
      - canonicalurl
  assessmentgateobserversprometheus:
    canUse:
      - canonicalurl
      - prometheus
  upstreamrequestobserversapplog:
    mayDependOn:
      - upstreamrequest
  upstreamrequestobserversprometheus:
    mayDependOn:
      - upstreamrequest
    canUse:
      - prometheus
  spamproxycmd:
    anyProjectDeps: true
    anyVendorDeps: true

excludeFiles:
  - "_test\\.go"
