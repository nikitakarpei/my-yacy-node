version: 3
workdir: .

allow:
  depOnAnyVendor: false
  deepScan: false

commonComponents:
  - spamassessment

components:
  spamassessment:
    in: internal/spamassessment/**
  replydeadline:
    in: internal/replydeadline/**
  contentencoding:
    in: internal/contentencoding/**
  relayedheaders:
    in: internal/relayedheaders/**
  readtimer:
    in: internal/readtimer/**
  assessmentgate:
    in: internal/assessmentgate/**
  egresstransportstunnel:
    in: internal/egresstransports/tunnel/**
  egresstransportsabsoluteurl:
    in: internal/egresstransports/absoluteurl/**
  requestrelay:
    in: internal/requestrelay/**
  proxyintake:
    in: internal/proxyintake/**
  requestrelayobserversapplog:
    in: internal/requestrelayobservers/applog/**
  requestrelayobserversprometheus:
    in: internal/requestrelayobservers/prometheus/**
  assessmentgateobserversapplog:
    in: internal/assessmentgateobservers/applog/**
  proxyintakeobserversapplog:
    in: internal/proxyintakeobservers/applog/**
  spamproxycmd:
    in: cmd/spamproxy/**

vendors:
  canonicalurl:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/canonicalurl
  spammodel:
    in:
      - github.com/nikitakarpei/yacy-rwi-node/spammodel
      - github.com/nikitakarpei/yacy-rwi-node/spammodel/htmlreading
      - github.com/nikitakarpei/yacy-rwi-node/spammodel/spamfeatures
  prometheus:
    in:
      - github.com/prometheus/client_golang/**

deps:
  spamassessment:
    canUse:
      - canonicalurl
      - spammodel
  relayedheaders:
    mayDependOn:
      - contentencoding
  assessmentgate:
    canUse:
      - canonicalurl
  requestrelay:
    mayDependOn:
      - assessmentgate
      - contentencoding
      - readtimer
      - relayedheaders
      - replydeadline
    canUse:
      - canonicalurl
  proxyintake:
    mayDependOn:
      - requestrelay
    canUse:
      - canonicalurl
  requestrelayobserversapplog:
    mayDependOn:
      - requestrelay
    canUse:
      - canonicalurl
  requestrelayobserversprometheus:
    mayDependOn:
      - requestrelay
    canUse:
      - canonicalurl
      - prometheus
  assessmentgateobserversapplog:
    canUse:
      - canonicalurl
  spamproxycmd:
    anyProjectDeps: true
    anyVendorDeps: true

excludeFiles:
  - "_test\\.go"
