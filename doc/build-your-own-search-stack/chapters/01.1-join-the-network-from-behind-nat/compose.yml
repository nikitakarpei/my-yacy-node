services:
  smokescreen:
    build:
      context: ../../building-blocks/smokescreen
    restart: unless-stopped
    command: ["--listen-ip", "0.0.0.0"]

  localhostrunagent:
    image: ghcr.io/nikitakarpei/localhostrunagent:latest
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    environment:
      HOME: /state
      LOCALHOSTRUN_AGENT_ADDRESS: 172.29.94.10
      YACY_NODE_ORIGIN: http://yacy-rwi-node:8090
      PROCESS_ENVIRONMENT_LEASE_SOCKET: /run/yacy/process-environment-lease.sock
      LOCALHOST_RUN_IDENTITY_FILE: ${LOCALHOST_RUN_IDENTITY_FILE:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - lease:/run/yacy
      - agent-state:/state
      - ./identity:/identity:ro
    networks:
      default:
        ipv4_address: 172.29.94.10

  yacy-rwi-node:
    image: ghcr.io/nikitakarpei/yacynode:latest
    restart: unless-stopped
    depends_on:
      localhostrunagent:
        condition: service_started
      smokescreen:
        condition: service_started
    ports:
      - "127.0.0.1:9090:9090"
    environment:
      PROCESS_ENVIRONMENT_LEASE_SOCKET: /run/yacy/process-environment-lease.sock
      YACY_TRUSTED_PROXIES: 172.29.94.10/32
      YACY_NETWORK_NAME: ${YACY_NETWORK_NAME:-freeworld}
      YACY_SEEDLIST_URLS: >-
        http://sixcooler.de/yacy/seed.txt,
        https://sonst.mifritscher.de/yacy/seed.txt,
        http://5.45.105.16/yacyseed,
        http://yacy.v16.de/seed/seed.txt,
        https://frank-siebert.de/seed.txt,
        http://seedlist.wertewesten.net/seed.txt
      YACY_DISTRIBUTION_ENABLED: "true"
      YACY_STORAGE_QUOTA: ${YACY_STORAGE_QUOTA:-1GB}
      EGRESS_PROXY_URL: http://smokescreen:4750
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - lease:/run/yacy
      - yacy-data:/data

networks:
  default:
    ipam:
      config:
        - subnet: 172.29.94.0/24

volumes:
  lease:
  agent-state:
  yacy-data:
