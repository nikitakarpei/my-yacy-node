services:
  smokescreen:
    build:
      context: ../../building-blocks/smokescreen
    restart: unless-stopped
    command: ["--listen-ip", "0.0.0.0"]

  nats:
    image: nats:2.14.2
    restart: unless-stopped
    command: ["-js", "--store_dir=/data", "-m", "8222"]
    volumes:
      - nats-data:/data

  scrape-requests-stream:
    image: natsio/nats-box:0.19.7
    depends_on:
      - nats
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until nats --server nats://nats:4222 stream info SCRAPE_REQUESTS >/dev/null 2>&1 ||
              nats --server nats://nats:4222 stream add SCRAPE_REQUESTS --defaults \
                --subjects scrape.request \
                --retention limits \
                --discard old \
                --max-msgs 100000 \
                --storage file
        do
          sleep 1
        done

  crawl-console:
    image: natsio/nats-box:0.19.7
    profiles:
      - console
    depends_on:
      - nats
    entrypoint: ["nats", "--server", "nats://nats:4222"]

  yacycrawler:
    image: ghcr.io/nikitakarpei/yacycrawler:latest
    restart: unless-stopped
    depends_on:
      scrape-requests-stream:
        condition: service_completed_successfully
      smokescreen:
        condition: service_started
    environment:
      CRAWL_NATS_URL: nats://nats:4222
      SCRAPE_REQUEST_NATS_URL: nats://nats:4222
      YACYCRAWLER_FETCH_PROXY_URL: http://smokescreen:4750
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  manticore:
    image: manticoresearch/manticore:27.1.5
    restart: unless-stopped
    volumes:
      - manticore-data:/var/lib/manticore

  corpustext:
    image: ghcr.io/nikitakarpei/corpustext:latest
    restart: unless-stopped
    depends_on:
      scrape-requests-stream:
        condition: service_completed_successfully
      manticore:
        condition: service_started
      smokescreen:
        condition: service_started
    environment:
      SCRAPE_REQUEST_NATS_URL: nats://nats:4222
      SCRAPE_PROXY_URL: http://smokescreen:4750
      SEARCH_INDEX_ENGINE: manticore
      MANTICORE_URL: http://manticore:9308
      CORPUSTEXT_LANGUAGES: ${CORPUSTEXT_LANGUAGES:-en}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  searxng-engines-seed:
    image: docker.io/searxng/searxng:2026.7.5-a6438586a
    entrypoint: ["true"]
    volumes:
      - searxng-engines:/usr/local/searxng/searx/engines

  searxng-crawled-text-search-init:
    image: ghcr.io/nikitakarpei/searxng-crawled-text-search:latest
    depends_on:
      searxng-engines-seed:
        condition: service_completed_successfully
    command: ["/payload/crawled_text_search.py", "/engines/crawled_text_search.py"]
    volumes:
      - searxng-engines:/engines

  searxng:
    image: docker.io/searxng/searxng:2026.7.5-a6438586a
    restart: unless-stopped
    depends_on:
      searxng-crawled-text-search-init:
        condition: service_completed_successfully
      manticore:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
      SEARXNG_SETTINGS_PATH: /etc/searxng/settings.yml
    volumes:
      - ../../building-blocks/searxng/settings-local-index.yml:/etc/searxng/settings.yml:ro
      - searxng-engines:/usr/local/searxng/searx/engines

  yacy-rwi-node:
    image: ghcr.io/nikitakarpei/yacynode:latest
    restart: unless-stopped
    depends_on:
      scrape-requests-stream:
        condition: service_completed_successfully
      smokescreen:
        condition: service_started
    ports:
      - "8090:8090"
      - "127.0.0.1:9090:9090"
    environment:
      YACY_ADVERTISE_HOST: ${YACY_ADVERTISE_HOST:?set YACY_ADVERTISE_HOST in .env}
      YACY_NETWORK_NAME: ${YACY_NETWORK_NAME:-freeworld}
      YACY_SEEDLIST_URLS: >-
        http://sixcooler.de/yacy/seed.txt,
        https://sonst.mifritscher.de/yacy/seed.txt,
        http://5.45.105.16/yacyseed,
        http://yacy.v16.de/seed/seed.txt,
        https://frank-siebert.de/seed.txt,
        http://seedlist.wertewesten.net/seed.txt
      YACY_DISTRIBUTION_ENABLED: "true"
      YACY_STORAGE_QUOTA: ${YACY_STORAGE_QUOTA:-1GB}
      EGRESS_PROXY_URL: http://smokescreen:4750
      SCRAPE_REQUEST_NATS_URL: nats://nats:4222
      SCRAPE_PROXY_URL: http://smokescreen:4750
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - yacy-data:/data

volumes:
  nats-data:
  yacy-data:
  manticore-data:
  searxng-engines:
