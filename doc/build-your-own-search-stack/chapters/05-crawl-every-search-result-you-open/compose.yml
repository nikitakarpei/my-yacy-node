x-searxng-image: &searxng-image ghcr.io/nikitakarpei/my-yacy-node/searxng:latest

services:
  smokescreen:
    image: ghcr.io/nikitakarpei/my-yacy-node/smokescreen:latest
    restart: unless-stopped
    command: ["--listen-ip", "0.0.0.0"]

  nats:
    image: nats:2.14.2
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ../../building-blocks/nats/nats.conf:/etc/nats/nats.conf:ro
      - nats-data:/data

  pagescrape:
    image: ghcr.io/nikitakarpei/my-yacy-node/pagescrape:latest
    restart: unless-stopped
    depends_on:
      nats:
        condition: service_started
      smokescreen:
        condition: service_started
    environment:
      SCRAPE_NATS_URL: nats://nats:4222
      SCRAPE_PROXY_URL: http://smokescreen:4750
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  crawl-console:
    image: natsio/nats-box:0.19.7
    profiles:
      - console
    depends_on:
      - nats
    entrypoint: ["nats", "--server", "nats://nats:4222"]

  crawlscrapebridge:
    image: ghcr.io/nikitakarpei/my-yacy-node/crawlscrapebridge:latest
    restart: unless-stopped
    depends_on:
      - nats
    environment:
      CRAWL_NATS_URL: nats://nats:4222
      SCRAPE_REQUEST_NATS_URL: nats://nats:4222
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  yacycrawler:
    image: ghcr.io/nikitakarpei/my-yacy-node/yacycrawler:latest
    restart: unless-stopped
    depends_on:
      pagescrape:
        condition: service_started
      smokescreen:
        condition: service_started
    environment:
      CRAWL_NATS_URL: nats://nats:4222
      YACYCRAWLER_FETCH_PROXY_URL: http://smokescreen:4750
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - yacycrawler-data:/data

  corpustext:
    image: ghcr.io/nikitakarpei/my-yacy-node/corpustext:latest
    restart: unless-stopped
    volumes:
      - corpustext-data:/var/lib/corpustext
    depends_on:
      pagescrape:
        condition: service_started
    environment:
      SCRAPE_PAGE_OFFER_NATS_URL: nats://nats:4222
      CORPUSTEXT_LANGUAGES: ${CORPUSTEXT_LANGUAGES:-en}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  visitcrawl:
    image: ghcr.io/nikitakarpei/my-yacy-node/visitcrawl:latest
    restart: unless-stopped
    depends_on:
      - nats
    environment:
      CRAWL_NATS_URL: nats://nats:4222
      VISITCRAWL_LINK_SECRET: ${VISITCRAWL_LINK_SECRET:?set VISITCRAWL_LINK_SECRET in .env}
      VISITCRAWL_SCOPE: ${VISITCRAWL_SCOPE:-domain}
      VISITCRAWL_MAX_DEPTH: ${VISITCRAWL_MAX_DEPTH:-1}
      VISITCRAWL_MAX_PAGES_PER_HOST: ${VISITCRAWL_MAX_PAGES_PER_HOST:-100}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  searxng-result-router-init:
    image: ghcr.io/nikitakarpei/my-yacy-node/searxng-result-router:latest
    command: ["/payload/result_link_router.py", "/plugins/result_link_router.py"]
    volumes:
      - searxng-plugins:/plugins

  searxng:
    image: *searxng-image
    restart: unless-stopped
    depends_on:
      searxng-result-router-init:
        condition: service_completed_successfully
      corpustext:
        condition: service_started
      visitcrawl:
        condition: service_started
      yacydhtsearch:
        condition: service_started
    environment:
      PYTHONPATH: /opt/searxng-plugins
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
      VISITCRAWL_LINK_SECRET: ${VISITCRAWL_LINK_SECRET:?set VISITCRAWL_LINK_SECRET in .env}
      SEARXNG_SETTINGS_PATH: /etc/searxng/settings.yml
    volumes:
      - ../../building-blocks/searxng/settings-local-index-yacy-network-and-visit-links.yml:/etc/searxng/settings.yml:ro
      - searxng-plugins:/opt/searxng-plugins:ro

  caddy:
    image: docker.io/library/caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      - searxng
      - visitcrawl
    ports:
      - "8080:8080"
    volumes:
      - ../../building-blocks/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  yacy-rwi-node:
    image: ghcr.io/nikitakarpei/my-yacy-node/yacynode:latest
    restart: unless-stopped
    depends_on:
      pagescrape:
        condition: service_started
      smokescreen:
        condition: service_started
    ports:
      - "8090:8090"
      - "127.0.0.1:9090:9090"
    environment:
      YACY_ADVERTISE_HOST: ${YACY_ADVERTISE_HOST-}
      YACY_NETWORK_NAME: &yacy-network-name ${YACY_NETWORK_NAME:-freeworld}
      YACY_SEEDLIST_URLS: &yacy-seedlist-urls >-
        http://sixcooler.de/yacy/seed.txt,
        https://sonst.mifritscher.de/yacy/seed.txt,
        http://5.45.105.16/yacyseed,
        http://yacy.v16.de/seed/seed.txt,
        https://frank-siebert.de/seed.txt,
        http://seedlist.wertewesten.net/seed.txt
      YACY_DISTRIBUTION_ENABLED: "true"
      YACY_STORAGE_QUOTA: ${YACY_STORAGE_QUOTA:-1GB}
      EGRESS_PROXY_URL: http://smokescreen:4750
      SCRAPE_PAGE_OFFER_NATS_URL: nats://nats:4222
      YACY_ACCEPT_REMOTE_INDEX: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - yacy-data:/data

  yacydhtsearch:
    image: ghcr.io/nikitakarpei/my-yacy-node/yacydhtsearch:latest
    restart: unless-stopped
    depends_on:
      smokescreen:
        condition: service_started
    environment:
      YACYDHTSEARCH_NETWORK_NAME: *yacy-network-name
      YACYDHTSEARCH_SEEDLIST_URLS: *yacy-seedlist-urls
      EGRESS_PROXY_URL: http://smokescreen:4750
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

volumes:
  yacycrawler-data:
  nats-data:
  yacy-data:
  corpustext-data:
  searxng-plugins:
  caddy-data:
  caddy-config:
