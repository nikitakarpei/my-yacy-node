services:
  smokescreen:
    build:
      context: ../../building-blocks/smokescreen
    restart: unless-stopped
    command: ["--listen-ip", "0.0.0.0"]

  nats:
    image: nats:2.14.2
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ../../building-blocks/nats/nats.conf:/etc/nats/nats.conf:ro
      - nats-data:/data

  pagescrape:
    image: ghcr.io/nikitakarpei/pagescrape:latest
    restart: unless-stopped
    depends_on:
      nats:
        condition: service_started
      smokescreen:
        condition: service_started
    environment:
      SCRAPE_NATS_URL: nats://nats:4222
      SCRAPE_PROXY_URL: http://smokescreen:4750
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  crawl-console:
    image: natsio/nats-box:0.19.7
    profiles:
      - console
    depends_on:
      - nats
    entrypoint: ["nats", "--server", "nats://nats:4222"]

  scrape-request-bridge:
    image: natsio/nats-box:0.19.7
    restart: unless-stopped
    depends_on:
      yacycrawler:
        condition: service_started
    environment:
      CRAWL_NATS_URL: nats://nats:4222
    volumes:
      - ../../building-blocks/scrape-request-bridge/relay-crawled-pages-as-scrape-requests.sh:/relay-crawled-pages-as-scrape-requests.sh:ro
    entrypoint: ["sh", "/relay-crawled-pages-as-scrape-requests.sh"]

  yacycrawler:
    image: ghcr.io/nikitakarpei/yacycrawler:latest
    restart: unless-stopped
    depends_on:
      pagescrape:
        condition: service_started
      smokescreen:
        condition: service_started
    environment:
      CRAWL_NATS_URL: nats://nats:4222
      YACYCRAWLER_FETCH_PROXY_URL: http://smokescreen:4750
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  yacy-rwi-node:
    image: ghcr.io/nikitakarpei/yacynode:latest
    restart: unless-stopped
    depends_on:
      pagescrape:
        condition: service_started
      smokescreen:
        condition: service_started
    ports:
      - "8090:8090"
      - "127.0.0.1:9090:9090"
    environment:
      YACY_ADVERTISE_HOST: ${YACY_ADVERTISE_HOST-}
      YACY_NETWORK_NAME: &yacy-network-name ${YACY_NETWORK_NAME:-freeworld}
      YACY_SEEDLIST_URLS: &yacy-seedlist-urls >-
        http://sixcooler.de/yacy/seed.txt,
        https://sonst.mifritscher.de/yacy/seed.txt,
        http://5.45.105.16/yacyseed,
        http://yacy.v16.de/seed/seed.txt,
        https://frank-siebert.de/seed.txt,
        http://seedlist.wertewesten.net/seed.txt
      YACY_DISTRIBUTION_ENABLED: "true"
      YACY_STORAGE_QUOTA: ${YACY_STORAGE_QUOTA:-1GB}
      EGRESS_PROXY_URL: http://smokescreen:4750
      SCRAPE_PAGE_OFFER_NATS_URL: nats://nats:4222
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - yacy-data:/data

  yacydhtsearch:
    image: ghcr.io/nikitakarpei/yacydhtsearch:latest
    restart: unless-stopped
    depends_on:
      smokescreen:
        condition: service_started
    environment:
      YACYDHTSEARCH_NETWORK_NAME: *yacy-network-name
      YACYDHTSEARCH_SEEDLIST_URLS: *yacy-seedlist-urls
      EGRESS_PROXY_URL: http://smokescreen:4750
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  searxng:
    image: docker.io/searxng/searxng:2026.7.5-a6438586a
    restart: unless-stopped
    depends_on:
      yacydhtsearch:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
      SEARXNG_SETTINGS_PATH: /etc/searxng/settings.yml
    volumes:
      - ../../building-blocks/searxng/settings-yacy-network.yml:/etc/searxng/settings.yml:ro

volumes:
  nats-data:
  yacy-data:
