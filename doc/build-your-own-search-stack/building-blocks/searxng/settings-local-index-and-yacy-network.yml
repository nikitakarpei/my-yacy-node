use_default_settings: true

search:
  formats:
    - html
    - json

engines:
  - name: crawled text search
    engine: json_engine
    shortcut: ct
    categories: general
    enable_http: true
    paging: true
    page_size: 10
    first_page_num: 0
    lang_all: ""
    search_url: http://corpustext:8096/search?query={query}&offset={pageno}&limit=10&language={lang}
    results_query: matches
    url_query: url
    title_query: title
    content_query: snippet

  - name: yacy
    engine: yacy
    shortcut: ya
    categories: general
    search_type: text
    disabled: false
    enable_http: true
    base_url: http://yacydhtsearch:8080
    timeout: 6.0
